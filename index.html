<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RH · Cantina em Casa / Lumar</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #F4F1EC; font-family: 'Segoe UI', system-ui, sans-serif; color: #1A1A1A; }
    input, select, textarea, button { font-family: inherit; }
    input[type=checkbox] { accent-color: #219653; }
    /* Impressão gerenciada via window.open() — sem @media print necessário */
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useCallback, useEffect } = React;

    const DIAS_SF = ["SEG","TER","QUA","QUI","SEX"];
    const DIAS_SS = ["SEG","TER","QUA","QUI","SEX","SAB"];
    const DIA_LABEL = {SEG:"Seg",TER:"Ter",QUA:"Qua",QUI:"Qui",SEX:"Sex",SAB:"Sáb"};
    const DIA_LABEL_FULL = {SEG:"Segunda",TER:"Terça",QUA:"Quarta",QUI:"Quinta",SEX:"Sexta",SAB:"Sábado"};
    const WEEKDAY_MAP = {1:"SEG",2:"TER",3:"QUA",4:"QUI",5:"SEX",6:"SAB",0:"DOM"};

    function fmtBRL(v){ return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
    function fmtDate(str){ if(!str) return ""; const[y,m,d]=str.split("-"); return `${d}/${m}/${y}`; }

    function parseDDMMYYYY(str){
      const[d,m,y]=str.split("/");
      return new Date(parseInt(y),parseInt(m)-1,parseInt(d));
    }
    function toISO(date){
      return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
    }
    function isPresente(bat1){
      if(!bat1||bat1.trim()===""||bat1.trim()==="00:00") return false;
      return true;
    }
    function parseCSV(text){
      const lines=text.trim().split(/\r?\n/);
      if(lines.length<2) throw new Error("Arquivo vazio ou inválido");
      const header=lines[0].split(";");
      if(!header[0].includes("Crach")) throw new Error("Formato não reconhecido. Verifique se é o arquivo do ponto.");
      const empMap={};
      const allDates=[];
      for(let i=1;i<lines.length;i++){
        const cols=lines[i].split(";");
        if(cols.length<8) continue;
        const cracha=cols[0].trim();
        const nome=cols[1].trim();
        const dataStr=cols[2].trim();
        const bat1=cols[7].trim();
        if(!cracha||!nome||!dataStr) continue;
        const dateObj=parseDDMMYYYY(dataStr);
        const weekday=dateObj.getDay();
        const diaKey=WEEKDAY_MAP[weekday];
        allDates.push(dateObj);
        if(!empMap[cracha]) empMap[cracha]={id:cracha,nome,presente:{},trabalhouSab:false};
        if(diaKey&&diaKey!=="DOM"){
          empMap[cracha].presente[diaKey]=isPresente(bat1);
          if(diaKey==="SAB"&&isPresente(bat1)) empMap[cracha].trabalhouSab=true;
        }
      }
      const employees=Object.values(empMap).map((e,i)=>({
        id:i+1, cracha:e.id, nome:e.nome,
        escala:e.trabalhouSab?"SEG-SAB":"SEG-SEX",
        presente:e.presente,
      }));
      const sorted=allDates.sort((a,b)=>a-b);
      return { employees, semanaIni:toISO(sorted[0]), semanaFim:toISO(sorted[sorted.length-1]) };
    }

    const C={
      bg:"#F4F1EC", card:"#FFF", pri:"#1B3A2B", acc:"#C8A843",
      text:"#1A1A1A", muted:"#888", border:"#E0DDD6",
      danger:"#A93226", rowAlt:"#F9F6F1", green:"#219653",
      greenBg:"#E8F5EE", amber:"#D4972A", amberBg:"#FFF8E7"
    };

    const s={
      wrap:{minHeight:"100vh",background:C.bg,fontFamily:"'Segoe UI',system-ui,sans-serif",color:C.text,display:"flex",flexDirection:"column"},
      header:{background:C.pri,color:"#fff",padding:"0 28px",height:60,display:"flex",alignItems:"center",gap:12,flexShrink:0,boxShadow:"0 2px 10px rgba(0,0,0,0.3)"},
      logo:{width:36,height:36,background:C.acc,borderRadius:9,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0},
      body:{display:"flex",flex:1,overflow:"hidden"},
      sidebar:{width:200,background:C.pri,padding:"20px 0",display:"flex",flexDirection:"column",gap:2,flexShrink:0},
      navBtn:(a)=>({background:a?"rgba(200,168,67,0.18)":"transparent",color:a?"#C8A843":"rgba(255,255,255,0.7)",border:"none",borderLeft:a?"3px solid #C8A843":"3px solid transparent",padding:"11px 20px",cursor:"pointer",fontWeight:a?700:400,fontSize:13,textAlign:"left",transition:"all 0.15s"}),
      main:{flex:1,overflow:"auto",padding:"24px 28px"},
      card:{background:C.card,borderRadius:12,padding:"20px 22px",marginBottom:18,boxShadow:"0 1px 4px rgba(0,0,0,0.06)",border:`1px solid ${C.border}`},
      cardTitle:{fontWeight:700,fontSize:13,color:C.pri,marginBottom:16,textTransform:"uppercase",letterSpacing:"0.05em",display:"flex",alignItems:"center",gap:7},
      label:{fontSize:11,fontWeight:700,color:C.muted,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:5,display:"block"},
      input:{border:`1.5px solid ${C.border}`,borderRadius:7,padding:"8px 12px",fontSize:13,outline:"none",background:"#FAFAF8",color:C.text,width:"100%"},
      select:{border:`1.5px solid ${C.border}`,borderRadius:7,padding:"8px 12px",fontSize:13,outline:"none",background:"#FAFAF8",color:C.text,cursor:"pointer"},
      btn:{background:C.pri,color:"#fff",border:"none",borderRadius:7,padding:"9px 18px",cursor:"pointer",fontWeight:700,fontSize:13,display:"inline-flex",alignItems:"center",gap:5},
      btnAcc:{background:C.acc,color:"#fff",border:"none",borderRadius:7,padding:"9px 18px",cursor:"pointer",fontWeight:700,fontSize:13,display:"inline-flex",alignItems:"center",gap:5},
      btnSm:{background:"transparent",color:C.danger,border:`1.5px solid ${C.danger}`,borderRadius:6,padding:"4px 9px",cursor:"pointer",fontSize:11,fontWeight:600},
      table:{width:"100%",borderCollapse:"collapse"},
      th:{textAlign:"left",padding:"9px 12px",background:"#EDE9E1",fontWeight:700,fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:"0.05em",borderBottom:`1px solid ${C.border}`},
      thC:{textAlign:"center",padding:"9px 8px",background:"#EDE9E1",fontWeight:700,fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:"0.05em",borderBottom:`1px solid ${C.border}`},
      td:{padding:"10px 12px",borderBottom:`1px solid #F0EDE8`,verticalAlign:"middle",fontSize:13},
      tdC:{padding:"10px 8px",borderBottom:`1px solid #F0EDE8`,verticalAlign:"middle",textAlign:"center",fontSize:13},
      badge:(e)=>({display:"inline-block",padding:"3px 8px",borderRadius:20,fontSize:10,fontWeight:700,background:e==="SEG-SAB"?C.amberBg:C.greenBg,color:e==="SEG-SAB"?C.amber:C.green}),
      row:(i)=>({background:i%2===0?"#fff":C.rowAlt}),
      grid2:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14},
      grid3:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:14},
      infoBox:{background:"#EBF5FB",border:"1px solid #AED6F1",borderRadius:8,padding:"11px 15px",fontSize:13,color:"#154360",marginBottom:14},
      warnBox:{background:C.amberBg,border:`1px solid ${C.amber}`,borderRadius:8,padding:"11px 15px",fontSize:13,color:"#6E4C1E",marginBottom:14},
      successBox:{background:C.greenBg,border:`1px solid ${C.green}`,borderRadius:8,padding:"11px 15px",fontSize:13,color:"#1A5631",marginBottom:14},
      dropZone:(drag)=>({border:`2px dashed ${drag?C.acc:C.border}`,borderRadius:10,padding:"32px 20px",textAlign:"center",background:drag?"#FFFBF0":"#FAFAF8",cursor:"pointer",transition:"all 0.2s",color:drag?C.acc:C.muted,marginBottom:14}),
      divider:{border:"none",borderTop:`1px solid ${C.border}`,margin:"14px 0"},
    };

    function App(){
      const [page,setPage]=useState("vt");
      const [empresa,setEmpresa]=useState(()=>localStorage.getItem("rh_empresa")||"Cantina em Casa / Lumar Alimentos");
      const [responsavel,setResponsavel]=useState(()=>localStorage.getItem("rh_responsavel")||"");
      const [passagemStr,setPassagemStr]=useState(()=>localStorage.getItem("rh_passagem")||"4,30");
      const [semanaIni,setSemanaIni]=useState(()=>localStorage.getItem("rh_semanaIni")||"");
      const [semanaFim,setSemanaFim]=useState(()=>localStorage.getItem("rh_semanaFim")||"");
      const [employees,setEmployees]=useState(()=>{ try{ return JSON.parse(localStorage.getItem("rh_employees")||"[]"); }catch(e){ return []; } });
      const [historico,setHistorico]=useState(()=>{ try{ return JSON.parse(localStorage.getItem("rh_historico")||"[]"); }catch(e){ return []; } });
      const [novoNome,setNovoNome]=useState("");
      const [novaEscala,setNovaEscala]=useState("SEG-SEX");
      const [csvStatus,setCsvStatus]=useState(null);
      const [drag,setDrag]=useState(false);
      const [vtTab,setVtTab]=useState("import");

      // Persiste config e semana atual no localStorage
      useEffect(()=>{ localStorage.setItem("rh_empresa",empresa); },[empresa]);
      useEffect(()=>{ localStorage.setItem("rh_responsavel",responsavel); },[responsavel]);
      useEffect(()=>{ localStorage.setItem("rh_passagem",passagemStr); },[passagemStr]);
      useEffect(()=>{ localStorage.setItem("rh_semanaIni",semanaIni); },[semanaIni]);
      useEffect(()=>{ localStorage.setItem("rh_semanaFim",semanaFim); },[semanaFim]);
      useEffect(()=>{ localStorage.setItem("rh_employees",JSON.stringify(employees)); },[employees]);
      useEffect(()=>{ localStorage.setItem("rh_historico",JSON.stringify(historico)); },[historico]);

      // Salva semana atual no histórico
      const salvarNoHistorico=useCallback(()=>{
        if(!semanaIni||!semanaFim||employees.length===0) return;
        const label=`${fmtDate(semanaIni)} a ${fmtDate(semanaFim)}`;
        setHistorico(prev=>{
          const semAlabel=prev.filter(h=>h.semanaIni!==semanaIni||h.semanaFim!==semanaFim);
          const novaEntrada={id:Date.now(),label,semanaIni,semanaFim,employees,importadoEm:new Date().toLocaleString("pt-BR")};
          return [novaEntrada,...semAlabel].slice(0,12); // guarda até 12 semanas
        });
      },[semanaIni,semanaFim,employees]);

      // Carrega semana do histórico
      const carregarDoHistorico=useCallback((entrada)=>{
        setEmployees(entrada.employees);
        setSemanaIni(entrada.semanaIni);
        setSemanaFim(entrada.semanaFim);
        setCsvStatus({ok:true,msg:`✅ Semana ${entrada.label} carregada do histórico.`});
      },[]);

      const valorPassagem=parseFloat(passagemStr.replace(",","."))||0;
      const getDias=(emp)=>{ const dias=emp.escala==="SEG-SAB"?DIAS_SS:DIAS_SF; return dias.filter(d=>emp.presente?.[d]).length; };
      const getValor=(emp)=>getDias(emp)*2*valorPassagem;
      const total=employees.reduce((s,e)=>s+getValor(e),0);
      const semanaLabel=semanaIni&&semanaFim?`${fmtDate(semanaIni)} a ${fmtDate(semanaFim)}`:"— período não definido —";

      const toggleAtt=(id,dia)=>setEmployees(p=>p.map(e=>e.id===id?{...e,presente:{...e.presente,[dia]:!e.presente?.[dia]}}:e));
      const setAllDay=(dia,val)=>setEmployees(p=>p.map(e=>{ const dias=e.escala==="SEG-SAB"?DIAS_SS:DIAS_SF; if(!dias.includes(dia)) return e; return{...e,presente:{...e.presente,[dia]:val}}; }));
      const removeEmp=(id)=>setEmployees(p=>p.filter(e=>e.id!==id));
      const addEmp=()=>{ if(!novoNome.trim()) return; setEmployees(p=>[...p,{id:Date.now(),nome:novoNome.trim(),escala:novaEscala,presente:{}}]); setNovoNome(""); };

      const handleFile=useCallback((file)=>{
        if(!file){ return; }
        if(!file.name.toLowerCase().endsWith(".csv")){ setCsvStatus({ok:false,msg:"Selecione um arquivo .csv exportado do ponto eletrônico."}); return; }
        const reader=new FileReader();
        reader.onload=(e)=>{
          try{
            const bytes=new Uint8Array(e.target.result);
            const text=new TextDecoder("iso-8859-1").decode(bytes);
            const {employees:emps,semanaIni:ini,semanaFim:fim}=parseCSV(text);
            setEmployees(emps.map((emp,i)=>({...emp,id:i+1})));
            setSemanaIni(ini);
            setSemanaFim(fim);
            setCsvStatus({ok:true,msg:`✅ ${emps.length} colaboradores importados. Período: ${fmtDate(ini)} a ${fmtDate(fim)}.`});
            // Salva automaticamente no histórico
            const lbl=`${fmtDate(ini)} a ${fmtDate(fim)}`;
            setHistorico(prev=>{
              const sem=prev.filter(h=>h.semanaIni!==ini||h.semanaFim!==fim);
              return [{id:Date.now(),label:lbl,semanaIni:ini,semanaFim:fim,employees:emps.map((e,i)=>({...e,id:i+1})),importadoEm:new Date().toLocaleString("pt-BR")},...sem].slice(0,12);
            });
          }catch(err){
            setCsvStatus({ok:false,msg:`Erro ao processar arquivo: ${err.message}`});
          }
        };
        reader.readAsArrayBuffer(file);
      },[]);

      const onDrop=useCallback((e)=>{ e.preventDefault(); setDrag(false); handleFile(e.dataTransfer.files[0]); },[handleFile]);

      // ── IMPRESSÃO via janela limpa (sem conflito com React/flex/overflow) ──
      const printRecibo=useCallback(()=>{
        const vp=parseFloat(passagemStr.replace(",","."))||0;
        const getD=(emp)=>{ const dias=emp.escala==="SEG-SAB"?DIAS_SS:DIAS_SF; return dias.filter(d=>emp.presente?.[d]).length; };
        const getV=(emp)=>getD(emp)*2*vp;
        const tot=employees.reduce((s,e)=>s+getV(e),0);
        const periodo=semanaIni&&semanaFim?`${fmtDate(semanaIni)} a ${fmtDate(semanaFim)}`:"—";
        const linhas=employees.map((emp,i)=>{
          const d=getD(emp); const v=getV(emp);
          const badge=emp.escala==="SEG-SAB"?"background:#FFF8E7;color:#D4972A":"background:#E8F5EE;color:#219653";
          return `<tr style="background:${i%2===0?'#fff':'#f9f9f9'}">
            <td style="text-align:center;color:#888;width:20px">${i+1}</td>
            <td style="font-weight:600;font-size:7.5pt">${emp.nome}</td>
            <td style="text-align:center;width:56px"><span style="padding:2px 5px;border-radius:20px;font-size:7pt;font-weight:700;${badge}">${emp.escala}</span></td>
            <td style="text-align:center;font-weight:700;width:36px">${d}</td>
            <td style="text-align:center;color:#666;width:36px">${d*2}</td>
            <td style="text-align:center;font-weight:800;color:#1B3A2B;width:46px">${fmtBRL(v)}</td>
            <td style="border-left:1px solid #ccc;width:150px">
              <div style="border-bottom:1px solid #999;height:20px;margin-top:4px"></div>
              <div style="font-size:7pt;color:#999;margin-top:2px">Data: ___/___/______</div>
            </td>
          </tr>`;
        }).join("");
        const totalPass=employees.reduce((s,e)=>s+getD(e)*2,0);
        const html=`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
        <title>Recibo VT — ${periodo}</title>
        <style>
          *{box-sizing:border-box;margin:0;padding:0}
          body{font-family:Arial,sans-serif;font-size:9pt;color:#111;padding:8mm 10mm}
          table{width:100%;border-collapse:collapse;margin-bottom:10px}
          th{background:#EDE9E1;font-size:7.5pt;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:4px 5px;border:1px solid #ccc;color:#555}
          td{padding:4px 5px;border:1px solid #ddd;vertical-align:middle;font-size:8pt}
          thead{display:table-header-group}
          tfoot{display:table-footer-group}
          tr{page-break-inside:avoid}
          .tfoot-row td{background:#1B3A2B!important;color:#fff;font-weight:800;font-size:10pt;padding:7px 10px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
          .tfoot-val{color:#C8A843!important;font-size:11pt}
          .resumo{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
          .resumo-item{flex:1;min-width:90px;border:1px solid #ddd;border-radius:6px;padding:7px 10px}
          .resumo-item.hl{border-left:4px solid #1B3A2B;background:#EAF5F0}
          .resumo-label{font-size:7pt;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
          .resumo-val{font-size:13pt;font-weight:800;color:#1B3A2B}
          .assinaturas{display:flex;gap:30px;margin-top:16px;padding-top:12px;border-top:1px dashed #ccc}
          .assin-item{flex:1}
          .assin-linha{border-bottom:1px solid #666;height:30px}
          .assin-label{text-align:center;font-size:8pt;color:#888;margin-top:4px}
          @media print{body{padding:5mm 7mm}}
        </style></head><body>
        <div style="border-bottom:3px solid #1B3A2B;padding-bottom:8px;margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;align-items:flex-end">
            <div>
              <div style="font-size:15pt;font-weight:800;color:#1B3A2B">${empresa}</div>
              <div style="font-size:8pt;color:#888;margin-top:2px">R. 11, 2-114 — Jardim Santo Antônio, Goiânia - GO</div>
            </div>
            <div style="text-align:right">
              <div style="font-size:8pt;color:#888">Período de referência</div>
              <div style="font-size:11pt;font-weight:700;color:#1B3A2B">${periodo}</div>
              ${responsavel?`<div style="font-size:8pt;color:#888">Resp.: ${responsavel}</div>`:""}
            </div>
          </div>
          <div style="margin-top:8px;font-size:11pt;font-weight:800;text-align:center;text-transform:uppercase;letter-spacing:.07em">Recibo de Vale Transporte</div>
        </div>
        <table>
          <thead><tr>
            <th style="width:20px">#</th>
            <th style="text-align:left">Nome do Colaborador</th>
            <th style="width:56px">Escala</th>
            <th style="width:36px">Dias</th>
            <th style="width:36px">Pass.</th>
            <th style="width:46px">Valor</th>
            <th style="width:150px;text-align:left">Assinatura / Data</th>
          </tr></thead>
          <tbody>${linhas}</tbody>
        </table>
        <div class="resumo">
          <div class="resumo-item"><div class="resumo-label">Colaboradores</div><div class="resumo-val">${employees.length}</div></div>
          <div class="resumo-item"><div class="resumo-label">Total passagens</div><div class="resumo-val">${totalPass}</div></div>
          <div class="resumo-item"><div class="resumo-label">Valor/passagem</div><div class="resumo-val">${fmtBRL(vp)}</div></div>
          <div class="resumo-item hl"><div class="resumo-label">Total a pagar</div><div class="resumo-val">${fmtBRL(tot)}</div></div>
        </div>
        <div class="assinaturas">
          <div class="assin-item"><div class="assin-linha"></div><div class="assin-label">Responsável pelo Pagamento</div><div class="assin-label">Data: ___/___/______</div></div>
          <div class="assin-item"><div class="assin-linha"></div><div class="assin-label">Conferência</div><div class="assin-label">Data: ___/___/______</div></div>
        </div>
        </body></html>`;
        // Iframe invisível — sem janela intermediária, print abre direto
        const old=document.getElementById("__print_iframe");
        if(old) old.remove();
        const iframe=document.createElement("iframe");
        iframe.id="__print_iframe";
        iframe.style.cssText="position:fixed;top:-9999px;left:-9999px;width:0;height:0;border:none";
        document.body.appendChild(iframe);
        iframe.contentDocument.open();
        iframe.contentDocument.write(html);
        iframe.contentDocument.close();
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
        // Remove após 2s (tempo suficiente para o diálogo de impressão carregar)
        setTimeout(()=>{ if(iframe.parentNode) iframe.remove(); }, 2000);
      },[employees,semanaIni,semanaFim,empresa,responsavel,passagemStr]);

      const vtTabs=[{k:"import",l:"📂 Importar CSV"},{k:"manual",l:"✏️ Manual"},{k:"ponto",l:"📋 Ponto"},{k:"recibo",l:"🖨️ Recibo"},{k:"hist",l:"📚 Histórico"}];
      const vtPageContent=(
          <div>
            <div style={{marginBottom:20}}>
              <div style={{fontSize:20,fontWeight:800,color:C.pri,marginBottom:4}}>🚌 Vale Transporte</div>
              <div style={{fontSize:13,color:C.muted}}>Controle semanal de presença e geração de recibo</div>
            </div>

            <div style={s.card}>
              <div style={s.cardTitle}>⚙️ Configurações</div>
              <div style={s.grid3}>
                <div><label style={s.label}>Empresa</label><input style={s.input} value={empresa} onChange={e=>setEmpresa(e.target.value)}/></div>
                <div><label style={s.label}>Responsável</label><input style={s.input} value={responsavel} onChange={e=>setResponsavel(e.target.value)} placeholder="Nome do responsável"/></div>
                <div>
                  <label style={s.label}>Valor da passagem (R$)</label>
                  <input style={s.input} value={passagemStr} onChange={e=>setPassagemStr(e.target.value)} placeholder="5,50"/>
                  <div style={{fontSize:11,color:C.muted,marginTop:4}}>1 presença = 2 × R$ {passagemStr} = <strong>{fmtBRL(valorPassagem*2)}</strong></div>
                </div>
              </div>
              <div style={{...s.grid2,marginTop:12}}>
                <div><label style={s.label}>Semana — Início</label><input style={s.input} type="date" value={semanaIni} onChange={e=>setSemanaIni(e.target.value)}/></div>
                <div><label style={s.label}>Semana — Fim</label><input style={s.input} type="date" value={semanaFim} onChange={e=>setSemanaFim(e.target.value)}/></div>
              </div>
            </div>

            <div className="no-print" style={{display:"flex",gap:4,marginBottom:18,borderBottom:`1px solid ${C.border}`,paddingBottom:0}}>
              {vtTabs.map(t=>(
                <button key={t.k} style={{...s.btn,background:vtTab===t.k?C.pri:"transparent",color:vtTab===t.k?"#fff":C.muted,border:"none",borderRadius:"7px 7px 0 0",fontSize:12,padding:"8px 16px"}} onClick={()=>setVtTab(t.k)}>{t.l}</button>
              ))}
            </div>

            {vtTab==="import"&&(
              <div style={s.card}>
                <div style={s.cardTitle}>📂 Importar arquivo do ponto eletrônico</div>
                <div style={s.infoBox}>
                  <strong>Formato esperado:</strong> arquivo <code>.csv</code> com separador <code>;</code> — o mesmo exportado pelo sistema de ponto eletrônico. A presença é detectada pela coluna <strong>1ª Batida</strong>.
                </div>
                <div style={s.dropZone(drag)} onDragOver={e=>{e.preventDefault();setDrag(true);}} onDragLeave={()=>setDrag(false)} onDrop={onDrop} onClick={()=>document.getElementById("csvInput").click()}>
                  <div style={{fontSize:32,marginBottom:8}}>📄</div>
                  <div style={{fontWeight:700,fontSize:15,marginBottom:4}}>Arraste o arquivo CSV aqui</div>
                  <div style={{fontSize:13}}>ou clique para selecionar</div>
                  <input id="csvInput" type="file" accept=".csv" style={{display:"none"}} onChange={e=>handleFile(e.target.files[0])}/>
                </div>
                {csvStatus&&<div style={csvStatus.ok?s.successBox:s.warnBox}>{csvStatus.msg}</div>}
                {employees.length>0&&(
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:C.rowAlt,borderRadius:8,padding:"10px 14px",border:`1px solid ${C.border}`}}>
                    <span style={{fontSize:13,fontWeight:600,color:C.pri}}>{employees.length} colaboradores · Semana: <strong>{semanaLabel}</strong></span>
                    <button style={s.btnAcc} onClick={()=>setVtTab("ponto")}>Ver Ponto →</button>
                  </div>
                )}
              </div>
            )}

            {vtTab==="manual"&&(
              <div style={s.card}>
                <div style={s.cardTitle}>✏️ Cadastro manual de colaboradores</div>
                <div style={s.infoBox}>Use quando o arquivo do ponto não estiver disponível. Vá para a aba <strong>Ponto</strong> para marcar as presenças.</div>
                {employees.length===0?(
                  <div style={{textAlign:"center",color:C.muted,padding:"20px 0",fontSize:13}}>Nenhum colaborador ainda.</div>
                ):(
                  <table style={{...s.table,marginBottom:14}}>
                    <thead><tr>
                      <th style={{...s.th,width:32}}>#</th>
                      <th style={s.th}>Nome</th>
                      <th style={{...s.th,width:160}}>Escala</th>
                      <th style={{...s.th,width:70}}></th>
                    </tr></thead>
                    <tbody>
                      {employees.map((emp,i)=>(
                        <tr key={emp.id} style={s.row(i)}>
                          <td style={{...s.tdC,color:C.muted}}>{i+1}</td>
                          <td style={s.td}><input style={{...s.input,fontSize:12}} value={emp.nome} onChange={e=>setEmployees(p=>p.map(x=>x.id===emp.id?{...x,nome:e.target.value}:x))}/></td>
                          <td style={s.td}>
                            <select style={{...s.select,width:"100%",fontSize:12}} value={emp.escala} onChange={e=>setEmployees(p=>p.map(x=>x.id===emp.id?{...x,escala:e.target.value}:x))}>
                              <option value="SEG-SEX">Seg → Sex</option>
                              <option value="SEG-SAB">Seg → Sáb</option>
                            </select>
                          </td>
                          <td style={s.tdC}><button style={s.btnSm} onClick={()=>removeEmp(emp.id)}>✕</button></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                )}
                <hr style={s.divider}/>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  <div style={{flex:1,minWidth:180}}><input style={s.input} placeholder="Nome do colaborador" value={novoNome} onChange={e=>setNovoNome(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addEmp()}/></div>
                  <select style={{...s.select,minWidth:140}} value={novaEscala} onChange={e=>setNovaEscala(e.target.value)}>
                    <option value="SEG-SEX">Seg → Sex</option>
                    <option value="SEG-SAB">Seg → Sáb</option>
                  </select>
                  <button style={s.btn} onClick={addEmp}>＋ Adicionar</button>
                </div>
              </div>
            )}

            {vtTab==="ponto"&&(
              <div>
                {employees.length===0?(
                  <div style={{...s.card,textAlign:"center",color:C.muted,padding:"32px"}}>Importe o CSV ou cadastre colaboradores primeiro.</div>
                ):(
                  <div style={s.card}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:8}}>
                      <div style={s.cardTitle}>📋 Semana: <span style={{color:C.acc,marginLeft:6}}>{semanaLabel}</span></div>
                      <div style={{fontSize:12,color:C.muted,background:C.rowAlt,borderRadius:7,padding:"6px 12px",border:`1px solid ${C.border}`}}>
                        ✅ presente &nbsp;|&nbsp; ⬜ falta &nbsp;|&nbsp; — fora da escala
                      </div>
                    </div>
                    <div style={{overflowX:"auto"}}>
                      <table style={s.table}>
                        <thead><tr>
                          <th style={{...s.th,minWidth:200}}>Colaborador</th>
                          <th style={{...s.th,width:80,textAlign:"center"}}>Escala</th>
                          {DIAS_SS.map(d=>(
                            <th key={d} style={{...s.thC,minWidth:56}}>
                              {DIA_LABEL[d]}
                              <div style={{marginTop:4,display:"flex",justifyContent:"center"}}>
                                <input type="checkbox" title={`Marcar todos — ${DIA_LABEL_FULL[d]}`} style={{width:12,height:12,cursor:"pointer"}} onChange={e=>setAllDay(d,e.target.checked)}/>
                              </div>
                            </th>
                          ))}
                          <th style={{...s.thC,minWidth:52}}>Dias</th>
                          <th style={{...s.thC,minWidth:82}}>VT</th>
                        </tr></thead>
                        <tbody>
                          {employees.map((emp,i)=>{
                            const diasEmp=emp.escala==="SEG-SAB"?DIAS_SS:DIAS_SF;
                            const dias=getDias(emp);
                            const valor=getValor(emp);
                            return(
                              <tr key={emp.id} style={s.row(i)}>
                                <td style={s.td}><span style={{fontWeight:600,fontSize:12}}>{emp.nome}</span></td>
                                <td style={s.tdC}><span style={s.badge(emp.escala)}>{emp.escala}</span></td>
                                {DIAS_SS.map(d=>{
                                  const works=diasEmp.includes(d);
                                  const checked=emp.presente?.[d]||false;
                                  return(
                                    <td key={d} style={{...s.tdC,background:!works?"#F0ECE8":checked?"#E6F5EC":undefined}}>
                                      {works?(
                                        <input type="checkbox" checked={checked} onChange={()=>toggleAtt(emp.id,d)} style={{width:15,height:15,cursor:"pointer"}}/>
                                      ):(
                                        <span style={{color:"#CCC",fontSize:12}}>—</span>
                                      )}
                                    </td>
                                  );
                                })}
                                <td style={{...s.tdC,fontWeight:700,color:dias>0?C.pri:C.muted}}>{dias}</td>
                                <td style={{...s.tdC,fontWeight:700,color:valor>0?C.green:C.muted,fontSize:12}}>{fmtBRL(valor)}</td>
                              </tr>
                            );
                          })}
                        </tbody>
                        <tfoot>
                          <tr style={{background:"#EDE9E1"}}>
                            <td style={{...s.td,fontWeight:800,fontSize:13}} colSpan={2}>TOTAL</td>
                            <td colSpan={DIAS_SS.length}/>
                            <td style={{...s.tdC,fontWeight:800}}>{employees.reduce((s,e)=>s+getDias(e),0)}</td>
                            <td style={{...s.tdC,fontWeight:900,color:C.pri,fontSize:14}}>{fmtBRL(total)}</td>
                          </tr>
                        </tfoot>
                      </table>
                    </div>
                  </div>
                )}
              </div>
            )}

            {vtTab==="recibo"&&(
              <div>
                <div style={s.card}>
                  <div className="no-print" style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
                    <div style={s.cardTitle}>🖨️ Recibo para impressão</div>
                    <button style={s.btnAcc} onClick={printRecibo}>🖨️ Gerar PDF / Imprimir</button>
                  </div>
                  <div id="print-area">
                    <div style={{borderBottom:`3px solid ${C.pri}`,paddingBottom:12,marginBottom:14}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end"}}>
                        <div>
                          <div style={{fontSize:18,fontWeight:800,color:C.pri}}>{empresa}</div>
                          <div style={{fontSize:11,color:C.muted,marginTop:2}}>R. 11, 2-114 — Jardim Santo Antônio, Goiânia - GO</div>
                        </div>
                        <div style={{textAlign:"right"}}>
                          <div style={{fontSize:11,color:C.muted}}>Período de referência</div>
                          <div style={{fontSize:14,fontWeight:700,color:C.pri}}>{semanaLabel}</div>
                          {responsavel&&<div style={{fontSize:11,color:C.muted}}>Resp.: {responsavel}</div>}
                        </div>
                      </div>
                      <div style={{marginTop:10,fontSize:14,fontWeight:800,textAlign:"center",textTransform:"uppercase",letterSpacing:"0.07em"}}>Recibo de Vale Transporte</div>
                    </div>
                    <table style={{...s.table,marginBottom:16,fontSize:12}}>
                      <thead><tr>
                        <th style={{...s.th,width:28}}>#</th>
                        <th style={s.th}>Nome do Colaborador</th>
                        <th style={s.thC}>Escala</th>
                        <th style={s.thC}>Dias</th>
                        <th style={s.thC}>Passagens</th>
                        <th style={s.thC}>Valor</th>
                        <th style={{...s.th,minWidth:180}}>Assinatura / Data</th>
                      </tr></thead>
                      <tbody>
                        {employees.map((emp,i)=>{
                          const dias=getDias(emp);
                          const valor=getValor(emp);
                          return(
                            <tr key={emp.id} style={s.row(i)}>
                              <td style={{...s.tdC,color:C.muted,fontSize:11}}>{i+1}</td>
                              <td style={{...s.td,fontWeight:600}}>{emp.nome}</td>
                              <td style={s.tdC}><span style={s.badge(emp.escala)}>{emp.escala}</span></td>
                              <td style={{...s.tdC,fontWeight:700}}>{dias}</td>
                              <td style={{...s.tdC,color:C.muted}}>{dias*2}</td>
                              <td style={{...s.tdC,fontWeight:800,color:C.pri,fontSize:13}}>{fmtBRL(valor)}</td>
                              <td style={{...s.td,borderLeft:`1px solid ${C.border}`}}>
                                <div style={{borderBottom:"1px solid #AAA",height:26,marginTop:6}}/>
                                <div style={{fontSize:10,color:C.muted,marginTop:3}}>Data: ___/___/______</div>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                      <tfoot>
                        <tr style={{background:C.pri}}>
                          <td colSpan={5} style={{padding:"10px 12px",fontWeight:800,fontSize:13,color:"#fff"}}>TOTAL GERAL</td>
                          <td style={{textAlign:"center",fontWeight:900,fontSize:14,color:C.acc,padding:10}}>{fmtBRL(total)}</td>
                          <td style={{background:"#fff",borderLeft:`1px solid ${C.border}`}}/>
                        </tr>
                      </tfoot>
                    </table>
                    <div style={{display:"flex",gap:14,marginBottom:16,flexWrap:"wrap"}}>
                      {[
                        {l:"Colaboradores",v:`${employees.length}`},
                        {l:"Total passagens",v:`${employees.reduce((x,e)=>x+getDias(e)*2,0)} pass.`},
                        {l:"Valor/passagem",v:fmtBRL(valorPassagem)},
                        {l:"Total a pagar",v:fmtBRL(total),hl:true},
                      ].map((it,i)=>(
                        <div key={i} style={{flex:1,minWidth:100,background:it.hl?"#EAF5F0":C.rowAlt,border:`1px solid ${C.border}`,borderLeft:it.hl?`4px solid ${C.pri}`:undefined,borderRadius:8,padding:"10px 14px"}}>
                          <div style={{fontSize:10,color:C.muted,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:3}}>{it.l}</div>
                          <div style={{fontSize:15,fontWeight:800,color:it.hl?C.pri:C.text}}>{it.v}</div>
                        </div>
                      ))}
                    </div>
                    <div style={{display:"flex",gap:28,marginTop:24,paddingTop:14,borderTop:`1px dashed ${C.border}`}}>
                      {["Responsável pelo Pagamento","Conferência"].map((l,i)=>(
                        <div key={i} style={{flex:1}}>
                          <div style={{borderBottom:"1px solid #666",height:36}}/>
                          <div style={{textAlign:"center",fontSize:11,color:C.muted,marginTop:5}}>{l}</div>
                          <div style={{textAlign:"center",fontSize:10,color:C.muted,marginTop:2}}>Data: ___/___/______</div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
                <div className="no-print" style={{display:"flex",justifyContent:"flex-end"}}>
                  <button style={s.btnAcc} onClick={printRecibo}>🖨️ Gerar PDF / Imprimir</button>
                </div>
              </div>
            )}

            {vtTab==="hist"&&(
              <div style={s.card}>
                <div style={s.cardTitle}>📚 Histórico de Semanas</div>
                <div style={s.infoBox}>As últimas 12 semanas importadas ficam salvas automaticamente neste dispositivo. Clique em "Carregar" para reabrir qualquer semana.</div>
                {historico.length===0?(
                  <div style={{textAlign:"center",color:C.muted,padding:"28px 0",fontSize:13}}>Nenhuma semana no histórico ainda. Importe um CSV para começar.</div>
                ):(
                  <table style={s.table}>
                    <thead><tr>
                      <th style={s.th}>Período</th>
                      <th style={s.thC}>Colaboradores</th>
                      <th style={s.thC}>Total VT</th>
                      <th style={s.th}>Importado em</th>
                      <th style={s.thC}></th>
                    </tr></thead>
                    <tbody>
                      {historico.map((h,i)=>{
                        const vp2=parseFloat(passagemStr.replace(",","."))||0;
                        const getD2=(emp)=>{ const dias=emp.escala==="SEG-SAB"?DIAS_SS:DIAS_SF; return dias.filter(d=>emp.presente?.[d]).length; };
                        const tot2=h.employees.reduce((acc,e)=>acc+getD2(e)*2*vp2,0);
                        const ativo=h.semanaIni===semanaIni&&h.semanaFim===semanaFim;
                        return(
                          <tr key={h.id} style={{...s.row(i),outline:ativo?`2px solid ${C.acc}`:"none",outlineOffset:-1}}>
                            <td style={{...s.td,fontWeight:ativo?700:400}}>
                              {ativo&&<span style={{fontSize:10,background:C.acc,color:"#fff",borderRadius:20,padding:"1px 7px",marginRight:6,fontWeight:700}}>ATIVA</span>}
                              {h.label}
                            </td>
                            <td style={s.tdC}>{h.employees.length}</td>
                            <td style={{...s.tdC,fontWeight:700,color:C.green}}>{fmtBRL(tot2)}</td>
                            <td style={{...s.td,fontSize:11,color:C.muted}}>{h.importadoEm}</td>
                            <td style={s.tdC}>
                              <button style={{...s.btn,fontSize:11,padding:"4px 10px"}} onClick={()=>{carregarDoHistorico(h);setVtTab("ponto");}}>Carregar</button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                )}
                {historico.length>0&&(
                  <div style={{marginTop:12,textAlign:"right"}}>
                    <button style={{...s.btnSm,color:C.muted,borderColor:C.muted}} onClick={()=>{ if(window.confirm("Apagar todo o histórico salvo?")) setHistorico([]); }}>🗑️ Limpar histórico</button>
                  </div>
                )}
              </div>
            )}
          </div>
      );

      function PlaceholderPage({title,icon}){
        return(
          <div>
            <div style={{fontSize:20,fontWeight:800,color:C.pri,marginBottom:4}}>{icon} {title}</div>
            <div style={{fontSize:13,color:C.muted,marginBottom:20}}>Módulo em desenvolvimento</div>
            <div style={{...s.card,textAlign:"center",padding:"48px 20px",color:C.muted}}>
              <div style={{fontSize:40,marginBottom:12}}>{icon}</div>
              <div style={{fontSize:16,fontWeight:700,marginBottom:6}}>Em breve</div>
              <div style={{fontSize:13}}>Este módulo será adicionado em uma próxima versão.</div>
            </div>
          </div>
        );
      }

      const navItems=[
        {k:"vt",l:"🚌 Vale Transporte"},
        {k:"ferias",l:"🏖️ Férias"},
        {k:"atestados",l:"🏥 Atestados"},
        {k:"ponto_hist",l:"📊 Histórico Ponto"},
      ];

      return(
        <div style={s.wrap}>
          <header style={s.header} className="no-print">
            <div style={s.logo}>👔</div>
            <div>
              <div style={{fontSize:16,fontWeight:800,letterSpacing:"-0.01em"}}>RH · Cantina em Casa / Lumar</div>
              <div style={{fontSize:11,opacity:0.65,marginTop:1}}>Sistema de Recursos Humanos</div>
            </div>
          </header>
          <div style={s.body}>
            <nav style={s.sidebar} className="no-print">
              <div style={{fontSize:10,color:"rgba(255,255,255,0.35)",textTransform:"uppercase",letterSpacing:"0.08em",padding:"0 20px",marginBottom:8}}>Módulos</div>
              {navItems.map(n=>(
                <button key={n.k} style={s.navBtn(page===n.k)} onClick={()=>setPage(n.k)}>{n.l}</button>
              ))}
            </nav>
            <main style={s.main}>
              {page==="vt"&&vtPageContent}
              {page==="ferias"&&<PlaceholderPage title="Férias" icon="🏖️"/>}
              {page==="atestados"&&<PlaceholderPage title="Atestados" icon="🏥"/>}
              {page==="ponto_hist"&&<PlaceholderPage title="Histórico de Ponto" icon="📊"/>}
            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
