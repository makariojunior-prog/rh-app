    const DIA_LABEL = {SEG:"Seg",TER:"Ter",QUA:"Qua",QUI:"Qui",SEX:"Sex",SAB:"Sáb"};
    const DIA_LABEL_FULL = {SEG:"Segunda",TER:"Terça",QUA:"Quarta",QUI:"Quinta",SEX:"Sexta",SAB:"Sábado"};
    const WEEKDAY_MAP = {1:"SEG",2:"TER",3:"QUA",4:"QUI",5:"SEX",6:"SAB",0:"DOM"};

    function fmtBRL(v){ return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
    function fmtDate(str){ if(!str) return ""; const[y,m,d]=str.split("-"); return `${d}/${m}/${y}`; }

    function parseDDMMYYYY(str){
      const[d,m,y]=str.split("/");
      return new Date(parseInt(y),parseInt(m)-1,parseInt(d));
    }
    function toISO(date){
      return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
    }
    function isPresente(bat1){
      if(!bat1||bat1.trim()===""||bat1.trim()==="00:00") return false;
      return true;
    }
    function parseCSV(text){
      const lines=text.trim().split(/\r?\n/);
      if(lines.length<2) throw new Error("Arquivo vazio ou inválido");
      const header=lines[0].split(";");
      if(!header[0].includes("Crach")) throw new Error("Formato não reconhecido. Verifique se é o arquivo do ponto.");
      const empMap={};
      const allDates=[];
      for(let i=1;i<lines.length;i++){
        const cols=lines[i].split(";");
        if(cols.length<8) continue;
        const cracha=cols[0].trim();
        const nome=cols[1].trim();
        const dataStr=cols[2].trim();
        const bat1=cols[7].trim();
        if(!cracha||!nome||!dataStr) continue;
        const dateObj=parseDDMMYYYY(dataStr);
        const weekday=dateObj.getDay();
        const diaKey=WEEKDAY_MAP[weekday];
        allDates.push(dateObj);
        if(!empMap[cracha]) empMap[cracha]={id:cracha,nome,presente:{},trabalhouSab:false};
        if(diaKey&&diaKey!=="DOM"){
          empMap[cracha].presente[diaKey]=isPresente(bat1);
          if(diaKey==="SAB"&&isPresente(bat1)) empMap[cracha].trabalhouSab=true;
        }
      }
      const employees=Object.values(empMap).map((e,i)=>({
        id:i+1, cracha:e.id, nome:e.nome,
        escala:e.trabalhouSab?"SEG-SAB":"SEG-SEX",
        presente:e.presente,
        afastado: false,
        valorPago: "",
      }));
      const sorted=allDates.sort((a,b)=>a-b);
      return { employees, semanaIni:toISO(sorted[0]), semanaFim:toISO(sorted[sorted.length-1]) };
    }

      ]);

  } catch(err) {

  }
}`;
