          setLoadingHistFolha(false);
        };

        const salvarFolhaBanco = async () => {
          if (!resultados.length || !empresaId) return;
          try {
            const rows = resultados.map(r => {
              const sal       = Number(r.salario)||0;
              const diasUt    = r.calc.diasUteisPrevistos||22;
              const prop      = diasUt>0 ? sal*(r.calc.diasTrabalhados/diasUt) : sal;
              const pericVal  = r.periculosidade ? prop*0.30 : 0;
              const heVal     = (sal/220)*1.5*((r.calc.horasExtrasMin||0)/60);
              const dsrVal    = (sal/30)*(r.calc.dsrPerdidos||0);
              const bruto     = Math.max(0, prop - dsrVal + pericVal + heVal + (r.calc.cajuValor||0));
              const inss      = calcINSS(bruto);
              const vtVal     = r.calc.descontarVT ? (Number(r.transporte)||0) : 0;
              const liquido   = Math.max(0, bruto - inss - (r.calc.adiantamento||0) - (r.calc.produtos||0) - vtVal);
              return {
                empresa_id: empresaId, periodo: mesAno,
                colaborador_nome: r.nome, funcao: r.funcao||'', setor: r.setor||'',
                salario_base: sal, periculosidade: !!r.periculosidade,
                dias_trabalhados: r.calc.diasTrabalhados||0, dias_uteis_previstos: diasUt,
                faltas: r.calc.faltas||0, atestados: r.calc.atestados||0,
                caju_dias: r.calc.cajuDias||0, caju_valor: r.calc.cajuValor||0,
                horas_extras_min: r.calc.horasExtrasMin||0, dsr_perdidos: r.calc.dsrPerdidos||0,
                premio_assiduidade: !!r.calc.premioAssiduidade,
                adiantamento: r.calc.adiantamento||0, produtos: r.calc.produtos||0,
                descontar_vt: !!r.calc.descontarVT, vt_valor: Math.round(vtVal*100)/100,
                inss_desconto: Math.round(inss*100)/100,
                salario_bruto: Math.round(bruto*100)/100,
                salario_liquido: Math.round(liquido*100)/100,
              };
            });
            const {error} = await _supa.from('folha_mensal').upsert(rows,{onConflict:'empresa_id,periodo,colaborador_nome'});
            if(error) throw error;
            await carregarHistoricoFolha();
          } catch(e){ throw e; }
        };

        useEffect(()=>{ carregarHistoricoFolha(); },[empresaId]);

        const salvarFolha = async () => {
          if (resultados.length === 0) { setSaveStatus({ok:false,msg:"Nenhum colaborador carregado."}); return; }
          setSaveStatus({ok:null, msg:"⏳ Salvando folha..."});
          try {
            await salvarFolhaBanco();
            const idsDescontar = Object.values(adiantSupa).flatMap(a=>a.ids||[]).filter(Boolean);
            if(idsDescontar.length>0){
              await _supa.from('adiantamentos').update({status:'descontado'}).in('id',idsDescontar);
              setAdiantSupa({});
            }
            const idsCompras = Object.values(comprasSupa).flatMap(c=>c.ids||[]).filter(Boolean);
            if(idsCompras.length>0){
              await _supa.from('compras').update({status:'descontado'}).in('id',idsCompras);
              setComprasSupa({});
            }
            setSaveStatus({ok:true, msg:`✅ Folha ${mesAno} salva no banco! Adiantamentos e compras marcados como descontados. Para editar, ajuste os valores e salve novamente.`});
          } catch(err) {
            setSaveStatus({ok:false, msg:"Erro: " + err.message});
          }
        };

        const exportarCSVFolha = () => {
          const header = ["Período","Colaborador","Função","Dias Trab.","Faltas","Atestados","Férias","H.Extras","DSR Perd.","Caju Dias","Caju R$","Produtos R$","Adiant. R$","Total Desc. R$","Banco Horas","Dias Faltas"];
          const rows = resultados.map(r=>[
            periodoLabel, r.nome, r.funcao,
            r.calc.diasTrabalhados, r.calc.faltas, r.calc.atestados, r.calc.ferias,
            r.calc.horasExtras, r.calc.dsrPerdidos,
            r.calc.cajuDias, r.calc.cajuValor.toFixed(2).replace(".",","),
            r.calc.produtos.toFixed(2).replace(".",","),
            r.calc.adiantamento.toFixed(2).replace(".",","),
            r.calc.totalDesconto.toFixed(2).replace(".",","),
            r.calc.bancoHoras?"Sim":"Não",
            r.calc.diasFaltas.join(" | ")
          ]);
          const csv = [header, ...rows].map(r=>r.join(";")).join("\n");
          const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url; a.download = `Folha_${mesAno.replace("/","-")}.csv`;
          a.click();
          URL.revokeObjectURL(url);
        };

        const setMarcacao = (nome, iso, valor) => {
          setMarcacoes(prev=>{
            const novo = {...prev};
            if (!novo[nome]) novo[nome] = {}; else novo[nome] = {...novo[nome]};
            if (valor === null || valor === "") delete novo[nome][iso];
            else novo[nome][iso] = valor;
            return novo;
          });
        };
        const toggleFeriado = (iso) => {
          setFeriados(prev=>{
            if (prev.includes(iso)) return prev.filter(x=>x!==iso);
            return [...prev, iso].sort();
          });
        };
        const setAjuste = (nome, campo, valor) => {
          setAjustes(prev=>({...prev, [nome]:{...(prev[nome]||{}), [campo]: valor}}));
        };

        const colabInfoAtual = colabSelecionado ? resultados.find(r=>r.nomeKey === colabSelecionado) : null;

        return (
          <div>
            {showRegras && (
              <div onClick={()=>setShowRegras(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.45)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:"20px"}}>
                <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:14,width:"min(720px,100%)",maxHeight:"90vh",overflowY:"auto",boxShadow:"0 8px 40px rgba(0,0,0,0.25)"}}>
                  <div style={{background:C.pri,color:"#fff",padding:"18px 24px",display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:0,borderRadius:"14px 14px 0 0"}}>
                    <div>
                      <div style={{fontSize:16,fontWeight:800}}>🧮 Regras e Orientações do Cálculo</div>
                      <div style={{fontSize:11,opacity:0.7,marginTop:2}}>Folha de Pagamento · Cantina em Casa / Lumar Alimentos</div>
                    </div>
                    <button onClick={()=>setShowRegras(false)} style={{background:"transparent",border:"1px solid rgba(255,255,255,0.3)",color:"#fff",borderRadius:6,padding:"4px 10px",cursor:"pointer",fontSize:13}}>✕ Fechar</button>
                  </div>
                  <div style={{padding:"24px"}}>

                    <div style={{marginBottom:20}}>
                      <div style={{fontWeight:800,color:C.pri,fontSize:13,marginBottom:10,textTransform:"uppercase",letterSpacing:"0.05em"}}>📅 Período de Fechamento</div>
                      <div style={{background:C.rowAlt,border:`1px solid ${C.border}`,borderRadius:8,padding:"12px 14px",fontSize:13,lineHeight:1.8}}>
                        O período cobre do <strong>dia 26 do mês anterior</strong> ao <strong>dia 25 do mês de referência</strong>.<br/>
                        <em style={{color:C.muted,fontSize:12}}>Exemplo: Folha de Maio/2025 → período de 26/04/2025 a 25/05/2025.</em>
                      </div>
                    </div>

                    <div style={{marginBottom:20}}>
                      <div style={{fontWeight:800,color:C.pri,fontSize:13,marginBottom:10,textTransform:"uppercase",letterSpacing:"0.05em"}}>📊 Status dos Dias</div>
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                        {[
                          {s:"trabalhou",l:"Trabalhado",c:C.green,bg:"#E8F5EE",d:"Dia com registro de ponto (batida) dentro do horário previsto."},

                          {s:"atestado",l:"Atestado",c:C.amber,bg:"#FFF8E7",d:"Afastamento médico justificado (dia todo). Conta para CAJU, não gera falta nem perde DSR. Desconta 1 dia do prêmio assiduidade."},
                          {s:"atestado_meio",l:"Atestado ½ Per.",c:"#D97706",bg:"#FEF3C7",d:"Atestado de meio período (manhã ou tarde). Conta como dia trabalhado: não desconta assiduidade, não perde VT e conta para CAJU."},

                      </div>
                    </div>

                    <div style={{marginBottom:20}}>

                    <div style={{marginBottom:20}}>
                      <div style={{fontWeight:800,color:C.pri,fontSize:13,marginBottom:10,textTransform:"uppercase",letterSpacing:"0.05em"}}>💤 DSR — Descanso Semanal Remunerado</div>
                      <div style={{background:C.rowAlt,border:`1px solid ${C.border}`,borderRadius:8,padding:"12px 14px",fontSize:13,lineHeight:1.8}}>
                        <ul style={{paddingLeft:18,lineHeight:2.1}}>

                    <div style={{marginBottom:20}}>

                      <div style={{background:C.rowAlt,border:`1px solid ${C.border}`,borderRadius:8,padding:"12px 14px",fontSize:13,lineHeight:1.8}}>
                        <ul style={{paddingLeft:18,lineHeight:2.1}}>

                    <div style={{marginBottom:20}}>
                      <div style={{fontWeight:800,color:C.pri,fontSize:13,marginBottom:10,textTransform:"uppercase",letterSpacing:"0.05em"}}>⏱️ Horas Extras e Horas Falta Parcial</div>
                      <div style={{background:C.rowAlt,border:`1px solid ${C.border}`,borderRadius:8,padding:"12px 14px",fontSize:13,lineHeight:1.8}}>
                        <ul style={{paddingLeft:18,lineHeight:2.1}}>
                          <li><strong>Horas Extras:</strong> Lidas do campo <em>Hora Extra</em> do CSV do ponto eletrônico.</li>
                          <li><strong>Horas Falta Parcial:</strong> Diferença entre horário previsto e real batido no dia (quando trabalhou mas saiu mais cedo ou chegou tarde além da tolerância).</li>

                      </div>

                    <div style={{marginBottom:20}}>
                      <div style={{fontWeight:800,color:C.pri,fontSize:13,marginBottom:10,textTransform:"uppercase",letterSpacing:"0.05em"}}>🎯 Prêmio Assiduidade 5% (Dias)</div>
                      <div style={{background:C.rowAlt,border:`1px solid ${C.border}`,borderRadius:8,padding:"12px 14px",fontSize:13,lineHeight:1.8}}>

                          <li>Base: <strong>30 dias fixos</strong> por mês (independente do mês).</li>

                          <li>Dia com <strong>atestado (dia todo)</strong> ou <strong>abono</strong> → desconta apenas aquele dia (30 − dias atestado/abono).</li>

                <div style={{fontSize:12}}>Carregue os colaboradores da planilha e importe o CSV do ponto para começar.</div>
              </div>
            )}

            {colabSelecionado && colabInfoAtual && (
              <PainelColaborador
                colab={colabInfoAtual}
                datasPeriodo={datasPeriodo}
                marcacoes={marcacoes[colabSelecionado]||{}}
                feriados={feriados}
                ajustes={ajustes[colabSelecionado]||{}}
                onMarcar={(iso,valor)=>setMarcacao(colabSelecionado,iso,valor)}
                onAjustar={(campo,val)=>setAjuste(colabSelecionado,campo,val)}
                onClose={()=>setColabSelecionado(null)}
                analisarDia={(iso,diaDados)=>analisarDia(colabSelecionado,iso,diaDados,colabInfoAtual)}
              />
            )}

            <div style={s.card}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
                <div style={s.cardTitle}>📋 Histórico de Folhas — Banco de Dados</div>
                <button onClick={carregarHistoricoFolha} disabled={loadingHistFolha} style={{...s.btn,fontSize:11,padding:"5px 12px",gap:4}}>
                  {loadingHistFolha?"⏳":"🔄"} Atualizar
                </button>
              </div>
              {loadingHistFolha&&<div style={s.infoBox}>⏳ Carregando histórico...</div>}
              {!loadingHistFolha&&historicoFolha.length===0&&(
                <div style={{color:C.muted,fontSize:13,padding:"10px 0"}}>Nenhuma folha salva ainda. Após fechar o mês, clique em <strong>💾 Salvar</strong> para registrar no banco.</div>
              )}
              {!loadingHistFolha&&historicoFolha.length>0&&(()=>{
                const grupos={};
                historicoFolha.forEach(r=>{
                  if(!grupos[r.periodo]) grupos[r.periodo]={periodo:r.periodo,n:0,bruto:0,liquido:0};
                  grupos[r.periodo].n++;
                  grupos[r.periodo].bruto+=(r.salario_bruto||0);
                  grupos[r.periodo].liquido+=(r.salario_liquido||0);
                });
                const lista=Object.values(grupos).sort((a,b)=>{
                  const ka=a.periodo.split('/').reverse().join('');
                  const kb=b.periodo.split('/').reverse().join('');
                  return kb.localeCompare(ka);
                });
                return(
                  <table style={{width:"100%",borderCollapse:"collapse"}}>
                    <thead><tr style={{background:"var(--c-subtle)"}}>
                      <th style={s.th}>Período</th>
                      <th style={{...s.th,textAlign:"center"}}>Colab.</th>
                      <th style={{...s.th,textAlign:"right"}}>Total Bruto</th>
                      <th style={{...s.th,textAlign:"right"}}>Total Líquido</th>
                      <th style={{...s.th,textAlign:"right",color:C.danger}}>Custo c/ FGTS 8%</th>
                    </tr></thead>
                    <tbody>{lista.map((g,i)=>(
                      <tr key={i} style={{borderTop:`1px solid ${C.border}`,background:g.periodo===mesAno?"#F0F9FF":"transparent"}}>
                        <td style={{...s.td,fontWeight:700,color:g.periodo===mesAno?C.pri:"inherit"}}>
                          {g.periodo}{g.periodo===mesAno&&<span style={{marginLeft:6,fontSize:10,padding:"2px 6px",background:C.acc,color:"#fff",borderRadius:10}}>atual</span>}
                        </td>
                        <td style={s.tdC}>{g.n}</td>
                        <td style={{...s.td,textAlign:"right",fontWeight:600}}>{fmtBRL(g.bruto)}</td>
                        <td style={{...s.td,textAlign:"right"}}>{fmtBRL(g.liquido)}</td>
                        <td style={{...s.td,textAlign:"right",fontWeight:700,color:C.danger}}>{fmtBRL(g.bruto*1.08)}</td>
                      </tr>
                    ))}</tbody>
                  </table>
                );
              })()}
            </div>
          </div>
        );
      }

      function PainelColaborador({colab, datasPeriodo, marcacoes, feriados, ajustes, onMarcar, onAjustar, onClose, analisarDia}) {
        const STATUS_LABELS = {
          trabalhou:{l:"Trab.",c:C.green,bg:"#E8F5EE"},
          falta:{l:"Falta",c:C.danger,bg:"#FEE2E2"},
          atestado:{l:"Atest.",c:C.amber,bg:C.amberBg},
          atestado_meio:{l:"½Atst.",c:"#D97706",bg:"#FEF3C7"},
          ferias:{l:"Férias",c:"#3b82f6",bg:"#DBEAFE"},
          folga:{l:"Folga",c:"#8b5cf6",bg:"#EDE9FE"},
          feriado:{l:"Feriado",c:"#D4972A",bg:"#FFF8E7"},
          nao_previsto:{l:"",c:C.muted,bg:"#F3F3F3"}
        };

        const primeiro = new Date(datasPeriodo[0]+"T12:00:00");
        const dowPrimeiro = primeiro.getDay();
        const celulasVazias = Array(dowPrimeiro).fill(null);
        const celulas = [...celulasVazias, ...datasPeriodo];

        return (
          <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.45)",zIndex:100,display:"flex",justifyContent:"flex-end"}}>
            <div onClick={e=>e.stopPropagation()} style={{width:"min(560px,100%)",background:"#fff",height:"100%",overflowY:"auto",boxShadow:"-4px 0 20px rgba(0,0,0,0.2)"}}>
              <div style={{background:C.pri,color:"#fff",padding:"18px 22px",display:"flex",justifyContent:"space-between",alignItems:"flex-start",position:"sticky",top:0,zIndex:10}}>
                <div>
                  <div style={{fontSize:16,fontWeight:800}}>{colab.nome}</div>
                  {(colab.funcao||colab.setor||colab.jornada)&&(
                    <div style={{fontSize:11,opacity:0.7,marginTop:2}}>
                      {[colab.funcao, colab.setor, colab.jornada==='SEG-SEX'?'5x2 (Seg→Sex)':colab.jornada==='SEG-SAB'?'6x1 (Seg→Sáb)':null].filter(Boolean).join(' · ')}
                    </div>
                  )}
                </div>
                <button onClick={onClose} style={{background:"transparent",border:"1px solid rgba(255,255,255,0.3)",color:"#fff",borderRadius:6,padding:"4px 10px",cursor:"pointer",fontSize:13}}>✕ Fechar</button>
              </div>

              <div style={{padding:"16px 22px",background:C.rowAlt,borderBottom:`1px solid ${C.border}`}}>
                <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
                  {[
                    {l:"Trab.",v:colab.calc.diasTrabalhados,c:C.green},
                    {l:"Faltas",v:colab.calc.faltas,c:C.danger},
                    {l:"Atest.",v:colab.calc.atestados+(colab.calc.atestadosMeio?` (+½×${colab.calc.atestadosMeio})`:''),c:C.amber},
                    {l:"Férias",v:colab.calc.ferias,c:"#3b82f6"},
                    {l:"H.Extras",v:colab.calc.horasExtras,c:C.green},
                    {l:"DSR",v:`${colab.calc.dsrPerdidos}${colab.calc.feriadosPerdidos>0?`+${colab.calc.feriadosPerdidos}f`:""}`,c:C.danger},
                    {l:"Caju dias",v:colab.calc.cajuDias,c:C.pri},
                    {l:"Caju R$",v:fmtBRL(colab.calc.cajuValor),c:C.green}
                  ].map((it,i)=>(
                    <div key={i} style={{background:"#fff",borderRadius:7,padding:"7px 9px",border:`1px solid ${C.border}`}}>
                      <div style={{fontSize:9,color:C.muted,textTransform:"uppercase",letterSpacing:"0.04em"}}>{it.l}</div>
                      <div style={{fontSize:13,fontWeight:800,color:it.c}}>{it.v}</div>
                    </div>
                  ))}
                </div>
              </div>

              <div style={{padding:"16px 22px"}}>
                <div style={{fontSize:13,fontWeight:800,color:C.pri,marginBottom:10}}>📅 Calendário do período</div>
                <div style={{fontSize:11,color:C.muted,marginBottom:10}}>Clique em um dia para ciclar: <strong>Normal → Atestado → ½ Atestado → Férias → Folga → Normal</strong></div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:6}}>
                  {["D","S","T","Q","Q","S","S"].map((d,i)=>(
                    <div key={i} style={{textAlign:"center",fontSize:10,fontWeight:700,color:C.muted,padding:"4px 0"}}>{d}</div>
                  ))}
                </div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
                  {celulas.map((iso,idx)=>{
                    if (!iso) return <div key={idx}/>;
                    const d = new Date(iso+"T12:00:00");
                    const dia = d.getDate();
                    const diaDados = colab.dadosCSV?.dias?.[iso];
                    const a = analisarDia(iso, diaDados);
                    const info = STATUS_LABELS[a.status] || STATUS_LABELS.nao_previsto;
                    const isFer = feriados.includes(iso);
                    const marc = marcacoes[iso];
                    const clique = () => {
                      const ciclo = ["", "atestado", "atestado_meio", "ferias", "folga"];
                      const atual = marc || "";
                      const next = ciclo[(ciclo.indexOf(atual)+1)%ciclo.length];
                      onMarcar(iso, next || null);
                    };
                    return (
                      <button key={idx} onClick={clique} style={{
                        background:info.bg,
                        border:`1.5px solid ${info.c}40`,
                        borderRadius:6, padding:"6px 4px", cursor:"pointer",
                        display:"flex",flexDirection:"column",alignItems:"center",gap:2,
                        minHeight:58
                      }}>
                        <div style={{fontSize:13,fontWeight:800,color:info.c}}>{dia}</div>
                        <div style={{fontSize:8,color:info.c,fontWeight:700,textAlign:"center",lineHeight:1.1}}>
                          {isFer&&a.status==="feriado"?"Feriado":info.l}
                        </div>
                        {diaDados?.horaExtra && diaDados.horaExtra !== "00:00" && (
                          <div style={{fontSize:8,color:C.green,fontWeight:700}}>+{diaDados.horaExtra}</div>
                        )}
                      </button>
                    );
                  })}
                </div>

                <div style={{marginTop:14,display:"flex",flexWrap:"wrap",gap:6}}>
                  {Object.entries(STATUS_LABELS).filter(([k])=>k!=="nao_previsto").map(([k,v])=>(
                    <div key={k} style={{fontSize:10,background:v.bg,color:v.c,border:`1px solid ${v.c}30`,borderRadius:5,padding:"2px 7px",fontWeight:700}}>{v.l}</div>
                  ))}
                </div>
              </div>

              <div style={{padding:"0 22px 22px"}}>
                <div style={{fontSize:13,fontWeight:800,color:C.pri,marginBottom:10,marginTop:14}}>📝 Observações</div>
                <textarea style={{...s.input,minHeight:60,fontFamily:"inherit"}}
                          value={ajustes.observacoes||""}
                          onChange={e=>onAjustar("observacoes",e.target.value)}
                          placeholder="Notas adicionais..."/>

                {colab.calc.diasFaltas.length>0&&(
                  <div style={{marginTop:14,padding:"10px 14px",background:"#FEE2E2",border:"1px solid #FECACA",borderRadius:7}}>
                    <div style={{fontSize:11,fontWeight:700,color:C.danger,marginBottom:4}}>Dias de falta injustificada:</div>
                    <div style={{fontSize:12,color:"#991B1B"}}>{colab.calc.diasFaltas.join(" · ")}</div>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }

      // ORÇAMENTO DE FOLHA
      // ============================================================
      function OrcamentoPage({ colabAPI, empresaId }) {
        const [dadosFolha, setDadosFolha] = useState([]);
        const [periodoSel, setPeriodoSel] = useState('');
        const [encargos, setEncargos] = useState(8);
        const [loading, setLoading] = useState(true);

        useEffect(()=>{
          if(!empresaId) return;
          async function carregar(){
            setLoading(true);
            try {
              const {data} = await _supa.from('folha_mensal').select('*').eq('empresa_id',empresaId).order('periodo',{ascending:false}).limit(1000);
              const d = data||[];
              setDadosFolha(d);
              if(d.length>0 && !periodoSel){
                const pSorted=[...new Set(d.map(x=>x.periodo))].sort((a,b)=>{
                  const ka=a.split('/').reverse().join('');
                  const kb=b.split('/').reverse().join('');
                  return kb.localeCompare(ka);
                });
                setPeriodoSel(pSorted[0]);
              }
            } catch(e){ setDadosFolha([]); }
            setLoading(false);
          }
          carregar();
        },[empresaId]);

        const periodos=[...new Set(dadosFolha.map(x=>x.periodo))].sort((a,b)=>{
          const ka=a.split('/').reverse().join('');
          const kb=b.split('/').reverse().join('');
          return kb.localeCompare(ka);
        });

        const dp = dadosFolha.filter(r=>r.periodo===periodoSel);
        const totalBruto   = dp.reduce((a,r)=>a+(r.salario_bruto||0),0);
        const totalLiquido = dp.reduce((a,r)=>a+(r.salario_liquido||0),0);
        const custoEmp     = totalBruto*(1+encargos/100);
        const orcado       = colabAPI.reduce((a,c)=>a+(Number(c.salario)||0),0);

        // Por setor
        const setoresMap={};
        dp.forEach(r=>{
          const st=r.setor||'Sem setor';
          if(!setoresMap[st]) setoresMap[st]={setor:st,n:0,bruto:0,liquido:0};
          setoresMap[st].n++;
          setoresMap[st].bruto+=(r.salario_bruto||0);
          setoresMap[st].liquido+=(r.salario_liquido||0);
        });
        const setores=Object.values(setoresMap).sort((a,b)=>b.bruto-a.bruto);

        // Evolução mensal (últimos 12 meses ordenados cronológico)
        const resumoMensal=periodos.slice(0,12).map(p=>{
          const rows=dadosFolha.filter(r=>r.periodo===p);
          return {periodo:p, bruto:rows.reduce((a,r)=>a+(r.salario_bruto||0),0), n:rows.length};
        }).reverse();
        const maxBar=Math.max(...resumoMensal.map(m=>m.bruto),1);

        return(
          <div>
            <div style={{fontSize:20,fontWeight:800,color:C.pri,marginBottom:20}}>📊 Orçamento de Folha</div>

            {loading&&<div style={s.infoBox}>⏳ Carregando dados...</div>}
            {!loading&&dadosFolha.length===0&&(
              <div style={s.warnBox}>Nenhuma folha registrada ainda. Salve a folha em <strong>💼 Folha de Pagto</strong> para começar a rastrear o orçamento.</div>
            )}

            {!loading&&dadosFolha.length>0&&(
              <>
                {/* Seletor de período + encargos */}
                <div style={{display:"flex",gap:16,alignItems:"flex-end",marginBottom:20,flexWrap:"wrap"}}>
                  <div>
                    <label style={s.label}>Período</label>
                    <select style={s.input} value={periodoSel} onChange={e=>setPeriodoSel(e.target.value)}>
                      {periodos.map(p=><option key={p} value={p}>{p}</option>)}
                    </select>
                  </div>
                  <div>
                    <label style={s.label}>% Encargos patronais</label>
                    <input type="number" min="0" max="50" step="0.5" style={{...s.input,width:90}}
                      value={encargos} onChange={e=>setEncargos(Number(e.target.value)||0)}/>
                    <div style={{fontSize:11,color:C.muted,marginTop:3}}>FGTS=8% · adicione INSS patronal se aplicável</div>
                  </div>
                </div>

                {/* Cards resumo */}
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(155px,1fr))",gap:12,marginBottom:20}}>
                  {[
                    {l:"Orçado (cadastro)",v:fmtBRL(orcado),sub:colabAPI.length+" colab. ativos",c:C.pri},
                    {l:"Realizado bruto",v:fmtBRL(totalBruto),sub:dp.length+" colab. no período",c:C.green},
                    {l:"Realizado líquido",v:fmtBRL(totalLiquido),sub:"após descontos",c:C.acc},
                    {l:`Custo empresa (+${encargos}%)`,v:fmtBRL(custoEmp),sub:"bruto + encargos",c:C.danger},
                  ].map((card,i)=>(
                    <div key={i} style={{...s.card,margin:0}}>
                      <div style={{fontSize:11,color:C.muted,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.04em"}}>{card.l}</div>
                      <div style={{fontSize:22,fontWeight:800,color:card.c,margin:"6px 0 2px"}}>{card.v}</div>
                      <div style={{fontSize:11,color:C.muted}}>{card.sub}</div>
                    </div>
                  ))}
                </div>

                {/* Variação orçado vs realizado */}
                {orcado>0&&dp.length>0&&(
                  <div style={{...s.card,background:totalBruto>orcado?"#FEF2F2":"#F0FDF4",border:`1px solid ${totalBruto>orcado?"#FCA5A5":"#86EFAC"}`,marginBottom:12}}>
                    <span style={{fontSize:13,fontWeight:600,color:totalBruto>orcado?C.danger:"#166534"}}>
                      {totalBruto>orcado?"⚠️ Folha acima do orçado em ":"✅ Folha dentro do orçado — economia de "}
                      {fmtBRL(Math.abs(totalBruto-orcado))}
                      {" ("+(Math.abs((totalBruto-orcado)/orcado)*100).toFixed(1)+"%)"}
                    </span>
                  </div>
                )}

                {/* Por setor */}
                {setores.length>0&&(
                  <div style={s.card}>
                    <div style={s.cardTitle}>Por setor — {periodoSel}</div>
                    <table style={{width:"100%",borderCollapse:"collapse"}}>
                      <thead><tr style={{background:"var(--c-subtle)"}}>
                        <th style={s.th}>Setor</th>
                        <th style={{...s.th,textAlign:"center"}}>Colab.</th>
                        <th style={{...s.th,textAlign:"right"}}>Bruto</th>
                        <th style={{...s.th,textAlign:"right"}}>Líquido</th>
                        <th style={{...s.th,textAlign:"right",color:C.danger}}>Custo empresa</th>
                        <th style={{...s.th,textAlign:"right"}}>% do total</th>
                      </tr></thead>
                      <tbody>{setores.map((st,i)=>(
                        <tr key={i} style={{borderTop:`1px solid ${C.border}`}}>
                          <td style={{...s.td,fontWeight:600}}>{st.setor}</td>
                          <td style={s.tdC}>{st.n}</td>
                          <td style={{...s.td,textAlign:"right"}}>{fmtBRL(st.bruto)}</td>
                          <td style={{...s.td,textAlign:"right"}}>{fmtBRL(st.liquido)}</td>
                          <td style={{...s.td,textAlign:"right",fontWeight:700,color:C.danger}}>{fmtBRL(st.bruto*(1+encargos/100))}</td>
                          <td style={{...s.td,textAlign:"right",color:C.muted}}>{totalBruto>0?(st.bruto/totalBruto*100).toFixed(1)+"%":"—"}</td>
                        </tr>
                      ))}</tbody>
                    </table>
                  </div>
                )}

                {/* Evolução mensal */}
                {resumoMensal.length>1&&(
                  <div style={s.card}>
                    <div style={s.cardTitle}>📈 Evolução mensal — últimos {resumoMensal.length} meses</div>
                    <div style={{display:"flex",alignItems:"flex-end",gap:6,height:190,padding:"16px 0 0"}}>
                      {resumoMensal.map((m,i)=>{
                        const h=Math.max(Math.round((m.bruto/maxBar)*140),4);
                        const sel=m.periodo===periodoSel;
                        return(
                          <div key={i} onClick={()=>setPeriodoSel(m.periodo)}
                            style={{display:"flex",flexDirection:"column",alignItems:"center",flex:1,cursor:"pointer"}}>
                            <div style={{fontSize:10,color:sel?C.pri:C.muted,fontWeight:600,marginBottom:4,textAlign:"center"}}>
                              {fmtBRL(m.bruto).replace("R$ ","").replace("R$ ","")}
                            </div>
                            <div style={{width:"100%",height:h,background:sel?C.pri:C.acc,borderRadius:"4px 4px 0 0",opacity:sel?1:0.65,transition:"all 0.2s"}}/>
                            <div style={{fontSize:10,marginTop:6,color:sel?C.pri:C.muted,fontWeight:sel?700:400,textAlign:"center"}}>{m.periodo}</div>
                            <div style={{fontSize:9,color:C.muted,textAlign:"center"}}>{m.n} colab.</div>
                          </div>
                        );
                      })}
                    </div>
                    <div style={{fontSize:11,color:C.muted,marginTop:8}}>Clique em uma barra para ver o detalhamento do período.</div>
                  </div>
                )}
              </>
            )}
          </div>
        );
      }

    function ComissoesPage({colabAPI,empresaId}){
      const [aba,setAba]=useState('comissoes');
      const [crmUsers,setCrmUsers]=useState([]);
      const [loadingCrm,setLoadingCrm]=useState(false);
      const [vincMsgs,setVincMsgs]=useState({});
      const mkIni=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth()-1,26).toISOString().split('T')[0];};
      const mkFim=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),25).toISOString().split('T')[0];};
      const [dataIni,setDataIni]=useState(mkIni);
      const [dataFim,setDataFim]=useState(mkFim);
      const [resumo,setResumo]=useState([]);
      const [loading,setLoading]=useState(false);
      const [confirmando,setConfirmando]=useState(false);
      const [msgBox,setMsgBox]=useState(null);
      const [expandido,setExpandido]=useState(null);
      const [historico,setHistorico]=useState([]);
      const [loadingHist,setLoadingHist]=useState(false);

      useEffect(()=>{
        if(aba==='vincular') carregarCrm();
        if(aba==='historico') carregarHist();
      },[aba]);

      async function carregarCrm(){
        setLoadingCrm(true);
        const {data}=await _supa.from('crm_users').select('id,nome,email,colaborador_id').eq('ativo',true).order('nome');
        setCrmUsers(data||[]);
        setLoadingCrm(false);
      }

      async function salvarVinculo(uid,colabId){
        const {error}=await _supa.from('crm_users').update({colaborador_id:colabId||null}).eq('id',uid);
        setVincMsgs(p=>({...p,[uid]:error?'❌ Erro':'✅ Salvo'}));
        setTimeout(()=>setVincMsgs(p=>{const n={...p};delete n[uid];return n;}),2000);
      }

      async function calcular(){
        setLoading(true);setMsgBox(null);setResumo([]);
        const {data:ped,error}=await _supa.from('varejo_pedidos')
          .select('atendente,valor_liquido,num_pedido,cliente,data_entrega')
          .eq('origem','CARDAPIO WEB').eq('status_icon','✅')
          .gte('data_entrega',dataIni).lte('data_entrega',dataFim);
        if(error){setMsgBox({ok:false,txt:'Erro ao buscar pedidos: '+error.message});setLoading(false);return;}
        const {data:users}=await _supa.from('crm_users').select('id,nome,colaborador_id').eq('ativo',true);
        const uMap={};
        (users||[]).forEach(u=>{uMap[u.nome.toLowerCase()]=u;});
        const grps={};
        (ped||[]).forEach(p=>{
          const u=uMap[(p.atendente||'').toLowerCase()];
          const cId=u?.colaborador_id;
          const colab=cId?(colabAPI||[]).find(c=>c.id_supa===cId):null;
          const key=colab?.nome||p.atendente||'(sem vínculo)';
          const crmNome=p.atendente||'';
          if(!grps[key]) grps[key]={nome:key,crmNome,pedidos:0,totalVendas:0,det:[]};
          grps[key].pedidos++;
          grps[key].totalVendas+=Number(p.valor_liquido)||0;
          grps[key].det.push(p);
        });
        const res=Object.values(grps).map(g=>({...g,comissao:g.totalVendas*0.01})).sort((a,b)=>b.comissao-a.comissao);
        setResumo(res);
        setLoading(false);
        if(!res.length) setMsgBox({ok:false,txt:'Nenhum pedido Cardápio Web entregue neste período.'});
      }

      async function confirmar(){
        if(!resumo.length) return;
        setConfirmando(true);setMsgBox(null);
        const periodo=dataFim.substring(0,7);
        const erros=[];
        for(const r of resumo){
          if(r.nome==='(sem vínculo)') continue;
          const {error:e1}=await _supa.from('comissoes_mensais').upsert({
            empresa_id:empresaId,colaborador_nome:r.nome,
            data_inicio:dataIni,data_fim:dataFim,fonte:'VAREJO',
            valor_total:Math.round(r.comissao*100)/100,
            pedidos_count:r.pedidos,confirmado:true,
            confirmado_em:new Date().toISOString(),
          },{onConflict:'empresa_id,colaborador_nome,data_inicio,data_fim,fonte'});
          if(e1){erros.push(r.nome+': '+e1.message);continue;}
          await _supa.from('folha_mensal')
            .update({comissao_varejo:Math.round(r.comissao*100)/100})
            .eq('empresa_id',empresaId).eq('periodo',periodo).eq('colaborador_nome',r.nome);
        }
        setConfirmando(false);
        if(erros.length) setMsgBox({ok:false,txt:'Erros: '+erros.join('; ')});
        else setMsgBox({ok:true,txt:'✅ Período '+dataIni+' → '+dataFim+' confirmado! Folha '+periodo+' atualizada.'});
        carregarHist();
      }

      async function carregarHist(){
        setLoadingHist(true);
        const {data}=await _supa.from('comissoes_mensais').select('*').eq('empresa_id',empresaId).order('data_fim',{ascending:false}).limit(60);
        setHistorico(data||[]);
        setLoadingHist(false);
      }

      const fm=v=>'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
      const totalGeral=resumo.reduce((s,r)=>s+r.comissao,0);
      const tabSt=(a)=>({background:'none',border:'none',borderBottom:aba===a?`2px solid ${C.acc}`:'2px solid transparent',color:aba===a?C.acc:C.muted,fontWeight:aba===a?700:400,fontSize:13,padding:'8px 16px',cursor:'pointer',marginBottom:-1});

      return(
        <div>
          <div style={{fontWeight:700,fontSize:18,color:C.pri,marginBottom:20}}>💰 Comissionamento</div>
          <div style={{display:'flex',gap:4,marginBottom:20,borderBottom:`1px solid ${C.border}`}}>
            {[['comissoes','📊 Comissões'],['vincular','🔗 Vincular Usuários'],['historico','📋 Histórico']].map(([k,l])=>(
              <button key={k} onClick={()=>setAba(k)} style={tabSt(k)}>{l}</button>
            ))}
          </div>

          {aba==='comissoes'&&(
            <div>
              <div style={{...s.card,display:'flex',alignItems:'flex-end',gap:14,flexWrap:'wrap'}}>
                <div><label style={s.label}>Data início (26 do mês anterior)</label><input type="date" value={dataIni} onChange={e=>setDataIni(e.target.value)} style={{...s.input,width:170}}/></div>
                <div><label style={s.label}>Data fim (25 do mês atual)</label><input type="date" value={dataFim} onChange={e=>setDataFim(e.target.value)} style={{...s.input,width:170}}/></div>
                <button onClick={calcular} disabled={loading} style={s.btn}>{loading?'⏳ Calculando...':'🔍 Calcular'}</button>
              </div>
              {msgBox&&<div style={msgBox.ok?s.successBox:s.warnBox}>{msgBox.txt}</div>}
              {resumo.length>0&&(
                <div style={s.card}>
                  <div style={{...s.cardTitle,justifyContent:'space-between'}}>
                    <span>📊 Período: {dataIni} → {dataFim}</span>
                    <span style={{color:C.acc,fontWeight:700}}>{fm(totalGeral)} total</span>
                  </div>
                  <table style={s.table}>
                    <thead><tr>
                      <th style={s.th}>Colaborador (RH)</th>
                      <th style={s.th}>Usuário CRM</th>
                      <th style={{...s.th,textAlign:'right'}}>Pedidos</th>
                      <th style={{...s.th,textAlign:'right'}}>Total Vendas</th>
                      <th style={{...s.th,textAlign:'right'}}>Comissão (1%)</th>
                      <th style={s.th}></th>
                    </tr></thead>
                    <tbody>
                      {resumo.map((r,i)=>(
                        <React.Fragment key={r.nome}>
                          <tr style={s.row(i)}>
                            <td style={s.td}><strong>{r.nome}</strong></td>
                            <td style={{...s.td,fontSize:11,color:C.muted}}>{r.crmNome!==r.nome?r.crmNome:'—'}</td>
                            <td style={{...s.td,textAlign:'right'}}>{r.pedidos}</td>
                            <td style={{...s.td,textAlign:'right'}}>{fm(r.totalVendas)}</td>
                            <td style={{...s.td,textAlign:'right',fontWeight:700,color:C.acc}}>{fm(r.comissao)}</td>
                            <td style={s.td}>
                              <button onClick={()=>setExpandido(expandido===r.nome?null:r.nome)} style={{...s.btnOutline,fontSize:11,padding:'3px 9px'}}>
                                {expandido===r.nome?'▲ Fechar':'▼ Pedidos'}
                              </button>
                            </td>
                          </tr>
                          {expandido===r.nome&&(
                            <tr style={{background:C.greenBg}}>
                              <td colSpan={6} style={{padding:'10px 20px'}}>
                                <table style={{...s.table,fontSize:12}}>
                                  <thead><tr>
                                    <th style={{...s.th,fontSize:10}}>#</th>
                                    <th style={{...s.th,fontSize:10}}>Cliente</th>
                                    <th style={{...s.th,fontSize:10}}>Data</th>
                                    <th style={{...s.th,textAlign:'right',fontSize:10}}>Valor Líq.</th>
                                    <th style={{...s.th,textAlign:'right',fontSize:10}}>Comissão</th>
                                  </tr></thead>
                                  <tbody>
                                    {r.det.slice().sort((a,b)=>a.data_entrega<b.data_entrega?1:-1).map(p=>(
                                      <tr key={p.num_pedido}>
                                        <td style={{...s.td,padding:'5px 12px'}}>{p.num_pedido}</td>
                                        <td style={{...s.td,padding:'5px 12px'}}>{p.cliente}</td>
                                        <td style={{...s.td,padding:'5px 12px'}}>{p.data_entrega}</td>
                                        <td style={{...s.td,padding:'5px 12px',textAlign:'right'}}>{fm(p.valor_liquido)}</td>
                                        <td style={{...s.td,padding:'5px 12px',textAlign:'right',color:C.acc}}>{fm((p.valor_liquido||0)*0.01)}</td>
                                      </tr>
                                    ))}
                                  </tbody>
                                </table>
                              </td>
                            </tr>
                          )}
                        </React.Fragment>
                      ))}
                    </tbody>
                  </table>
                  <div style={{marginTop:16,display:'flex',justifyContent:'flex-end'}}>
                    <button onClick={confirmar} disabled={confirmando} style={s.btnAcc}>
                      {confirmando?'⏳ Confirmando...':'✅ Confirmar e salvar na Folha'}
                    </button>
                  </div>
                </div>
              )}
            </div>
          )}

          {aba==='vincular'&&(
            <div style={s.card}>
              <div style={s.cardTitle}>🔗 Vincular usuários do CRM → colaboradores do RH</div>
              <div style={{...s.infoBox,marginBottom:16}}>Defina qual usuário do App Comercial corresponde a cada colaborador. Isso garante que a comissão seja atribuída corretamente mesmo que os nomes sejam diferentes.</div>
              {loadingCrm?<div style={{color:C.muted,fontSize:13}}>Carregando...</div>:(
                <table style={s.table}>
                  <thead><tr>
                    <th style={s.th}>Usuário CRM</th>
                    <th style={s.th}>Email</th>
                    <th style={s.th}>Colaborador RH vinculado</th>
                    <th style={s.th}></th>
                  </tr></thead>
                  <tbody>
                    {crmUsers.map((u,i)=>(
                      <VinculoRow key={u.id} u={u} colabAPI={colabAPI} onSalvar={salvarVinculo} vincMsg={vincMsgs[u.id]} rowSt={s.row(i)} tdSt={s.td} selSt={s.select}/>
                    ))}
                  </tbody>
                </table>
              )}
            </div>
          )}

          {aba==='historico'&&(
            <div style={s.card}>
              <div style={s.cardTitle}>📋 Histórico de comissões confirmadas</div>
              {loadingHist?<div style={{color:C.muted,fontSize:13}}>Carregando...</div>:historico.length===0?
                <div style={{color:C.muted,fontSize:13}}>Nenhum período confirmado ainda.</div>:(
                <table style={s.table}>
                  <thead><tr>
                    <th style={s.th}>Colaborador</th>
                    <th style={s.th}>Período</th>
                    <th style={s.th}>Fonte</th>
                    <th style={{...s.th,textAlign:'right'}}>Pedidos</th>
                    <th style={{...s.th,textAlign:'right'}}>Comissão</th>
                    <th style={s.th}>Confirmado em</th>
                  </tr></thead>
                  <tbody>
                    {historico.map((h,i)=>(
                      <tr key={h.id} style={s.row(i)}>
                        <td style={s.td}><strong>{h.colaborador_nome}</strong></td>
                        <td style={{...s.td,fontSize:12}}>{h.data_inicio} → {h.data_fim}</td>
                        <td style={s.td}><span style={{background:C.amberBg,color:C.amber,fontSize:10,fontWeight:700,padding:'2px 7px',borderRadius:10}}>{h.fonte}</span></td>
                        <td style={{...s.td,textAlign:'right'}}>{h.pedidos_count}</td>
                        <td style={{...s.td,textAlign:'right',fontWeight:700,color:C.acc}}>{fm(h.valor_total)}</td>
                        <td style={{...s.td,fontSize:11,color:C.muted}}>{h.confirmado_em?new Date(h.confirmado_em).toLocaleString('pt-BR'):'—'}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>
          )}
        </div>
      );
    }

    function App(){
      const [page,setPage]=useState("dashboard");
      const [empresa,setEmpresa]=useState(()=>localStorage.getItem("rh_empresa")||"Cantina em Casa / Lumar Alimentos");
      const [responsavel,setResponsavel]=useState(()=>localStorage.getItem("rh_responsavel")||"");
      const [passagemStr,setPassagemStr]=useState(()=>localStorage.getItem("rh_passagem")||"4,30");
      const [semanaIni,setSemanaIni]=useState(()=>localStorage.getItem("rh_semanaIni")||"");
      const [semanaFim,setSemanaFim]=useState(()=>localStorage.getItem("rh_semanaFim")||"");
      const [employees,setEmployees]=useState(()=>{ try{ return JSON.parse(localStorage.getItem("rh_employees")||"[]"); }catch(e){ return []; } });
      const [historico,setHistorico]=useState(()=>{ try{ return JSON.parse(localStorage.getItem("rh_historico")||"[]"); }catch(e){ return []; } });
      const [novoNome,setNovoNome]=useState("");
      const [novaEscala,setNovaEscala]=useState("SEG-SEX");
      const [csvStatus,setCsvStatus]=useState(null);
      const [drag,setDrag]=useState(false);
      const [vtTab,setVtTab]=useState("import");
      // Novos estados
      const [feriadosDia,setFeriadosDia]=useState({});
      const [valorDSR,setValorDSR]=useState(()=>localStorage.getItem("rh_valor_dsr")||"7,20");
      const [copiedCsv,setCopiedCsv]=useState(false);
      const [colabAPI,setColabAPI]=useState(()=>{ try{return JSON.parse(localStorage.getItem("rh_colab_api")||"[]");}catch(e){return [];} });
      const [empresaId,setEmpresaId]=useState(()=>localStorage.getItem("rh_empresa_id")||"cantina");
      const [usuario, setUsuario] = useState(null);
      const [perfil, setPerfil] = useState(null);
      const [loadingAuth, setLoadingAuth] = useState(true);
      const [darkMode, setDarkMode] = useState(false);

      useEffect(()=>{ localStorage.setItem("rh_empresa",empresa); },[empresa]);
      useEffect(()=>{ localStorage.setItem("rh_responsavel",responsavel); },[responsavel]);
      useEffect(()=>{ localStorage.setItem("rh_passagem",passagemStr); },[passagemStr]);
      useEffect(()=>{ localStorage.setItem("rh_semanaIni",semanaIni); },[semanaIni]);
      useEffect(()=>{ localStorage.setItem("rh_semanaFim",semanaFim); },[semanaFim]);
      useEffect(()=>{ localStorage.setItem("rh_employees",JSON.stringify(employees)); },[employees]);
      useEffect(()=>{ localStorage.setItem("rh_historico",JSON.stringify(historico)); },[historico]);
      useEffect(()=>{ localStorage.setItem("rh_valor_dsr",valorDSR); },[valorDSR]);
      useEffect(()=>{ localStorage.setItem("rh_colab_api",JSON.stringify(colabAPI)); },[colabAPI]);
      useEffect(()=>{ localStorage.setItem("rh_empresa_id",empresaId); },[empresaId]);
      useEffect(()=>{
        async function _carregarColab(){
          const {data,error}=await _supa.from('colaboradores').select('*').eq('empresa_id',empresaId).eq('ativo',true).order('nome');
          if(!error && data && data.length>0){
            setColabAPI(data.map(c=>({
              nome:c.nome, setor:c.setor||'', funcao:c.funcao||'', cpf:c.cpf||'',
              telefone:c.telefone||'', chavePix:c.chave_pix||'', email:c.email||'',
              nascimento:c.nascimento||'', admissao:c.admissao||'',
              experiencia30:c.experiencia_30||'', experiencia90:c.experiencia_90||'',
              salario:Number(c.salario)||0, inss:calcINSS(c.salario), fgts:calcFGTS(c.salario),
              transporte:Number(c.transporte)||0, periculosidade:!!c.periculosidade,
              jornada:c.jornada||'SEG-SAB',
              contaSalario:!!c.conta_salario, aditivoContrato:!!c.aditivo_contrato,
              usoArmario:!!c.uso_armario, lgpd:!!c.lgpd, imagem:!!c.imagem,
              camera:!!c.camera, epiUniforme:!!c.epi_uniforme,
              acompanhamentoProducao:!!c.acompanhamento_producao,
              usoCelular:!!c.uso_celular, usoVeiculo:!!c.uso_veiculo,
              termoConfidencialidade:!!c.termo_confidencialidade,
              termoAssiduidade:!!c.termo_assiduidade,
              termoMudancaHorario:!!c.termo_mudanca_horario, id_supa:c.id
            })));
          }
        }
        _carregarColab();
      },[empresaId]);

      const carregarPerfil = useCallback(async (uid) => {
        try {
          const {data} = await _supa.from('perfis').select('*').eq('id',uid).single();
          if(data) {
            setPerfil(data);
            if(data.empresa_id) setEmpresaId(data.empresa_id);
            setDarkMode(!!data.dark_mode);
          } else {
            setPerfil(null);
          }
        } catch(e) {
          setPerfil(null);
        }
        setLoadingAuth(false);
      },[]);

      const [modoRecovery, setModoRecovery] = useState(false);
      useEffect(()=>{
        _supa.auth.getSession().then(({data:{session}})=>{
          if(session?.user){ setUsuario(session.user); carregarPerfil(session.user.id); }
          else setLoadingAuth(false);
        });
        const {data:{subscription}} = _supa.auth.onAuthStateChange((event,session)=>{
          if(event === 'PASSWORD_RECOVERY'){
            // Link de redefinição de senha — exibe NovaSenhaPage.
            setModoRecovery(true);
            if(session?.user) setUsuario(session.user);
            setLoadingAuth(false);
            return;
          }
          if(session?.user){ setUsuario(session.user); carregarPerfil(session.user.id); }
          else { setUsuario(null); setPerfil(null); setLoadingAuth(false); }
        });
        return ()=>subscription.unsubscribe();
      },[]);

      useEffect(()=>{ document.documentElement.classList.toggle('dark', darkMode); },[darkMode]);
      const toggleDarkMode = async () => {
        const next = !darkMode;
        setDarkMode(next);
        if(usuario?.id) await _supa.from('perfis').update({dark_mode:next}).eq('id',usuario.id);
      };

      const valorPassagem=parseFloat(passagemStr.replace(",","."))||0;

      // getDias respeita feriados e afastamento
      const getDias=(emp)=>{
        if(emp.afastado) return 0;
        const dias=emp.escala==="SEG-SAB"?DIAS_SS:DIAS_SF;
        return dias.filter(d=>emp.presente?.[d]&&!feriadosDia[d]).length;
      };

      // getValorFinal usa valorPago se preenchido, senão calcula
      const getValorFinal=(emp)=>{
        if(emp.afastado) return 0;
        const vp=emp.valorPago!==undefined&&emp.valorPago!==""&&emp.valorPago!==null;
        if(vp) return parseFloat(String(emp.valorPago).replace(",","."))||0;
        return getDias(emp)*2*valorPassagem;
      };

      const total=employees.reduce((s,e)=>s+getValorFinal(e),0);
      const semanaLabel=semanaIni&&semanaFim?`${fmtDate(semanaIni)} a ${fmtDate(semanaFim)}`:"— período não definido —";

      const toggleFeriado=(dia)=>setFeriadosDia(p=>({...p,[dia]:!p[dia]}));
      const toggleAtt=(id,dia)=>setEmployees(p=>p.map(e=>e.id===id?{...e,presente:{...e.presente,[dia]:!e.presente?.[dia]}}:e));
      const toggleAfastado=(id)=>setEmployees(p=>p.map(e=>e.id===id?{...e,afastado:!e.afastado}:e));
      const setValorPago=(id,val)=>setEmployees(p=>p.map(e=>e.id===id?{...e,valorPago:val}:e));
      const setAllDay=(dia,val)=>setEmployees(p=>p.map(e=>{ const dias=e.escala==="SEG-SAB"?DIAS_SS:DIAS_SF; if(!dias.includes(dia)) return e; return{...e,presente:{...e.presente,[dia]:val}}; }));
      const removeEmp=(id)=>setEmployees(p=>p.filter(e=>e.id!==id));
      const addEmp=()=>{ if(!novoNome.trim()) return; setEmployees(p=>[...p,{id:Date.now(),nome:novoNome.trim(),escala:novaEscala,presente:{},afastado:false,valorPago:""}]); setNovoNome(""); };

      const carregarVTdoBancoPonto = useCallback(async () => {
        if(!semanaIni||!semanaFim){ setCsvStatus({ok:false,msg:"Defina a semana (início e fim) antes de carregar."}); return; }
        setCsvStatus({ok:null,msg:"⏳ Buscando ponto no Banco de Ponto..."});
        const {data,error}=await _supa.from('registros_ponto').select('*').eq('empresa_id',empresaId).gte('data',semanaIni).lte('data',semanaFim).order('colaborador_nome').order('data');
        if(error){ setCsvStatus({ok:false,msg:"❌ "+error.message}); return; }
        if(!data||data.length===0){ setCsvStatus({ok:false,msg:"Nenhum registro encontrado para este período no Banco de Ponto. Importe o CSV no módulo 📋 Banco de Ponto primeiro."}); return; }
        // Mapa de jornada cadastrada no perfil do colaborador (chave: nome normalizado)
        const normNome = n => String(n||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
        const jornadaPorNome = {};
        (colabAPI||[]).forEach(c=>{ if(c?.nome) jornadaPorNome[normNome(c.nome)] = c.jornada || 'SEG-SAB'; });
        const empMap={};
        data.forEach(r=>{
          const dt=new Date(r.data+'T12:00:00');
          const diaKey=WEEKDAY_MAP[dt.getDay()];
          if(!diaKey||diaKey==='DOM') return;
          const temBatida=r.real_b1&&r.real_b1!==''&&r.real_b1!=='00:00';
          if(!empMap[r.colaborador_nome]) empMap[r.colaborador_nome]={nome:r.colaborador_nome,cracha:r.cracha,presente:{},trabalhouSab:false};
          empMap[r.colaborador_nome].presente[diaKey]=!!temBatida;
          if(diaKey==='SAB'&&temBatida) empMap[r.colaborador_nome].trabalhouSab=true;
        });
        const emps=Object.values(empMap).map((e,i)=>{
          // Prioriza a jornada cadastrada no perfil do colaborador (Colaboradores > Jornada de Trabalho).
          // Apenas se não houver cadastro é que cai no fallback de auto-detecção pelo sábado.
          const jornadaCadastro = jornadaPorNome[normNome(e.nome)];
          const escalaFinal = jornadaCadastro || (e.trabalhouSab ? "SEG-SAB" : "SEG-SEX");
          return {
            id:i+1,cracha:e.cracha,nome:e.nome,
            escala: escalaFinal,
            presente:e.presente,afastado:false,valorPago:""
          };
        });
        setEmployees(emps);
        setCsvStatus({ok:true,msg:`✅ ${emps.length} colaboradores carregados do Banco de Ponto. Período: ${fmtDate(semanaIni)} a ${fmtDate(semanaFim)}.`});
      },[semanaIni,semanaFim,empresaId,colabAPI]);

      const carregarDoHistorico=useCallback((entrada)=>{
        setEmployees(entrada.employees.map(e=>({afastado:false,valorPago:"",...e})));
        setSemanaIni(entrada.semanaIni);
        setSemanaFim(entrada.semanaFim);
        setCsvStatus({ok:true,msg:`✅ Semana ${entrada.label} carregada do histórico.`});
      },[]);

      const handleFile=useCallback((file)=>{
        if(!file){ return; }
        if(!file.name.toLowerCase().endsWith(".csv")){ setCsvStatus({ok:false,msg:"Selecione um arquivo .csv exportado do ponto eletrônico."}); return; }
        const reader=new FileReader();
        reader.onload=(e)=>{
          try{
            const bytes=new Uint8Array(e.target.result);
            const text=new TextDecoder("iso-8859-1").decode(bytes);
            const {employees:emps,semanaIni:ini,semanaFim:fim}=parseCSV(text);
            // Sobrescreve a escala auto-detectada pelo CSV com a jornada cadastrada no perfil do colaborador,
            // quando disponível. Evita marcar como SEG-SEX um colaborador SEG-SAB que faltou no sábado.
            const normNome = n => String(n||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
            const jornadaPorNome = {};
            (colabAPI||[]).forEach(c=>{ if(c?.nome) jornadaPorNome[normNome(c.nome)] = c.jornada || 'SEG-SAB'; });
            emps.forEach(emp => {
              const j = jornadaPorNome[normNome(emp.nome)];
              if(j) emp.escala = j;
            });
            setEmployees(emps.map((emp,i)=>({...emp,id:i+1})));
            setSemanaIni(ini);
            setSemanaFim(fim);
            setCsvStatus({ok:true,msg:`✅ ${emps.length} colaboradores importados. Período: ${fmtDate(ini)} a ${fmtDate(fim)}.`});
            const lbl=`${fmtDate(ini)} a ${fmtDate(fim)}`;
            setHistorico(prev=>{
              const sem=prev.filter(h=>h.semanaIni!==ini||h.semanaFim!==fim);
              return [{id:Date.now(),label:lbl,semanaIni:ini,semanaFim:fim,employees:emps.map((e,i)=>({...e,id:i+1})),importadoEm:new Date().toLocaleString("pt-BR")},...sem].slice(0,12);
            });
            // Salva dados detalhados do ponto no Supabase
            try {
              const empMap = parsePontoDetalhado(text);
              upsertRegistrosPonto(empMap, empresaId).then(r=>{
                if(r.count>0) setCsvStatus(prev=>({...prev, msg:(prev?.msg||'')+` | 🗄️ ${r.count} registros de ponto salvos.`}));
              }).catch(()=>{});
            } catch(_){}
          }catch(err){
            setCsvStatus({ok:false,msg:`Erro ao processar arquivo: ${err.message}`});
          }
        };
        reader.readAsArrayBuffer(file);
      },[empresaId,colabAPI]);

      const onDrop=useCallback((e)=>{ e.preventDefault(); setDrag(false); handleFile(e.dataTransfer.files[0]); },[handleFile]);

      // Exportar CSV para download
      const exportarCSV=useCallback(()=>{
        if(employees.length===0) return;
        const header=["Semana Início","Semana Fim","Colaborador","Escala","Dias Trabalhados","Passagens","Valor Calculado","Valor Pago","Afastado"];
        const rows=employees.map(emp=>[
          semanaIni,semanaFim,emp.nome,emp.escala,
          getDias(emp),getDias(emp)*2,
          (getDias(emp)*2*valorPassagem).toFixed(2).replace(".",","),
          getValorFinal(emp).toFixed(2).replace(".",","),
          emp.afastado?"Sim":"Não"
        ]);
        const csv=[header,...rows].map(r=>r.join(";")).join("\n");
        const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
        const url=URL.createObjectURL(blob);
        const a=document.createElement("a");
        a.href=url;
        a.download=`VT_${semanaIni}_${semanaFim}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      },[employees,semanaIni,semanaFim,valorPassagem]);

      // Copiar CSV para clipboard
      const copiarCSV=useCallback(()=>{
        if(employees.length===0) return;
        const header=["Semana Início","Semana Fim","Colaborador","Escala","Dias","Passagens","Vlr Calculado","Vlr Pago","Afastado"];
        const rows=employees.map(emp=>[
          fmtDate(semanaIni),fmtDate(semanaFim),emp.nome,emp.escala,
          getDias(emp),getDias(emp)*2,
          getValorFinal(emp).toFixed(2).replace(".",","),
          getValorFinal(emp).toFixed(2).replace(".",","),
          emp.afastado?"Sim":"Não"
        ]);
        const tsv=[header,...rows].map(r=>r.join("\t")).join("\n");
        navigator.clipboard.writeText(tsv).then(()=>{
          setCopiedCsv(true);
          setTimeout(()=>setCopiedCsv(false),2500);
        });
      },[employees,semanaIni,semanaFim,valorPassagem]);

      const printRecibo=useCallback(()=>{

              <div style="font-size:7pt;color:#999;margin-top:2px">Data: ___/___/______</div>

          @media print{body{padding:5mm 7mm}}
        </style></head><body>
        <div style="border-bottom:3px solid #1B3A2B;padding-bottom:8px;margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;align-items:flex-end">

          <div class="resumo-item"><div class="resumo-label">Total passagens</div><div class="resumo-val">${totalPass}</div></div>
          <div class="resumo-item"><div class="resumo-label">Valor/passagem</div><div class="resumo-val">${fmtBRL(vp)}</div></div>
          <div class="resumo-item hl"><div class="resumo-label">Total a pagar</div><div class="resumo-val">${fmtBRL(tot)}</div></div>
        </div>
        <div class="assinaturas">
          <div class="assin-item"><div class="assin-linha"></div><div class="assin-label">Responsável pelo Pagamento</div><div class="assin-label">Data: ___/___/______</div></div>
          <div class="assin-item"><div class="assin-linha"></div><div class="assin-label">Conferência</div><div class="assin-label">Data: ___/___/______</div></div>
        </div>
        </body></html>`;
        const old=document.getElementById("__print_iframe");
        if(old) old.remove();
        const iframe=document.createElement("iframe");
        iframe.id="__print_iframe";
        iframe.style.cssText="position:fixed;top:-9999px;left:-9999px;width:0;height:0;border:none";
        document.body.appendChild(iframe);
        iframe.contentDocument.open();
        iframe.contentDocument.write(html);
        iframe.contentDocument.close();
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
        setTimeout(()=>{ if(iframe.parentNode) iframe.remove(); },2000);
      },[employees,semanaIni,semanaFim,empresa,responsavel,passagemStr,feriadosDia]);

      const vtTabs=[
        {k:"import",l:"📋 Banco de Ponto"},
        {k:"manual",l:"✏️ Manual"},
        {k:"ponto",l:"📋 Ponto"},
        {k:"recibo",l:"🖨️ Recibo"},
        {k:"hist",l:"📚 Histórico"},
        {k:"sheets",l:"📊 Exportar VT"},
      ];

      const vtPageContent=(
        <div>
          <div style={{marginBottom:20}}>
            <div style={{fontSize:20,fontWeight:800,color:C.pri,marginBottom:4}}>🚌 Vale Transporte</div>
            <div style={{fontSize:13,color:C.muted}}>Controle semanal de presença e geração de recibo</div>
          </div>

          <div style={s.card}>

              </div>

            <div style={{...s.grid2,marginTop:12}}>
              <div><label style={s.label}>Semana — Início</label><input style={s.input} type="date" value={semanaIni} onChange={e=>setSemanaIni(e.target.value)}/></div>
              <div><label style={s.label}>Semana — Fim</label><input style={s.input} type="date" value={semanaFim} onChange={e=>setSemanaFim(e.target.value)}/></div>

          {/* ── TAB BANCO DE PONTO ── */}
          {vtTab==="import"&&(

              {employees.length>0&&(
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:C.rowAlt,borderRadius:8,padding:"10px 14px",border:`1px solid ${C.border}`,marginTop:12}}>

                    {employees.map((emp,i)=>(
                      <tr key={emp.id} style={s.row(i)}>
                        <td style={{...s.tdC,color:C.muted}}>{i+1}</td>
                        <td style={s.td}><input style={{...s.input,fontSize:12}} value={emp.nome} onChange={e=>setEmployees(p=>p.map(x=>x.id===emp.id?{...x,nome:e.target.value}:x))}/></td>
                        <td style={s.td}>

                <select style={{...s.select,minWidth:140}} value={novaEscala} onChange={e=>setNovaEscala(e.target.value)}>

              ):(
                <div style={s.card}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,flexWrap:"wrap",gap:8}}>
                    <div style={s.cardTitle}>📋 Semana: <span style={{color:C.acc,marginLeft:6}}>{semanaLabel}</span></div>
                    <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
                      {Object.values(feriadosDia).some(Boolean)&&(
                        <div style={{fontSize:11,background:C.amberBg,color:C.amber,border:`1px solid ${C.amber}`,borderRadius:6,padding:"4px 10px",fontWeight:700}}>
                          ⚠️ {Object.values(feriadosDia).filter(Boolean).length} dia(s) como feriado/folga
                        </div>
                      )}
                      <div style={{fontSize:12,color:C.muted,background:C.rowAlt,borderRadius:7,padding:"6px 12px",border:`1px solid ${C.border}`}}>

                      </div>

                      🎯 <strong>Pago R$</strong>: valor ajustado (ex: arredondamento) — substitui o calculado
                    </div>

                      📅 <strong>Feriado/Folga</strong>: marque o dia no cabeçalho — descontado de todos
