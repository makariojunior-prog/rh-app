                </div>
              </div>
              {editando.role==='usuario'&&(
                <div style={{marginBottom:16}}>
                  <label style={s.label}>Páginas permitidas</label>
                  <CheckPaginas paginas={editando.paginas||[]} onChange={k=>setEditando(p=>({...p,paginas:p.paginas.includes(k)?p.paginas.filter(x=>x!==k):[...p.paginas,k]}))}/>
                </div>
              )}
              {editando.role==='admin'&&<div style={{...s.infoBox,marginBottom:16}}>Administradores têm acesso a todas as páginas automaticamente.</div>}
              <div style={{display:'flex',gap:10}}>
                <button onClick={salvarEdicao} style={s.btn} disabled={loading}>{loading?'Salvando...':'💾 Salvar'}</button>
                <button onClick={()=>setEditando(null)} style={s.btnOutline}>Cancelar</button>
              </div>
            </div>

            {/* ----- Seção de senha ----- */}
            <div style={{...s.card,borderLeft:`4px solid ${C.acc}`}}>
              <div style={{fontWeight:700,color:C.pri,marginBottom:6,fontSize:13,textTransform:'uppercase',letterSpacing:'0.05em'}}>🔑 Senha do Usuário</div>
              {editando.id === adminPerfil?.id ? (
                <>
                  <div style={{fontSize:12,color:C.muted,marginBottom:10}}>Como você está editando o seu próprio acesso, pode definir uma nova senha aqui. Após salvar, será necessário fazer login novamente.</div>
                  <div style={{marginBottom:12}}>
                    <label style={s.label}>Nova senha (mínimo 6 caracteres)</label>
                    <input style={s.input} type="text" autoComplete="new-password" placeholder="Digite a nova senha"
                      value={editando.novaSenha||''}
                      onChange={e=>setEditando(p=>({...p,novaSenha:e.target.value}))}/>
                  </div>
                  <button onClick={alterarSenhaPropria} style={{...s.btnAcc}} disabled={loading||!(editando.novaSenha||'').trim()}>
                    {loading?'Alterando...':'🔑 Alterar minha senha'}
                  </button>
                </>
              ) : (
                <>
                  <div style={{fontSize:12,color:C.muted,marginBottom:10}}>
                    Por questões de segurança do Supabase Auth, não é possível alterar a senha de outro usuário diretamente. Envie um link de redefinição para o email cadastrado — o usuário cria a nova senha em seguida.
                  </div>
                  <button onClick={()=>resetarSenha(editando)} style={{...s.btnAcc}} disabled={loading}>
                    {loading?'Enviando...':'📧 Enviar link de redefinição por email'}
                  </button>
                </>
              )}
            </div>
          </div>
        );

        if(criando) return (
          <div>
            <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:20}}>
              <button onClick={()=>{setCriando(false);setStatus(null);}} style={s.btnOutline}>← Voltar</button>
              <div style={{fontSize:18,fontWeight:800,color:C.pri}}>➕ Novo Acesso</div>
            </div>
            {status&&<div style={{padding:'10px 14px',borderRadius:6,marginBottom:14,background:status.ok?'#DCFCE7':'#FEE2E2',color:status.ok?'#166534':'#991B1B',fontSize:13,wordBreak:'break-word'}}>{status.msg}</div>}
            <div style={s.card}>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0 20px'}}>
                <div style={{marginBottom:14}}>
                  <label style={s.label}>Nome *</label>
                  <input style={s.input} placeholder="Nome completo" value={form.nome} onChange={e=>setForm(p=>({...p,nome:e.target.value}))}/>
                </div>
                <div style={{marginBottom:14}}>
                  <label style={s.label}>Email *</label>
                  <input style={s.input} type="email" placeholder="email@exemplo.com" value={form.email} onChange={e=>setForm(p=>({...p,email:e.target.value}))}/>
                </div>
                <div style={{marginBottom:16}}>
                  <label style={s.label}>Senha temporária *</label>
                  <input style={s.input} placeholder="Mínimo 6 caracteres" value={form.senha} onChange={e=>setForm(p=>({...p,senha:e.target.value}))}/>
                </div>
              </div>
              <div style={{...s.infoBox,marginBottom:14,fontSize:12}}>
                💡 <strong>Conta antiga / removida?</strong> Se o email já existia no sistema antes e foi removido só da lista de acessos, informe a <strong>senha original</strong> do usuário aqui — o sistema vai revalidar e recriar o perfil. Se não souber a senha, crie o acesso com qualquer senha e use o botão "🔑 Reset senha" na listagem para enviar um link de redefinição por email.
              </div>
              <div style={{marginBottom:16}}>
                <label style={s.label}>Perfil de acesso</label>
                <div style={{display:'flex',gap:10,marginTop:6}}>
                  {['admin','usuario'].map(r=>(
                    <label key={r} style={{display:'flex',alignItems:'center',gap:6,fontSize:13,cursor:'pointer',padding:'7px 14px',borderRadius:7,border:`1.5px solid ${form.role===r?C.pri:C.border}`,background:form.role===r?'var(--c-cream)':'transparent',fontWeight:form.role===r?700:400}}>
                      <input type="radio" name="role_new" checked={form.role===r} onChange={()=>setForm(p=>({...p,role:r}))} style={{cursor:'pointer'}}/>
                      {r==='admin'?'👑 Administrador':'👤 Usuário'}
                    </label>
                  ))}
                </div>
              </div>
              {form.role==='usuario'&&(
                <div style={{marginBottom:16}}>
                  <label style={s.label}>Páginas permitidas</label>
                  <CheckPaginas paginas={form.paginas} onChange={togglePagina}/>
                </div>
              )}
              {form.role==='admin'&&<div style={{...s.infoBox,marginBottom:16}}>Administradores têm acesso a todas as páginas automaticamente.</div>}
              <div style={{display:'flex',gap:10}}>
                <button onClick={criarAcesso} style={s.btn} disabled={loading}>{loading?'Criando...':'✅ Criar Acesso'}</button>
                <button onClick={()=>{setCriando(false);setStatus(null);}} style={s.btnOutline}>Cancelar</button>
              </div>
            </div>
          </div>
        );

        return (
          <div>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
              <div style={{fontSize:20,fontWeight:800,color:C.pri}}>🔐 Gerenciar Acessos</div>
              <button onClick={()=>{setForm(FORM_VAZIO);setCriando(true);setStatus(null);}} style={s.btn}>+ Novo Acesso</button>
            </div>
            {status&&<div style={{padding:'10px 14px',borderRadius:6,marginBottom:14,background:status.ok?'#DCFCE7':'#FEE2E2',color:status.ok?'#166534':'#991B1B',fontSize:13,wordBreak:'break-word'}}>{status.msg}</div>}
            {loading?(
              <div style={{textAlign:'center',padding:40,color:C.muted}}>Carregando...</div>
            ):(
              <div style={s.card}>
                {lista.length===0?(
                  <div style={{textAlign:'center',padding:'32px 0',color:C.muted,fontSize:13}}>Nenhum usuário com acesso cadastrado.</div>
                ):(
                  <table style={s.table}>
                    <thead>
                      <tr>
                        <th style={s.th}>Nome</th>
                        <th style={s.th}>Email</th>
                        <th style={s.th}>Perfil</th>
                        <th style={s.th}>Páginas</th>
                        <th style={s.th}></th>
                      </tr>
                    </thead>
                    <tbody>
                      {lista.map(p=>(
                        <tr key={p.id} style={{borderBottom:`1px solid ${C.border}`}}>
                          <td style={{...s.td,fontWeight:600}}>{p.nome} {p.id===adminPerfil?.id&&<span style={{fontSize:10,color:C.muted}}>(você)</span>}</td>
                          <td style={{...s.td,fontSize:12,color:C.muted}}>{p.email}</td>
                          <td style={s.td}>
                            <span style={{display:'inline-block',padding:'3px 10px',borderRadius:20,fontSize:11,fontWeight:700,background:p.role==='admin'?'#FEF3C7':'#DBEAFE',color:p.role==='admin'?'#92400E':'#1E40AF'}}>
                              {p.role==='admin'?'👑 Admin':'👤 Usuário'}
                            </span>
                          </td>
                          <td style={{...s.td,fontSize:12,color:C.muted,maxWidth:200}}>
                            {p.role==='admin'?'Todas':(p.paginas||[]).length+' página(s)'}
                          </td>
                          <td style={{...s.td,textAlign:'right',whiteSpace:'nowrap'}}>
                            <button onClick={()=>setEditando({...p})} style={{...s.btnOutline,fontSize:11,padding:'4px 10px',marginRight:6}}>✏️ Editar</button>
                            {p.id!==adminPerfil?.id&&<button onClick={()=>resetarSenha(p)} style={{background:'none',border:`1px solid ${C.acc}`,color:C.acc,borderRadius:5,fontSize:11,padding:'4px 10px',cursor:'pointer',marginRight:6}} title="Enviar link de redefinição de senha por email">🔑 Reset senha</button>}
                            {p.id!==adminPerfil?.id&&<button onClick={()=>removerAcesso(p)} style={{background:'none',border:'1px solid #FCA5A5',color:'#DC2626',borderRadius:5,fontSize:11,padding:'4px 10px',cursor:'pointer'}}>Remover</button>}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                )}
              </div>
            )}
          </div>
        );
      }

      function AtestadosPage({colabAPI, empresaId}) {
        function normStr(s) {
          return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]/g,'').toUpperCase();
        }
        const calcDias = (ini,fim) => {
          if(!ini||!fim) return 1;
          return Math.max(1, Math.round((new Date(fim+'T12:00:00')-new Date(ini+'T12:00:00'))/86400000)+1);
        };
        const VAZIO = {colaboradorNome:'',setor:'',cid:'',inicio:'',fim:'',obs:'',periodo:'dia_todo'};
        const hoje = new Date();
        const priDia = new Date(hoje.getFullYear(), hoje.getMonth(), 1).toISOString().slice(0,10);
        const ultDia = new Date(hoje.getFullYear(), hoje.getMonth()+1, 0).toISOString().slice(0,10);
        const [iniF, setIniF] = React.useState(priDia);
        const [fimF, setFimF] = React.useState(ultDia);
        const [lista, setLista] = React.useState([]);
        const [loading, setLoading] = React.useState(true);
        const [status, setStatus] = React.useState(null);
        const [filtroColab, setFiltroColab] = React.useState('');
        const [form, setForm] = React.useState(VAZIO);
        const [mostrarForm, setMostrarForm] = React.useState(false);

        const carregar = async () => {
          if(!empresaId) return;
          setLoading(true);
          const {data,error} = await _supa.from('atestados')
            .select('*').eq('empresa_id',empresaId)
            .gte('inicio',iniF).lte('inicio',fimF)
            .order('inicio',{ascending:false});
          if(!error) setLista(data||[]);
          setLoading(false);
        };

        React.useEffect(()=>{ carregar(); },[empresaId,iniF,fimF]);

        const salvarNovo = async () => {
          if(!form.colaboradorNome||!form.inicio||!form.fim){
            setStatus({ok:false,msg:'Preencha colaborador, início e fim.'}); return;
          }
          if(form.fim < form.inicio){
            setStatus({ok:false,msg:'A data de fim não pode ser anterior ao início.'}); return;
          }
          if(form.periodo !== 'dia_todo' && form.inicio !== form.fim){
            setStatus({ok:false,msg:'Atestado de meio período deve ter início e fim no mesmo dia.'}); return;
          }
          setLoading(true);
          const dias = calcDias(form.inicio,form.fim);
          const {error} = await _supa.from('atestados').insert({
            id: crypto.randomUUID(),
            empresa_id: empresaId,
            colaborador_nome: form.colaboradorNome.trim(),
            setor: form.setor||null, cid: form.cid||null,
            inicio: form.inicio, fim: form.fim, dias,
            obs: form.obs||null, origem: 'manual',
            periodo: form.periodo||'dia_todo'
          });
          if(error){ setStatus({ok:false,msg:'❌ '+error.message}); }
          else { setStatus({ok:true,msg:'✅ Atestado incluído!'}); setMostrarForm(false); setForm(VAZIO); carregar(); }
          setLoading(false);
        };

        const excluir = async (id, nome) => {
          if(!await confirmar('Excluir atestado de '+nome+'?','Excluir Atestado')) return;
          await _supa.from('atestados').delete().eq('id',id);
          carregar();
        };

        const filtrados = lista.filter(a=>!filtroColab||(a.colaborador_nome||'').toLowerCase().includes(filtroColab.toLowerCase()));
        const totalDias = filtrados.reduce((acc,a)=>acc+(a.periodo&&a.periodo!=='dia_todo'?0.5:(a.dias||0)),0);
        const colab = [...new Set(filtrados.map(a=>a.colaborador_nome))].length;

        return (
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
              <div>
                <div style={{fontSize:20,fontWeight:800,color:C.pri}}>🏥 Atestados</div>
                <div style={{fontSize:13,color:C.muted}}>Atestados médicos dos colaboradores</div>
              </div>
              <div style={{display:"flex",gap:8}}>
                <button onClick={()=>{ setMostrarForm(true); setForm(VAZIO); setStatus(null); }} style={s.btn}>➕ Novo Atestado</button>
              </div>
            </div>

            {status&&<div style={{...s.card,background:status.ok===true?'#DCFCE7':status.ok===false?'#FEE2E2':'#EFF6FF',color:status.ok===true?'#166534':status.ok===false?'#991B1B':'#1D4ED8',margin:"12px 0"}}>{status.msg}</div>}

            {mostrarForm&&(
              <div style={{...s.card,marginBottom:16}}>
                <div style={{fontSize:15,fontWeight:700,color:C.pri,marginBottom:16}}>Novo Atestado</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 20px"}}>
                  <div style={{marginBottom:14,gridColumn:"1/-1"}}>
                    <label style={s.label}>Colaborador *</label>
                    <select value={form.colaboradorNome}
                      onChange={e=>{ const c=colabAPI.find(x=>x.nome===e.target.value); setForm(p=>({...p,colaboradorNome:e.target.value,setor:c?c.setor||'':''})); }}
                      style={{...s.input,width:"100%"}}>
                      <option value="">Selecione ou digite abaixo...</option>
                      {[...colabAPI].sort((a,b)=>a.nome.localeCompare(b.nome,'pt')).map(c=>(<option key={c.nome} value={c.nome}>{c.nome}</option>))}
                    </select>
                    {!colabAPI.some(c=>c.nome===form.colaboradorNome)&&(
                      <input type="text" value={form.colaboradorNome} onChange={e=>setForm(p=>({...p,colaboradorNome:e.target.value}))} placeholder="Ou digite o nome manualmente..." style={{...s.input,marginTop:4}}/>
                    )}
                  </div>
                  {form.setor&&(
                    <div style={{marginBottom:14}}>
                      <label style={s.label}>Setor (do cadastro)</label>
                      <div style={{...s.input,background:"var(--c-subtle)",color:C.muted,fontSize:13}}>{form.setor}</div>
                    </div>
                  )}
                  <div style={{marginBottom:14}}>
                    <label style={s.label}>CID</label>
                    <input type="text" value={form.cid} onChange={e=>setForm(p=>({...p,cid:e.target.value}))} placeholder="Ex: J00, M54..." style={s.input}/>
                  </div>
                  <div style={{marginBottom:14}}>
                    <label style={s.label}>Início *</label>
                    <input type="date" value={form.inicio} onChange={e=>setForm(p=>({...p,inicio:e.target.value}))} style={s.input}/>
                  </div>
                  <div style={{marginBottom:14}}>
                    <label style={s.label}>Fim *</label>
                    <input type="date" value={form.fim} onChange={e=>setForm(p=>({...p,fim:e.target.value}))} style={s.input}/>
                  </div>
                  <div style={{marginBottom:14}}>
                    <label style={s.label}>Período</label>
                    <select value={form.periodo} onChange={e=>setForm(p=>({...p,periodo:e.target.value}))} style={{...s.input,width:"100%"}}>
                      <option value="dia_todo">🌕 Dia todo</option>
                      <option value="manha">🌅 Somente manhã</option>
                      <option value="tarde">🌇 Somente tarde</option>
                    </select>
                  </div>
                  <div style={{marginBottom:14}}>
                    <label style={s.label}>Duração</label>
                    <div style={{...s.input,background:"var(--c-subtle)",color:C.muted}}>
                      {form.inicio&&form.fim ? (form.periodo!=='dia_todo' ? '½ dia' : calcDias(form.inicio,form.fim)+' dia(s)') : '—'}
                    </div>
                  </div>
                  <div style={{marginBottom:14,gridColumn:"1/-1"}}>
                    <label style={s.label}>Observações</label>
                    <input type="text" value={form.obs} onChange={e=>setForm(p=>({...p,obs:e.target.value}))} placeholder="Opcional" style={s.input}/>
                  </div>
                </div>
                <div style={{display:"flex",gap:10}}>
                  <button onClick={salvarNovo} style={s.btn} disabled={loading}>{loading?'Salvando...':'💾 Salvar'}</button>
                  <button onClick={()=>setMostrarForm(false)} style={s.btnOutline}>Cancelar</button>
                </div>
              </div>
            )}

            <div style={{...s.card,display:"flex",gap:12,alignItems:"flex-end",flexWrap:"wrap",marginBottom:16}}>
              <div><label style={s.label}>De</label><input type="date" value={iniF} onChange={e=>setIniF(e.target.value)} style={s.input}/></div>
              <div><label style={s.label}>Até</label><input type="date" value={fimF} onChange={e=>setFimF(e.target.value)} style={s.input}/></div>
              <div style={{flex:1,minWidth:180}}>
                <label style={s.label}>Filtrar colaborador</label>
                <input type="text" value={filtroColab} onChange={e=>setFiltroColab(e.target.value)} placeholder="Nome..." style={s.input}/>
              </div>
            </div>

            {filtrados.length>0&&(
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:16}}>
                <div style={{...s.card,textAlign:"center",padding:"16px"}}><div style={{fontSize:28,fontWeight:800,color:C.pri}}>{filtrados.length}</div><div style={{fontSize:12,color:C.muted}}>Atestados</div></div>
                <div style={{...s.card,textAlign:"center",padding:"16px"}}><div style={{fontSize:28,fontWeight:800,color:C.pri}}>{totalDias}</div><div style={{fontSize:12,color:C.muted}}>Dias afastados</div></div>
                <div style={{...s.card,textAlign:"center",padding:"16px"}}><div style={{fontSize:28,fontWeight:800,color:C.pri}}>{colab}</div><div style={{fontSize:12,color:C.muted}}>Colaboradores</div></div>
              </div>
            )}

            <div style={{...s.card,padding:0,overflow:"hidden"}}>
              <table style={{width:"100%",borderCollapse:"collapse"}}>
                <thead><tr style={{background:"var(--c-subtle)"}}>
                  <th style={s.th}>Colaborador</th><th style={s.th}>Setor</th><th style={s.th}>CID</th>
                  <th style={s.th}>Início</th><th style={s.th}>Fim</th>
                  <th style={{...s.th,textAlign:"center"}}>Dias</th>
                  <th style={s.th}>Período</th>
                  <th style={s.th}>Obs.</th><th style={s.th}>Origem</th>
                  <th style={{...s.th,textAlign:"right"}}></th>
                </tr></thead>
                <tbody>
                  {loading?(
                    <tr><td colSpan={10} style={{textAlign:"center",padding:"32px",color:C.muted}}>Carregando...</td></tr>
                  ):filtrados.length===0?(
                    <tr><td colSpan={10} style={{textAlign:"center",padding:"32px",color:C.muted}}>
                      Nenhum atestado no período. Clique em "➕ Novo Atestado" para incluir.
                    </td></tr>
                  ):filtrados.map(a=>{
                    const d1=a.inicio?new Date(a.inicio+'T12:00:00'):null;
                    const d2=a.fim?new Date(a.fim+'T12:00:00'):null;
                    return(
                      <tr key={a.id} style={{borderTop:"1px solid "+C.border,background:"#fff"}}>
                        <td style={{...s.td,fontWeight:600}}>{a.colaborador_nome}</td>
                        <td style={{...s.td,fontSize:12,color:C.muted}}>{a.setor||"—"}</td>
                        <td style={{...s.td,fontSize:12}}>{a.cid||"—"}</td>
                        <td style={{...s.td,fontSize:12}}>{d1?d1.toLocaleDateString('pt-BR'):'—'}</td>
                        <td style={{...s.td,fontSize:12}}>{d2?d2.toLocaleDateString('pt-BR'):'—'}</td>
                        <td style={{...s.td,textAlign:"center",fontWeight:700,color:(a.dias||0)>3?"#DC2626":C.text}}>
                          {a.periodo&&a.periodo!=='dia_todo' ? '½' : (a.dias||1)}
                        </td>
                        <td style={{...s.td,fontSize:12}}>
                          {!a.periodo||a.periodo==='dia_todo'
                            ? <span style={{color:C.muted}}>Dia todo</span>
                            : <span style={{background:"#FEF3C7",color:"#92400E",padding:"2px 7px",borderRadius:8,fontWeight:600,fontSize:11}}>
                                {a.periodo==='manha'?'🌅 Manhã':'🌇 Tarde'}
                              </span>
                          }
                        </td>
                        <td style={{...s.td,fontSize:12,color:C.muted,maxWidth:160}}>{a.obs||"—"}</td>
                        <td style={{...s.td,fontSize:11}}>
                          <span style={{background:a.origem==='manual'?"#EDE9FE":"#F0F9F4",color:a.origem==='manual'?"#6D28D9":"#166534",padding:"2px 7px",borderRadius:8,fontWeight:600}}>{a.origem==='manual'?'Manual':'Planilha'}</span>
                        </td>
                        <td style={{...s.td,textAlign:"right"}}>
                          <button onClick={()=>excluir(a.id,a.colaborador_nome)} style={{background:"none",border:"1px solid #FCA5A5",color:"#DC2626",borderRadius:4,fontSize:11,padding:"3px 8px",cursor:"pointer"}}>✕</button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        );
      }

      function FeriasPage({colabAPI, empresaId}) {
        const VAZIO = {colaboradorId:'',colaboradorNome:'',inicio:'',fim:'',status:'agendado',observacoes:''};
        const [lista, setLista] = React.useState([]);
        const [loading, setLoading] = React.useState(true);
        const [form, setForm] = React.useState(VAZIO);
        const [mostrarForm, setMostrarForm] = React.useState(false);
        const [status, setStatus] = React.useState(null);

        const calcDias = (ini,fim) => {
          if(!ini||!fim) return 0;
          return Math.max(0,Math.round((new Date(fim+'T12:00:00')-new Date(ini+'T12:00:00'))/86400000)+1);
        };

        const carregar = async () => {
          setLoading(true);
          const {data,error} = await _supa.from('ferias').select('*').eq('empresa_id',empresaId).order('inicio',{ascending:false});
          if(!error) setLista(data||[]);
          setLoading(false);
        };

        React.useEffect(()=>{ if(empresaId) carregar(); },[empresaId]);

        const salvar = async () => {
          if(!form.colaboradorNome||!form.inicio||!form.fim){ setStatus({ok:false,msg:'Preencha colaborador, início e fim.'}); return; }
          if(form.fim < form.inicio){ setStatus({ok:false,msg:'A data de fim não pode ser anterior ao início.'}); return; }
          setLoading(true);
          const {error} = await _supa.from('ferias').insert({
            empresa_id:empresaId, colaborador_nome:form.colaboradorNome,
            inicio:form.inicio, fim:form.fim, dias:calcDias(form.inicio,form.fim),
            status:form.status, observacoes:form.observacoes||null
          });
          if(error){ setStatus({ok:false,msg:'❌ '+error.message}); }
          else { setStatus({ok:true,msg:'✅ Férias agendadas!'}); setMostrarForm(false); carregar(); }
          setLoading(false);
        };

        const alterarStatus = async (id, novoStatus) => {
          await _supa.from('ferias').update({status:novoStatus,atualizado_em:new Date().toISOString()}).eq('id',id);
          carregar();
        };

        const excluir = async (id, nome) => {
          if(!await confirmar('Excluir férias de '+nome+'?','Excluir Férias')) return;
          await _supa.from('ferias').delete().eq('id',id);
          carregar();
        };

        const CORES = {
          agendado: {bg:"#EFF6FF",c:"#1D4ED8",l:"Agendado"},
          em_gozo:  {bg:"#FEF9C3",c:"#92400E",l:"Em gozo"},
          concluido:{bg:"#DCFCE7",c:"#166534",l:"Concluído"},
          cancelado:{bg:"#FEE2E2",c:"#991B1B",l:"Cancelado"},
        };

        return (
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
              <div>
                <div style={{fontSize:20,fontWeight:800,color:C.pri}}>🏖️ Férias</div>
                <div style={{fontSize:13,color:C.muted}}>Agendamento e controle de férias</div>
              </div>
              <button onClick={()=>{setMostrarForm(true);setForm(VAZIO);setStatus(null);}} style={s.btn}>➕ Agendar Férias</button>
            </div>
            {status&&<div style={{...s.card,background:status.ok?'#DCFCE7':'#FEE2E2',color:status.ok?'#166534':'#991B1B',marginBottom:16}}>{status.msg}</div>}
            {mostrarForm&&(
              <div style={{...s.card,marginBottom:16}}>
                <div style={{fontSize:15,fontWeight:700,color:C.pri,marginBottom:16}}>Agendar Férias</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 20px"}}>
                  <div style={{marginBottom:14,gridColumn:"1/-1"}}>
                    <label style={s.label}>Colaborador *</label>
                    <select value={form.colaboradorNome} onChange={e=>setForm(p=>({...p,colaboradorNome:e.target.value}))} style={{...s.input,width:"100%"}}>
                      <option value="">Selecione...</option>
                      {[...colabAPI].sort((a,b)=>a.nome.localeCompare(b.nome,'pt')).map(c=>(<option key={c.nome} value={c.nome}>{c.nome}</option>))}
                    </select>
                  </div>
                  <div style={{marginBottom:14}}>
                    <label style={s.label}>Início *</label>
                    <input type="date" value={form.inicio} onChange={e=>setForm(p=>({...p,inicio:e.target.value}))} style={s.input}/>
                  </div>
                  <div style={{marginBottom:14}}>
                    <label style={s.label}>Fim *</label>
                    <input type="date" value={form.fim} onChange={e=>setForm(p=>({...p,fim:e.target.value}))} style={s.input}/>
                  </div>
                  <div style={{marginBottom:14}}>
                    <label style={s.label}>Duração</label>
                    <div style={{...s.input,background:"var(--c-subtle)",color:C.muted}}>{form.inicio&&form.fim?calcDias(form.inicio,form.fim)+' dias corridos':'—'}</div>
                  </div>
                  <div style={{marginBottom:14}}>
                    <label style={s.label}>Status</label>
                    <select value={form.status} onChange={e=>setForm(p=>({...p,status:e.target.value}))} style={s.input}>
                      <option value="agendado">Agendado</option>
                      <option value="em_gozo">Em gozo</option>
                      <option value="concluido">Concluído</option>
                      <option value="cancelado">Cancelado</option>
                    </select>
                  </div>
                  <div style={{marginBottom:14,gridColumn:"1/-1"}}>
                    <label style={s.label}>Observações</label>
                    <input type="text" value={form.observacoes} onChange={e=>setForm(p=>({...p,observacoes:e.target.value}))} placeholder="Opcional" style={s.input}/>
                  </div>
                </div>
                <div style={{display:"flex",gap:10}}>
                  <button onClick={salvar} style={s.btn} disabled={loading}>{loading?'Salvando...':'💾 Salvar'}</button>
                  <button onClick={()=>setMostrarForm(false)} style={s.btnOutline}>Cancelar</button>
                </div>
              </div>
            )}
            <div style={{...s.card,padding:0,overflow:"hidden"}}>
              <table style={{width:"100%",borderCollapse:"collapse"}}>
                <thead><tr style={{background:"var(--c-subtle)"}}>
                  <th style={s.th}>Colaborador</th><th style={s.th}>Início</th><th style={s.th}>Fim</th>
                  <th style={{...s.th,textAlign:"center"}}>Dias</th><th style={{...s.th,textAlign:"center"}}>Status</th>
                  <th style={{...s.th,textAlign:"right"}}>Ações</th>
                </tr></thead>
                <tbody>
                  {lista.length===0?(
                    <tr><td colSpan={6} style={{textAlign:"center",padding:"32px",color:C.muted}}>
                      {loading?'Carregando...':'Nenhuma férias agendada. Clique em "Agendar Férias" para começar.'}
                    </td></tr>
                  ):lista.map(f=>{
                    const cor=CORES[f.status]||CORES.agendado;
                    return(
                      <tr key={f.id} style={{borderTop:"1px solid "+C.border,background:"#fff"}}>
                        <td style={{...s.td,fontWeight:600}}>{f.colaborador_nome}</td>
                        <td style={{...s.td,fontSize:12}}>{f.inicio?new Date(f.inicio+'T12:00:00').toLocaleDateString('pt-BR'):'—'}</td>
                        <td style={{...s.td,fontSize:12}}>{f.fim?new Date(f.fim+'T12:00:00').toLocaleDateString('pt-BR'):'—'}</td>
                        <td style={{...s.td,textAlign:"center",fontWeight:700}}>{f.dias}</td>
                        <td style={{...s.td,textAlign:"center"}}>
                          <span style={{background:cor.bg,color:cor.c,padding:"3px 10px",borderRadius:10,fontSize:11,fontWeight:700}}>{cor.l}</span>
                        </td>
                        <td style={{...s.td,textAlign:"right",whiteSpace:"nowrap"}}>
                          <select onChange={e=>alterarStatus(f.id,e.target.value)} value={f.status}
                            style={{fontSize:11,border:"1px solid "+C.border,borderRadius:4,padding:"3px 6px",marginRight:8,cursor:"pointer"}}>
                            <option value="agendado">Agendado</option>
                            <option value="em_gozo">Em gozo</option>
                            <option value="concluido">Concluído</option>
                            <option value="cancelado">Cancelado</option>
                          </select>
                          <button onClick={()=>excluir(f.id,f.colaborador_nome)}
                            style={{background:"none",border:"1px solid #FCA5A5",color:"#DC2626",borderRadius:4,fontSize:11,padding:"3px 8px",cursor:"pointer"}}>✕</button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        );
      }

      // ============================================================
      // MÓDULO RECRUTAMENTO
      // ============================================================
      function RecrutamentoPage({ empresaId }) {
        function normStr(s){ return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Z0-9]/g,'').toUpperCase(); }

        const STATUS_C=[
          {k:'novo',      l:'Novo',       bg:'#DBEAFE',c:'#1D4ED8'},
          {k:'triagem',   l:'Triagem',    bg:'#FEF9C3',c:'#92400E'},
          {k:'entrevista',l:'Entrevista', bg:'#EDE9FE',c:'#6D28D9'},
          {k:'aprovado',  l:'Aprovado',   bg:'#DCFCE7',c:'#166534'},
          {k:'reprovado', l:'Reprovado',  bg:'#FEE2E2',c:'#991B1B'},
          {k:'banco',     l:'Banco',      bg:'#F3F4F6',c:'#374151'},
        ];
        const STATUS_E=[
          {k:'agendada', l:'Agendada', bg:'#EDE9FE',c:'#6D28D9'},
          {k:'realizada',l:'Realizada',bg:'#DCFCE7',c:'#166534'},
          {k:'cancelada',l:'Cancelada',bg:'#FEE2E2',c:'#991B1B'},
        ];
        const corC=(st)=>STATUS_C.find(x=>x.k===st)||STATUS_C[0];
        const corE=(st)=>STATUS_E.find(x=>x.k===st)||STATUS_E[0];

        const [aba, setAba]               = React.useState('curriculos');
        const [candidatos, setCandidatos] = React.useState([]);
        const [loadingC, setLoadingC]     = React.useState(true);
        const [statusMsg, setStatusMsg]   = React.useState(null);
        const [filtroVaga, setFiltroVaga] = React.useState('');
        const [filtroSt, setFiltroSt]     = React.useState('');
        const [busca, setBusca]           = React.useState('');
        const [expandido, setExpandido]   = React.useState(null);
        const [entrevistas, setEntrevistas] = React.useState([]);
        const [loadingE, setLoadingE]     = React.useState(false);
        const VAZIO_E = {candidatoNome:'',vaga:'',dataEntrevista:'',horaEntrevista:'',entrevistador:'',localEntrevista:'',obs:''};
        const [mostrarFormE, setMostrarFormE] = React.useState(false);
        const [formE, setFormE]           = React.useState(VAZIO_E);
        const [editandoE, setEditandoE]   = React.useState(null);
        const [resultado, setResultado]   = React.useState(null);
        const [logs, setLogs]             = React.useState([]);
        const [configForm, setConfigForm] = React.useState(null);
        const [novaVaga, setNovaVaga]     = React.useState('');
        const [savingCfg, setSavingCfg]   = React.useState(false);

        const carregarCandidatos = async () => {
          if(!empresaId) return;
          setLoadingC(true);
          const {data} = await _supa.from('candidatos').select('*').eq('empresa_id',empresaId).order('data_inscricao',{ascending:false});
          setCandidatos(data||[]);
          setLoadingC(false);
        };
        const carregarEntrevistas = async () => {
          if(!empresaId) return;
          setLoadingE(true);
          const {data} = await _supa.from('entrevistas').select('*').eq('empresa_id',empresaId).order('data_entrevista',{ascending:true});
          setEntrevistas(data||[]);
          setLoadingE(false);
        };
        React.useEffect(()=>{ carregarCandidatos(); carregarEntrevistas(); carregarLogs(); carregarConfig(); },[empresaId]);

        const atualizarStatusC = async (id, novoSt) => {
          await _supa.from('candidatos').update({status:novoSt}).eq('id',id);
          setCandidatos(prev=>prev.map(c=>c.id===id?{...c,status:novoSt}:c));
        };

        const agendarEntrevista = (c) => {
          setFormE({...VAZIO_E,candidatoNome:c.nome,vaga:c.vaga||''});
          setEditandoE(null); setMostrarFormE(true); setAba('entrevistas');
        };

        const salvarEntrevista = async () => {
          if(!formE.candidatoNome||!formE.dataEntrevista){ setStatusMsg({ok:false,msg:'Preencha candidato e data.'}); return; }
          setLoadingE(true);
          if(editandoE){
            const dadosAntes = entrevistas.find(x=>x.id===editandoE);
            const novoDados = {candidato_nome:formE.candidatoNome,vaga:formE.vaga||null,data_entrevista:formE.dataEntrevista,hora_entrevista:formE.horaEntrevista||null,entrevistador:formE.entrevistador||null,local_entrevista:formE.localEntrevista||null,obs:formE.obs||null};
            const {error} = await _supa.from('entrevistas').update(novoDados).eq('id',editandoE);
            if(!error){
              const {data:{session}} = await _supa.auth.getSession();
              await registrarLog('edição_entrevista','entrevistas',editandoE,dadosAntes,novoDados,session?.user?.email||'Desconhecido');
              setMostrarFormE(false); setEditandoE(null); setFormE(VAZIO_E); carregarEntrevistas(); carregarLogs();
            } else setStatusMsg({ok:false,msg:'❌ '+error.message});
          } else {
            const {error} = await _supa.from('entrevistas').insert({
              empresa_id:empresaId, candidato_nome:formE.candidatoNome,
              vaga:formE.vaga||null, data_entrevista:formE.dataEntrevista,
              hora_entrevista:formE.horaEntrevista||null, entrevistador:formE.entrevistador||null,
              local_entrevista:formE.localEntrevista||null, status:'agendada', obs:formE.obs||null
            });
            if(!error){
              const cand = candidatos.find(c=>c.nome===formE.candidatoNome);
              if(cand) atualizarStatusC(cand.id,'entrevista');
              setMostrarFormE(false); setFormE(VAZIO_E); carregarEntrevistas();
              setStatusMsg({ok:true,msg:'✅ Entrevista agendada!'});
            } else setStatusMsg({ok:false,msg:'❌ '+error.message});
          }
          setLoadingE(false);
        };

        const salvarResultado = async () => {
          if(!resultado) return;
          await _supa.from('entrevistas').update({
            status:resultado.status, avaliacao:resultado.avaliacao||null, obs:resultado.obs||null
          }).eq('id',resultado.id);
          if(resultado.status==='realizada'&&resultado.avaliacao){
            const entrev = entrevistas.find(x=>x.id===resultado.id);
            if(entrev){
              const cand = candidatos.find(c=>c.nome===entrev.candidato_nome);
              if(cand) atualizarStatusC(cand.id, resultado.avaliacao>=4?'aprovado':'reprovado');
            }
          }
          setResultado(null); carregarEntrevistas();
        };

        const carregarLogs = async () => {
          if(!empresaId) return;
          const {data} = await _supa.from('logs').select('*').eq('empresa_id',empresaId).order('criado_em',{ascending:false}).limit(100);
          setLogs(data||[]);
        };
        const carregarConfig = async () => {
          if(!empresaId) return;
          const {data} = await _supa.from('formulario_config').select('*').eq('empresa_id',empresaId).single();
          setConfigForm(data||{empresa_id:empresaId,vagas:[],formulario_aberto:true,mensagem_encerrado:''});
        };
        const salvarConfig = async () => {
          if(!configForm) return;
          setSavingCfg(true);
          const {error} = await _supa.from('formulario_config').upsert({...configForm,empresa_id:empresaId,atualizado_em:new Date().toISOString()},{onConflict:'empresa_id'});
          setSavingCfg(false);
          setStatusMsg(error?{ok:false,msg:'❌ '+error.message}:{ok:true,msg:'✅ Configurações salvas! O formulário será atualizado automaticamente.'});
          setTimeout(()=>setStatusMsg(null),4000);
        };
        const registrarLog = async (acao,tabela,id,antes,depois,user) => {
          try {
            await _supa.from('logs').insert({empresa_id:empresaId,usuario:user,acao,tabela,registro_id:String(id),dados_antes:antes||null,dados_depois:depois||null});
          } catch(e){}
        };
        const excluirEntrevista = async (entrev) => {
          if(!await confirmar('Excluir a entrevista de "'+entrev.candidato_nome+'"? Um log de auditoria será criado.','Excluir Entrevista')) return;
          const {data:{session}} = await _supa.auth.getSession();
          await registrarLog('exclusão_entrevista','entrevistas',entrev.id,entrev,null,session?.user?.email||'Desconhecido');
          await _supa.from('entrevistas').delete().eq('id',entrev.id);
          carregarEntrevistas(); carregarLogs();
        };

        const vagas = [...new Set(candidatos.map(c=>c.vaga).filter(Boolean))].sort();
        const filtrados = candidatos.filter(c=>{
          if(filtroVaga&&c.vaga!==filtroVaga) return false;
          if(filtroSt&&c.status!==filtroSt) return false;
          if(busca&&!(c.nome||'').toLowerCase().includes(busca.toLowerCase())) return false;
          return true;
        });

        const tabSt = (k) => ({
          padding:'8px 18px',borderRadius:6,fontSize:13,fontWeight:700,cursor:'pointer',border:'none',
          background:aba===k?C.pri:'transparent',color:aba===k?'#fff':C.muted
        });

        return (
          <div>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
              <div style={{fontSize:20,fontWeight:800,color:C.pri}}>🧑‍💼 Recrutamento</div>
              <div style={{display:'flex',gap:4,background:'#F3F4F6',borderRadius:8,padding:4}}>
                <button style={tabSt('curriculos')} onClick={()=>setAba('curriculos')}>📋 Currículos</button>
                <button style={tabSt('entrevistas')} onClick={()=>setAba('entrevistas')}>📅 Entrevistas</button>
                <button style={tabSt('log')} onClick={()=>{setAba('log');carregarLogs();}}>🔍 Log</button>
                <button style={tabSt('formulario')} onClick={()=>{setAba('formulario');carregarConfig();}}>⚙️ Formulário</button>
              </div>
            </div>

            {statusMsg&&<div style={{padding:'10px 14px',borderRadius:6,marginBottom:14,fontSize:13,background:statusMsg.ok===true?'#DCFCE7':statusMsg.ok===false?'#FEE2E2':'#FEF9C3',color:statusMsg.ok===true?'#166534':statusMsg.ok===false?'#991B1B':'#92400E'}}>{statusMsg.msg}</div>}

            {aba==='curriculos'&&(
              <div>
                <div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap',alignItems:'center'}}>
                  <input style={{...s.input,width:200,marginBottom:0}} placeholder="Buscar por nome..." value={busca} onChange={e=>setBusca(e.target.value)}/>
                  <select style={{...s.input,width:170,marginBottom:0}} value={filtroVaga} onChange={e=>setFiltroVaga(e.target.value)}>
                    <option value="">Todas as vagas</option>
                    {vagas.map(v=>(<option key={v} value={v}>{v}</option>))}
                  </select>
                  <select style={{...s.input,width:140,marginBottom:0}} value={filtroSt} onChange={e=>setFiltroSt(e.target.value)}>
                    <option value="">Todos os status</option>
                    {STATUS_C.map(sc=>(<option key={sc.k} value={sc.k}>{sc.l}</option>))}
                  </select>
                  <div style={{flex:1}}/>
                </div>
                <div style={{fontSize:12,color:C.muted,marginBottom:10}}>{filtrados.length} candidato{filtrados.length!==1?'s':''}</div>
                {loadingC?<div style={{textAlign:'center',padding:'32px',color:C.muted}}>Carregando...</div>
                :filtrados.length===0?(
                  <div style={{...s.card,textAlign:'center',padding:'48px 20px',color:C.muted}}>
                    <div style={{fontSize:32,marginBottom:8}}>📋</div>
                    <div style={{fontWeight:700,marginBottom:4}}>Nenhum candidato encontrado</div>
                    <div style={{fontSize:12}}>Ajuste os filtros ou aguarde novos candidatos.</div>
                  </div>
                ):(
                  <div style={s.card}>
                    <table style={{width:'100%',borderCollapse:'collapse'}}>
                      <thead><tr style={{background:'var(--c-subtle)'}}>
                        <th style={s.th}>Nome</th><th style={s.th}>WhatsApp</th>
                        <th style={s.th}>Vaga</th><th style={s.th}>Inscrição</th>
                        <th style={{...s.th,textAlign:'center'}}>Status</th>
                        <th style={{...s.th,textAlign:'right'}}></th>
                      </tr></thead>
                      <tbody>
                        {filtrados.map(c=>{
                          const cor=corC(c.status); const ab=expandido===c.id;
                          return (
                            React.createElement(React.Fragment,{key:c.id},
                              React.createElement('tr',{style:{borderTop:'1px solid '+C.border,cursor:'pointer'},onClick:()=>setExpandido(ab?null:c.id)},
                                React.createElement('td',{style:{...s.td,fontWeight:600}},c.nome),
                                React.createElement('td',{style:{...s.td,fontSize:12}},c.whatsapp||'—'),
                                React.createElement('td',{style:{...s.td,fontSize:12}},c.vaga||'—'),
                                React.createElement('td',{style:{...s.td,fontSize:12}},c.data_inscricao?new Date(c.data_inscricao+'T12:00:00').toLocaleDateString('pt-BR'):'—'),

      // MÓDULO ADIANTAMENTOS
