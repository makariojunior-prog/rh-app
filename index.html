<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useCallback, useEffect } = React;

    const DIAS_SF = ["SEG","TER","QUA","QUI","SEX"];
    const DIAS_SS = ["SEG","TER","QUA","QUI","SEX","SAB"];
    const DIA_LABEL = {SEG:"Seg",TER:"Ter",QUA:"Qua",QUI:"Qui",SEX:"Sex",SAB:"Sáb"};
    const DIA_LABEL_FULL = {SEG:"Segunda",TER:"Terça",QUA:"Quarta",QUI:"Quinta",SEX:"Sexta",SAB:"Sábado"};
    const WEEKDAY_MAP = {1:"SEG",2:"TER",3:"QUA",4:"QUI",5:"SEX",6:"SAB",0:"DOM"};

    function fmtBRL(v){ const n=Number(v); return isNaN(n)?'R$ 0,00':n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
    function fmtDate(str){ if(!str) return ""; const[y,m,d]=str.split("-"); return `${d}/${m}/${y}`; }

    // ---- Máscaras e validações ----
    function maskCPF(v){ return (v||'').replace(/\D/g,'').slice(0,11).replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2'); }
    function maskFone(v){ const d=(v||'').replace(/\D/g,'').slice(0,11); if(!d) return ''; if(d.length<=10) return d.replace(/(\d{2})(\d)/,'($1) $2').replace(/(\d{4})(\d)/,'$1-$2'); return d.replace(/(\d{2})(\d)/,'($1) $2').replace(/(\d{5})(\d)/,'$1-$2'); }
    function validateCPF(cpf){ const n=(cpf||'').replace(/\D/g,''); if(n.length!==11||/^(\d)\1{10}$/.test(n)) return false; let s=0,r; for(let i=0;i<9;i++) s+=+n[i]*(10-i); r=(s*10)%11; if(r>=10) r=0; if(r!==+n[9]) return false; s=0; for(let i=0;i<10;i++) s+=+n[i]*(11-i); r=(s*10)%11; if(r>=10) r=0; return r===+n[10]; }

    // ---- ConfirmModal global ----
    let _confirmResolve=null, _setConfirmState=null;
    function confirmar(msg, titulo){ return new Promise(res=>{ _confirmResolve=res; _setConfirmState?.({open:true,msg,titulo:titulo||'Confirmar'}); }); }

    // ---- Toast global ----
    let _addToast=null;
    function toast(msg,tipo='success'){ _addToast?.({id:Date.now()+Math.random(),msg,tipo}); }

    function parseDDMMYYYY(str){
      const[d,m,y]=str.split("/");
      return new Date(parseInt(y),parseInt(m)-1,parseInt(d));
    }
    function toISO(date){
      return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
    }
    function isPresente(bat1){
      if(!bat1||bat1.trim()===""||bat1.trim()==="00:00") return false;
      return true;
    }
    function parseCSV(text){
      const lines=text.trim().split(/\r?\n/);
      if(lines.length<2) throw new Error("Arquivo vazio ou inválido");
      const header=lines[0].split(";");
      if(!header[0].includes("Crach")) throw new Error("Formato não reconhecido. Verifique se é o arquivo do ponto.");
      const empMap={};
      const allDates=[];
      for(let i=1;i<lines.length;i++){
        const cols=lines[i].split(";");
        if(cols.length<8) continue;
        const cracha=cols[0].trim();
        const nome=cols[1].trim();
        const dataStr=cols[2].trim();
        const bat1=cols[7].trim();
        if(!cracha||!nome||!dataStr) continue;
        const dateObj=parseDDMMYYYY(dataStr);
        const weekday=dateObj.getDay();
        const diaKey=WEEKDAY_MAP[weekday];
        allDates.push(dateObj);
        if(!empMap[cracha]) empMap[cracha]={id:cracha,nome,presente:{},trabalhouSab:false};
        if(diaKey&&diaKey!=="DOM"){
          empMap[cracha].presente[diaKey]=isPresente(bat1);
          if(diaKey==="SAB"&&isPresente(bat1)) empMap[cracha].trabalhouSab=true;
        }
      }
      const employees=Object.values(empMap).map((e,i)=>({
        id:i+1, cracha:e.id, nome:e.nome,
        escala:e.trabalhouSab?"SEG-SAB":"SEG-SEX",
        presente:e.presente,
        afastado: false,
        valorPago: "",
      }));
      const sorted=allDates.sort((a,b)=>a-b);
      return { employees, semanaIni:toISO(sorted[0]), semanaFim:toISO(sorted[sorted.length-1]) };
    }

    // Parseia CSV do ponto retornando mapa detalhado por funcionário/dia
    function parsePontoDetalhado(text) {
      const lines = text.trim().split(/\r?\n/);
      if (lines.length < 2) throw new Error("Arquivo vazio ou inválido");
      const header = lines[0].split(";");
      if (!header[0].includes("Crach")) throw new Error("Formato não reconhecido.");
      const empMap = {};
      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(";").map(s => s.trim());
        if (cols.length < 11) continue;
        const cracha = cols[0], nome = cols[1], dataStr = cols[2];
        if (!cracha || !nome || !dataStr) continue;
        const dataParts = dataStr.split("/");
        if (dataParts.length < 3) continue;
        const [dd, mm, yyyy] = dataParts;
        if (!dd || !mm || !yyyy) continue;
        const iso = `${yyyy}-${mm.padStart(2,"0")}-${dd.padStart(2,"0")}`;
        const previsto = { e1: cols[3]||"", s1: cols[4]||"", e2: cols[5]||"", s2: cols[6]||"" };
        const real     = { b1: cols[7]||"", b2: cols[8]||"", b3: cols[9]||"", b4: cols[10]||"" };
        const horaExtra = cols[11] || "00:00";
        if (!empMap[nome]) empMap[nome] = { cracha, nome, dias: {} };
        empMap[nome].dias[iso] = { data: iso, previsto, real, horaExtra };
      }
      return empMap;
    }

    // Persiste registros de ponto no Supabase (upsert por id empresa+nome+data)
    async function upsertRegistrosPonto(empMap, empresaId) {
      const norm = n => String(n||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
      const records = [];
      Object.values(empMap).forEach(emp => {
        Object.entries(emp.dias).forEach(([iso, d]) => {
          records.push({
            id: `${empresaId}_${norm(emp.nome)}_${iso.replace(/-/g,'')}`,
            empresa_id: empresaId,
            colaborador_nome: emp.nome,
            cracha: emp.cracha || null,
            data: iso,
            previsto_e1: d.previsto.e1 || '',
            previsto_s1: d.previsto.s1 || '',
            previsto_e2: d.previsto.e2 || '',
            previsto_s2: d.previsto.s2 || '',
            real_b1: d.real.b1 || '',
            real_b2: d.real.b2 || '',
            real_b3: d.real.b3 || '',
            real_b4: d.real.b4 || '',
            hora_extra: d.horaExtra || '00:00',
            fonte: 'csv',
            atualizado_em: new Date().toISOString()
          });
        });
      });
      if (records.length === 0) return { count: 0 };
      const { error } = await _supa.from('registros_ponto').upsert(records, { onConflict: 'id' });
      if (error) throw error;
      return { count: records.length };
    }

    // INSS progressivo 2025
    function calcINSS(salario) {
      const s = Number(salario) || 0;
      if (s <= 0) return 0;
      const faixas = [
        { limite: 1518.00, aliq: 0.075 },
        { limite: 2793.00, aliq: 0.09  },
        { limite: 4189.50, aliq: 0.12  },
        { limite: 8157.41, aliq: 0.14  },
      ];
      let total = 0, base = 0;
      for (const f of faixas) {
        const topo = Math.min(s, f.limite);
        if (topo <= base) break;
        total += (topo - base) * f.aliq;
        base = f.limite;
        if (s <= f.limite) break;
      }
      return Math.round(total * 100) / 100;
    }
    function calcFGTS(salario) {
      return Math.round((Number(salario) || 0) * 0.08 * 100) / 100;
    }
    function calcPericulosidade(salario) {
      return Math.round((Number(salario) || 0) * 0.30 * 100) / 100;
    }

      // ============================================================
      // DASHBOARD
      // ============================================================
      function DashboardPage({ onNavegar, colabAPI, setColabAPI, empresaId }) {
        const hoje = new Date();
        hoje.setHours(12, 0, 0, 0);

        const [ausencias, setAusencias] = React.useState({atestados:[],ferias:[],retornandoHoje:[]});
        const [recrutInfo, setRecrutInfo] = React.useState({novos:0,entrevistas:[]});
        const [kpis, setKpis] = React.useState({adiantPendente:0, desligadosMes:0, contratosVencendo:0});

        React.useEffect(()=>{
          if(!empresaId) return;
          const today = new Date().toISOString().slice(0,10);
          const em3dias = new Date(Date.now()+3*86400000).toISOString().slice(0,10);
          Promise.all([
            _supa.from('atestados').select('colaborador_nome,setor,cid,inicio,fim').eq('empresa_id',empresaId).lte('inicio',em3dias).gte('fim',today),
            _supa.from('ferias').select('colaborador_nome,inicio,fim,status').eq('empresa_id',empresaId).lte('inicio',em3dias).gte('fim',today).in('status',['agendado','em_gozo'])
          ]).then(([atRes,fRes])=>{
            const getSetor = nome => (colabAPI.find(c=>c.nome===nome)||{}).setor||'Não informado';
            const atestados = (atRes.data||[]).map(a=>({
              nome:a.colaborador_nome, setor:a.setor||getSetor(a.colaborador_nome),
              cid:a.cid||'', inicio:a.inicio||'', fim:a.fim||'', tipo:'atestado'
            }));
            const ferias = (fRes.data||[]).map(f=>({
              nome:f.colaborador_nome, setor:getSetor(f.colaborador_nome),
              inicio:f.inicio||'', fim:f.fim||'', tipo:'ferias'
            }));
            const retornandoHoje = [
              ...atestados.filter(a=>a.fim===today),
              ...ferias.filter(f=>f.fim===today)
            ];
            const ativosHoje = [
              ...atestados.filter(a=>a.inicio<=today&&a.fim>=today),
              ...ferias.filter(f=>f.inicio<=today&&f.fim>=today)
            ];
            setAusencias({atestados:ativosHoje.filter(x=>x.tipo==='atestado'), ferias:ativosHoje.filter(x=>x.tipo==='ferias'), retornandoHoje});
          }).catch(()=>{});
        },[empresaId]);

        React.useEffect(()=>{
          if(!empresaId) return;
          const hoje = new Date().toISOString().slice(0,10);
          const em7dias = new Date(Date.now()+7*86400000).toISOString().slice(0,10);
          Promise.all([
            _supa.from('candidatos').select('*',{count:'exact',head:true}).eq('empresa_id',empresaId).eq('status','novo'),
            _supa.from('entrevistas').select('candidato_nome,vaga,data_entrevista,hora_entrevista').eq('empresa_id',empresaId).eq('status','agendada').gte('data_entrevista',hoje).lte('data_entrevista',em7dias).order('data_entrevista',{ascending:true})
          ]).then(([novRes,entRes])=>{
            setRecrutInfo({novos:novRes.count||0,entrevistas:entRes.data||[]});
          }).catch(()=>{});
        },[empresaId]);

        // KPIs adicionais
        React.useEffect(()=>{
          if(!empresaId) return;
          const mesAtualR = new Date().toISOString().slice(0,7);
          Promise.all([
            _supa.from('adiantamentos').select('id',{count:'exact',head:true}).eq('empresa_id',empresaId).eq('status','pendente').eq('mes_referencia',mesAtualR),
            _supa.from('colaboradores').select('id',{count:'exact',head:true}).eq('empresa_id',empresaId).eq('ativo',false).gte('atualizado_em',mesAtualR+'-01'),
          ]).then(([adRes,desRes])=>{
            setKpis(p=>({...p, adiantPendente:adRes.count||0, desligadosMes:desRes.count||0}));
          }).catch(()=>{});
        },[empresaId]);

        const lerStorage = () => ({
          marcacoes: (() => { try { return JSON.parse(localStorage.getItem("rh_folha_marc")  || "{}"); } catch(e) { return {}; } })(),
        });

        const [dados, setDados] = useState(lerStorage);
        const marcacoes = dados.marcacoes;

        const normNome = n => !n ? "" : String(n).normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/\s+/g," ").trim();
        const parseISODate = iso => { if (!iso) return null; const [y,m,d] = iso.split("-"); return new Date(+y, +m-1, +d, 12, 0, 0); };
        const diffDias = dt => dt ? Math.round((dt - hoje) / 86400000) : null;
        const MESES = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
        const MESES_FULL = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

        // ====== ANIVERSARIANTES ======
        // nascimento vem como DD/MM/AAAA do GAS (coluna N)
        const getNasc = c => (c.nascimento || "").trim();
        const temCampoNasc = colabAPI.some(c => getNasc(c));

        const aniversariantes = colabAPI.map(c => {
          const nasc = getNasc(c);
          if (!nasc) return null;
          let dia, mes;
          if (nasc.includes("/")) { const p = nasc.split("/"); dia = +p[0]; mes = +p[1]; }
          else if (nasc.includes("-")) { const p = nasc.split("-"); mes = +p[1]; dia = +p[2]; }
          else return null;
          if (!dia || !mes || mes > 12 || dia > 31) return null;
          let anivRef = new Date(hoje.getFullYear(), mes-1, dia, 12, 0, 0);
          let diff = diffDias(anivRef);
          if (diff < -1) { anivRef = new Date(hoje.getFullYear()+1, mes-1, dia, 12, 0, 0); diff = diffDias(anivRef); }
          return { nome: c.nome || c.NOME || "", funcao: c.funcao || "", dia, mes, diff };
        }).filter(Boolean).sort((a,b) => a.diff - b.diff);

        // Limites de semana: usa domingo como fim de semana
        const dow = hoje.getDay(); // 0=Dom, 1=Seg, ..., 6=Sáb
        const diasAteSunday = dow === 0 ? 0 : 7 - dow;       // dias até o domingo desta semana
        const fimProxSemana = diasAteSunday + 7;              // domingo da próxima semana
        const mesAtual = hoje.getMonth() + 1;
        const ultimoDiaMes = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0, 12, 0, 0);
        const diasAteFimMes = Math.round((ultimoDiaMes - hoje) / 86400000);

        const anivHoje       = aniversariantes.filter(a => a.diff === 0);
        const anivEstaSemana = aniversariantes.filter(a => a.diff > 0 && a.diff <= diasAteSunday);
        const anivProxSemana = aniversariantes.filter(a => a.diff > diasAteSunday && a.diff <= fimProxSemana);
        const anivDoMes      = aniversariantes.filter(a => a.mes === mesAtual && a.diff > fimProxSemana && a.diff <= diasAteFimMes);

        // ====== EXPERIÊNCIAS ======
        const experiencias = colabAPI.flatMap(c => {
          const nome = c.nome || c.NOME || "";
          const funcao = c.funcao || "";
          return [
            c.experiencia30 ? { nome, funcao, tipo:"30 dias", cor:C.green, iso: c.experiencia30, diff: diffDias(parseISODate(c.experiencia30)) } : null,
            c.experiencia90 ? { nome, funcao, tipo:"90 dias", cor:"#8b5cf6", iso: c.experiencia90, diff: diffDias(parseISODate(c.experiencia90)) } : null,
          ].filter(Boolean);
        }).filter(e => e.diff !== null && e.diff >= -3 && e.diff <= 30)
          .sort((a,b) => a.diff - b.diff);

        // ====== ATESTADOS ======
        const atestadosAtivos = (() => {
          const resultado = [];
          Object.entries(marcacoes).forEach(([nomeKey, dias]) => {
            const dAtestado = Object.entries(dias)
              .filter(([, st]) => st === "atestado")
              .map(([iso]) => iso)
              .sort();
            if (!dAtestado.length) return;

            const grupos = [];
            let g = [dAtestado[0]];
            for (let i = 1; i < dAtestado.length; i++) {
              const prev = parseISODate(dAtestado[i-1]);
              const curr = parseISODate(dAtestado[i]);
              Math.round((curr - prev) / 86400000) <= 3 ? g.push(dAtestado[i]) : (grupos.push(g), g = [dAtestado[i]]);
            }
            grupos.push(g);

            grupos.forEach(grupo => {
              const fim = grupo[grupo.length - 1];
              const inicio = grupo[0];
              const diffFim = diffDias(parseISODate(fim));
              if (diffFim < -14) return;

              const dtRetorno = parseISODate(fim);
              dtRetorno.setDate(dtRetorno.getDate() + 1);
              while (dtRetorno.getDay() === 0 || dtRetorno.getDay() === 6) dtRetorno.setDate(dtRetorno.getDate() + 1);

              const colab = colabAPI.find(c => normNome(c.nome || c.NOME || "") === nomeKey);
              resultado.push({
                nome: colab?.nome || colab?.NOME || nomeKey,
                funcao: colab?.funcao || "",
                inicio, fim,
                retornoISO: toISO(dtRetorno),
                diffRetorno: diffDias(dtRetorno),
                diffFim
              });
            });
          });
          return resultado.sort((a,b) => a.diffRetorno - b.diffRetorno);
        })();

        const semDados = colabAPI.length === 0;

        return (
          <div>
            <div style={{marginBottom:20}}>
              <div style={{fontSize:20,fontWeight:800,color:C.pri,marginBottom:4}}>🏠 Dashboard</div>
              <div style={{fontSize:13,color:C.muted,textTransform:"capitalize"}}>
                {hoje.toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long",year:"numeric"})}
              </div>
            </div>

            {/* ---- KPI CARDS ---- */}
            {colabAPI.length > 0 && (
              <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:20}}>
                {[
                  { icon:"👥", valor:colabAPI.length, label:"Colaboradores ativos", cor:C.pri, bg:"var(--c-cream)" },
                  { icon:"🏥", valor:(ausencias.atestados.length+ausencias.ferias.length), label:"Ausentes hoje", cor:ausencias.atestados.length+ausencias.ferias.length>0?C.danger:C.green, bg:ausencias.atestados.length+ausencias.ferias.length>0?"#FEF2F2":"#F0FDF4" },
                  { icon:"📋", valor:experiencias.filter(e=>e.diff>=0&&e.diff<=7).length, label:"Experiências vencendo", cor:experiencias.filter(e=>e.diff>=0&&e.diff<=7).length>0?C.amber:C.green, bg:experiencias.filter(e=>e.diff>=0&&e.diff<=7).length>0?C.amberBg:"#F0FDF4" },
                  { icon:"💵", valor:kpis.adiantPendente, label:"Adiant. pendentes", cor:kpis.adiantPendente>0?C.amber:C.green, bg:kpis.adiantPendente>0?C.amberBg:"#F0FDF4" },
                ].map((k,i)=>(
                  <div key={i} style={{background:k.bg,borderRadius:10,padding:"14px 16px",border:`1px solid ${C.border}`,display:"flex",alignItems:"center",gap:12}}>
                    <div style={{fontSize:24,lineHeight:1}}>{k.icon}</div>
                    <div>
                      <div style={{fontSize:22,fontWeight:900,color:k.cor,lineHeight:1}}>{k.valor}</div>
                      <div style={{fontSize:11,color:C.muted,marginTop:3,lineHeight:1.3}}>{k.label}</div>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {semDados && (
              <div style={{background:"#EFF6FF",border:"1px solid #BFDBFE",borderRadius:10,padding:"14px 18px",marginBottom:18,display:"flex",justifyContent:"space-between",alignItems:"center",gap:14,flexWrap:"wrap"}}>
                <div>
                  <div style={{fontWeight:700,color:"#1D4ED8",fontSize:13,marginBottom:2}}>📋 Nenhum colaborador carregado ainda</div>
                  <div style={{color:"#3B82F6",fontSize:12}}>Cadastre colaboradores no módulo Colaboradores para que eles apareçam aqui.</div>
                </div>
                {onNavegar && <button onClick={()=>onNavegar("colaboradores")} style={{...s.btn,fontSize:12,padding:"6px 14px",flexShrink:0}}>Ir para Colaboradores →</button>}
              </div>
            )}

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:18,marginBottom:18}}>

              {/* ---- AUSÊNCIAS ---- */}
              <div style={s.card}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                  <div style={s.cardTitle}>🚨 Ausências</div>
                  <span style={{fontSize:12,color:C.muted}}>
                    {ausencias.atestados.length} atestado{ausencias.atestados.length!==1?"s":""} · {ausencias.ferias.length} féria{ausencias.ferias.length!==1?"s":""}
                  </span>
                </div>
                {ausencias.retornandoHoje.length>0&&(
                  <div style={{marginBottom:14}}>
                    <div style={{fontSize:11,fontWeight:800,color:C.green,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:8}}>🔔 Retorno esperado HOJE — confirmar presença!</div>
                    {ausencias.retornandoHoje.map((a,i)=>(
                      <div key={i} style={{background:"#E8F5EE",border:`2px solid ${C.green}`,borderRadius:10,padding:"10px 14px",marginBottom:6,display:"flex",alignItems:"center",gap:12}}>
                        <div style={{flex:1}}>
                          <div style={{fontWeight:800,color:C.pri,fontSize:13}}>{a.nome}</div>
                          <div style={{fontSize:11,color:C.muted,marginTop:2}}>
                            {a.tipo==='atestado'?'🏥 Atestado':'🏖️ Férias'} encerrado em <strong>{new Date(a.fim+'T12:00:00').toLocaleDateString('pt-BR')}</strong>
                          </div>
                        </div>
                        <div style={{fontWeight:800,color:C.green,fontSize:12}}>Retorna hoje</div>
                      </div>
                    ))}
                  </div>
                )}
                {ausencias.atestados.length>0&&(
                  <div style={{marginBottom:14}}>
                    <div style={{fontSize:11,fontWeight:700,color:"#C2410C",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:8}}>🏥 Atestados em andamento</div>
                    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:8}}>
                      {ausencias.atestados.map((a,i)=>(
                        <div key={i} style={{background:"#FFF7ED",border:"1.5px solid #FED7AA",borderRadius:9,padding:"10px 13px"}}>
                          <div style={{fontWeight:700,color:C.pri,fontSize:13}}>{a.nome}</div>
                          {a.setor&&a.setor!=='Não informado'&&<div style={{fontSize:10,color:C.muted}}>{a.setor}</div>}
                          {a.cid&&<div style={{fontSize:11,color:"#C2410C",marginTop:4}}>CID: {a.cid}</div>}
                          <div style={{fontSize:11,color:C.muted,marginTop:4}}>
                            {a.inicio&&<span>de {new Date(a.inicio+'T12:00:00').toLocaleDateString('pt-BR')} </span>}
                            até <strong>{new Date(a.fim+'T12:00:00').toLocaleDateString('pt-BR')}</strong>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
                {ausencias.ferias.length>0&&(
                  <div style={{marginBottom:6}}>
                    <div style={{fontSize:11,fontWeight:700,color:"#1D4ED8",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:8}}>🏖️ Férias em andamento</div>
                    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:8}}>
                      {ausencias.ferias.map((f,i)=>(
                        <div key={i} style={{background:"#EFF6FF",border:"1.5px solid #BFDBFE",borderRadius:9,padding:"10px 13px"}}>
                          <div style={{fontWeight:700,color:C.pri,fontSize:13}}>{f.nome}</div>
                          {f.setor&&f.setor!=='Não informado'&&<div style={{fontSize:10,color:C.muted}}>{f.setor}</div>}
                          <div style={{fontSize:11,color:C.muted,marginTop:4}}>
                            {f.inicio&&<span>de {new Date(f.inicio+'T12:00:00').toLocaleDateString('pt-BR')} </span>}
                            até <strong>{new Date(f.fim+'T12:00:00').toLocaleDateString('pt-BR')}</strong>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
                {ausencias.atestados.length===0&&ausencias.ferias.length===0&&ausencias.retornandoHoje.length===0&&(
                  <div style={{color:C.muted,fontSize:13,textAlign:"center",padding:"18px 0"}}>Nenhuma ausência registrada hoje.</div>
                )}
              </div>

              {/* ---- RECRUTAMENTO ---- */}
              <div style={s.card}>

      // Página exibida quando o usuário entra via link de "recovery" (Supabase auth state PASSWORD_RECOVERY).

      function NovaSenhaPage({ onPronto }){
        const [novaSenha, setNovaSenha] = useState('');
        const [conf, setConf] = useState('');
        const [loading, setLoading] = useState(false);
        const [erro, setErro] = useState(null);
        const salvar = async () => {
          if(novaSenha.length < 6){ setErro('A senha deve ter no mínimo 6 caracteres.'); return; }
          if(novaSenha !== conf){ setErro('As duas senhas precisam ser iguais.'); return; }
          setLoading(true); setErro(null);
          const {error} = await _supa.auth.updateUser({password: novaSenha});
          if(error){ setErro('❌ '+error.message); setLoading(false); return; }
          await _supa.auth.signOut();
          setLoading(false);
          onPronto?.();
        };
        return (
          <div style={{minHeight:'100vh',background:C.bg,display:'flex',alignItems:'center',justifyContent:'center'}}>
            <div style={{background:C.card,borderRadius:16,padding:'40px 44px',width:420,boxShadow:'0 8px 32px rgba(0,0,0,0.12)',border:`1px solid ${C.border}`}}>

      // ---- ToastContainer ----
      function ToastContainer(){
        const [toasts,setToasts]=useState([]);
        useEffect(()=>{ _addToast=t=>setToasts(p=>[...p.slice(-4),t]); return ()=>{ _addToast=null; }; },[]);
        useEffect(()=>{
          if(!toasts.length) return;
          const timer=setTimeout(()=>setToasts(p=>p.slice(1)),3200);
          return ()=>clearTimeout(timer);
        },[toasts]);
        const cores={success:{bg:'#DCFCE7',border:'#86EFAC',c:'#166534'},error:{bg:'#FEE2E2',border:'#FCA5A5',c:'#991B1B'},info:{bg:'#EFF6FF',border:'#93C5FD',c:'#1D4ED8'}};
        return (
          <div style={{position:'fixed',bottom:24,right:24,zIndex:9500,display:'flex',flexDirection:'column',gap:8,maxWidth:360}}>
            {toasts.map(t=>{ const cor=cores[t.tipo]||cores.info; return (
              <div key={t.id} style={{background:cor.bg,border:`1px solid ${cor.border}`,borderRadius:10,padding:'11px 16px',boxShadow:'0 4px 16px rgba(0,0,0,0.12)',fontSize:13,fontWeight:600,color:cor.c,display:'flex',alignItems:'center',gap:10,animation:'fadeIn .2s'}}>
                <span>{t.tipo==='success'?'✅':t.tipo==='error'?'❌':'ℹ️'}</span>
                <span style={{flex:1}}>{t.msg}</span>
                <button onClick={()=>setToasts(p=>p.filter(x=>x.id!==t.id))} style={{background:'none',border:'none',cursor:'pointer',color:cor.c,fontSize:16,lineHeight:1,padding:0}}>✕</button>
              </div>
            ); })}
          </div>
        );
      }

      // ---- CampoForm com suporte a máscara e validação ----
      function CampoForm({label, campo, type, placeholder, form, setForm, mask, validate, hint}) {
        const raw = form[campo]!=null?form[campo]:'';
        const erro = validate && raw ? validate(raw) : null;
        return (
          <div style={{marginBottom:14}}>
            <label style={s.label}>{label}</label>
            <input type={type||"text"} placeholder={placeholder||""}
              style={{...s.input,borderColor:erro?C.danger:s.input.borderColor}}
              value={raw}
              onChange={e=>{
                const val = mask ? mask(e.target.value) : e.target.value;
                setForm(p=>({...p,[campo]:val}));
              }}
            />
            {erro && <div style={{fontSize:10,color:C.danger,marginTop:3,fontWeight:600}}>{erro}</div>}
            {hint && !erro && <div style={{fontSize:10,color:C.muted,marginTop:3}}>{hint}</div>}
          </div>
        );
      }

      function ColaboradoresPage({ empresaId, setColabAPI }) {
        const [lista, setLista] = useState([]);

        const [loadingHistorico, setLoadingHistorico] = useState(false);
        const [termosGlobais, setTermosGlobais] = useState([]);
        const [termosExtras, setTermosExtras] = useState({});
        const [loading, setLoading] = useState(true);
        const [status, setStatus] = useState(null);
        const [editando, setEditando] = useState(null);
        const [form, setForm] = useState({});
        const [busca, setBusca] = useState("");

        const FORM_VAZIO = {
          nome:"", funcao:"", setor:"", cpf:"", telefone:"", chavePix:"", email:"",
          nascimento:"", admissao:"", experiencia30:"", experiencia90:"", encerramento:"",
          bancoNome:"", bancoCodigo:"", bancoTipoConta:"", bancoAgencia:"", bancoConta:"",
          salario:"", transporte:"", periculosidade:false,
          jornada:"SEG-SAB",
          contaSalario:false, aditivoContrato:false, usoArmario:false,
          lgpd:false, imagem:false, camera:false, epiUniforme:false,
          acompanhamentoProducao:false, usoCelular:false, usoVeiculo:false,
          termoConfidencialidade:false, termoAssiduidade:false, termoMudancaHorario:false
        };

        const normNome = n => !n ? "" : String(n).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/\s+/g," ").trim();

        const mapearParaApp = c => ({
          nome:c.nome, setor:c.setor||'', funcao:c.funcao||'', cpf:c.cpf||'',
          telefone:c.telefone||'', chavePix:c.chave_pix||'', email:c.email||'',
          nascimento:c.nascimento||'', admissao:c.admissao||'',
          experiencia30:c.experiencia_30||'', experiencia90:c.experiencia_90||'', encerramento:c.data_encerramento||'',
          bancoNome:c.banco_nome||'', bancoCodigo:c.banco_codigo||'', bancoTipoConta:c.banco_tipo_conta||'',
          bancoAgencia:c.banco_agencia||'', bancoConta:c.banco_conta||'',
          salario:Number(c.salario)||0, inss:calcINSS(c.salario), fgts:calcFGTS(c.salario),
          transporte:Number(c.transporte)||0, periculosidade:!!c.periculosidade,
          jornada:c.jornada||'SEG-SAB',
          contaSalario:!!c.conta_salario, aditivoContrato:!!c.aditivo_contrato,
          usoArmario:!!c.uso_armario, lgpd:!!c.lgpd, imagem:!!c.imagem,
          camera:!!c.camera, epiUniforme:!!c.epi_uniforme,
          acompanhamentoProducao:!!c.acompanhamento_producao,
          usoCelular:!!c.uso_celular, usoVeiculo:!!c.uso_veiculo,
          termoConfidencialidade:!!c.termo_confidencialidade,
          termoAssiduidade:!!c.termo_assiduidade,
          termoMudancaHorario:!!c.termo_mudanca_horario, id_supa:c.id
        });

        const carregarHistorico = async (colab) => {
          setLoadingHistorico(true);
          try {
            const {data} = await _supa.from('atestados').select('*').eq('empresa_id',empresaId).ilike('colaborador_nome','%'+colab.nome+'%').order('inicio',{ascending:false});
            setHistoricoAtestados(data||[]);
          } catch(e) { setHistoricoAtestados([]); }
          try {
            const {data} = await _supa.from('ferias').select('*').eq('empresa_id',empresaId).ilike('colaborador_nome','%'+colab.nome+'%').order('inicio',{ascending:false});
            setHistoricoFerias(data||[]);
          } catch(e) { setHistoricoFerias([]); }
          try {
            const {data:dataSal} = await _supa.from('historico_salario').select('*').eq('empresa_id',empresaId).ilike('colaborador_nome','%'+colab.nome+'%').order('data_vigencia',{ascending:false});
            setHistoricoSalario(dataSal||[]);
          } catch(e) { setHistoricoSalario([]); }
          try {
            const {data:dataAdt} = await _supa.from('adiantamentos').select('*').eq('empresa_id',empresaId).ilike('colaborador_nome','%'+colab.nome+'%').order('data_concessao',{ascending:false});
            setHistoricoAdiantamentos(dataAdt||[]);
          } catch(e) { setHistoricoAdiantamentos([]); }
          try {
            const {data:dataAdtF} = await _supa.from('adiantamentos_fixos').select('*').eq('empresa_id',empresaId).ilike('colaborador_nome','%'+colab.nome+'%').order('created_at',{ascending:false});
            setHistoricoAdiantamentosFixos(dataAdtF||[]);
          } catch(e) { setHistoricoAdiantamentosFixos([]); }
          setLoadingHistorico(false);
        };

        const carregar = async () => {
          setLoading(true); setStatus(null);
          try {
            const {data,error} = await _supa.from('colaboradores').select('*').eq('empresa_id',empresaId).eq('ativo',true).order('nome');
            if(error) throw error;
            setLista(data||[]);
            const {data:dataD} = await _supa.from('colaboradores').select('*').eq('empresa_id',empresaId).eq('ativo',false).order('nome');
            setListaDesligados(dataD||[]);
            // Merge datas do cache local (nascimento etc. podem não estar no Supabase ainda)
            const nacCache = {};
            try { JSON.parse(localStorage.getItem("rh_colab_api")||"[]").forEach(c=>{ nacCache[normNome(c.nome)]={nascimento:c.nascimento||'',admissao:c.admissao||'',experiencia30:c.experiencia30||'',experiencia90:c.experiencia90||''}; }); } catch(e){}
            setColabAPI((data||[]).map(c=>{
              const mapped = mapearParaApp(c);
              const cache = nacCache[normNome(c.nome)]||{};
              if(!mapped.nascimento) mapped.nascimento = cache.nascimento||'';
              if(!mapped.admissao)   mapped.admissao   = cache.admissao||'';
              if(!mapped.experiencia30) mapped.experiencia30 = cache.experiencia30||'';
              if(!mapped.experiencia90) mapped.experiencia90 = cache.experiencia90||'';
              return mapped;
            }));
          } catch(e) {
            setStatus({ok:false, msg:'❌ Erro ao carregar: '+e.message});
          } finally {
            setLoading(false);
          }
        };

        useEffect(()=>{
          carregar();
          _supa.from('termos_assinatura').select('*').eq('empresa_id',empresaId).order('ordem')
            .then(({data})=>{ if(data) setTermosGlobais(data); })
            .catch(()=>{});
        },[empresaId]);

        const parseDateBR = s => {
          if(!s) return null;

        return (

            {status&&<div style={{padding:"10px 14px",borderRadius:6,marginBottom:14,background:status.ok===true?"#DCFCE7":status.ok===false?"#FEE2E2":"#FEF9C3",color:status.ok===true?"#166534":status.ok===false?"#991B1B":"#713F12",fontSize:13,whiteSpace:"pre-line"}}>{status.msg}</div>}
            <input style={{...s.input,marginBottom:16}} placeholder="Buscar por nome ou função..." value={busca} onChange={e=>setBusca(e.target.value)}/>
            {loading?(
              <div style={{textAlign:"center",padding:40,color:C.muted}}>Carregando...</div>
            ):(
              <div style={s.card}>
                {filtrados.length===0?(

                    {busca ? "Nenhum resultado encontrado." : (
                      <div>
                        <div style={{fontSize:32,marginBottom:12}}>📋</div>
                        <div style={{fontWeight:700,fontSize:15,color:C.pri,marginBottom:8}}>Banco de dados vazio</div>

                ):(

                            {(function(){var h=new Date().toISOString().slice(0,10);return c.experiencia_90&&c.experiencia_90>=h?React.createElement('span',{style:{marginLeft:8,fontSize:10,background:"#EDE9FE",color:"#6D28D9",padding:"2px 7px",borderRadius:10,fontWeight:700,verticalAlign:"middle"}},"experiência"):null;})()}

            <div style={{fontSize:12,color:C.muted,marginTop:4}}>

      // ============================================================
      // MÓDULO ACESSOS (admin only)
      // ============================================================
      function AcessosPage({ perfil: adminPerfil, empresaId }) {
        const TODAS_PAGINAS = [
          {k:'dashboard',    l:'🏠 Início'},
          {k:'colaboradores',l:'👥 Colaboradores'},
          {k:'vt',           l:'🚌 Vale Transporte'},
          {k:'folha',        l:'💼 Folha de Pagamento'},
          {k:'ponto',        l:'📋 Banco de Ponto'},
          {k:'ferias',       l:'🏖️ Férias'},
          {k:'atestados',    l:'🏥 Atestados'},
          {k:'adiantamentos',l:'💵 Antecipações'},
          {k:'compras',      l:'🛍️ Compras'},
          {k:'recrutamento', l:'🧑‍💼 Recrutamento'},
          {k:'orcamento',    l:'📊 Orçamento Folha'},
          {k:'termos',       l:'📝 Termos de Assinatura'},
        ];

        const [lista, setLista] = useState([]);
        const [loading, setLoading] = useState(true);
        const [status, setStatus] = useState(null);
        const [criando, setCriando] = useState(false);
        const [editando, setEditando] = useState(null);
        const [form, setForm] = useState({});

        const FORM_VAZIO = {nome:'',email:'',senha:'',role:'usuario',paginas:['dashboard']};

        const carregar = async () => {
          setLoading(true);
          try {
            const {data,error} = await _supa.from('perfis').select('*').eq('empresa_id',empresaId).order('nome');
            if(error) throw error;
            setLista(data||[]);
          } catch(e) {
            setStatus({ok:false,msg:'❌ Erro: '+e.message});
          } finally {
            setLoading(false);
          }
        };

        useEffect(()=>{ carregar(); },[]);

        const togglePagina = (k) => {
          setForm(p=>({...p,paginas: p.paginas.includes(k) ? p.paginas.filter(x=>x!==k) : [...p.paginas,k]}));
        };

        const criarAcesso = async () => {
          if(!form.nome.trim()||!form.email.trim()||!form.senha.trim()){
            setStatus({ok:false,msg:'Preencha nome, email e senha.'}); return;
          }
          if(form.senha.length < 6){
            setStatus({ok:false,msg:'A senha deve ter pelo menos 6 caracteres.'}); return;
          }
          setLoading(true); setStatus(null);
          try {
            // Cliente isolado: não afeta a sessão do admin
            const tmpCliente = supabase.createClient(SUPA_URL, SUPA_KEY, {
              auth: {
                persistSession: false, autoRefreshToken: false, detectSessionInUrl: false,
                storage: { getItem:()=>null, setItem:()=>{}, removeItem:()=>{} }
              }
            });
            const emailLimpo = form.email.trim().toLowerCase();
            const pagsFinal = form.role==='admin' ? TODAS_PAGINAS.map(p=>p.k) : form.paginas;
            let userId = null;
            const {data, error: signUpErr} = await tmpCliente.auth.signUp({
              email: emailLimpo, password: form.senha
            });
            if(signUpErr){
              // Caso típico: usuário já existe no Auth (ex: foi removido apenas da tabela perfis).
              // Tentamos autenticar com a senha informada para recuperar o id e recriar o perfil.
              const {data:loginData, error:loginErr} = await tmpCliente.auth.signInWithPassword({
                email: emailLimpo, password: form.senha
              });
              if(loginErr || !loginData?.user){
                throw new Error(
                  'Este email já existe no sistema de autenticação, mas a senha informada não confere. '+
                  'Use a senha original do usuário OU peça para ele clicar em "Esqueci minha senha" na tela de login e tente novamente com a nova senha.'
                );
              }
              userId = loginData.user.id;
              await tmpCliente.auth.signOut();
            } else if(data?.user){
              userId = data.user.id;
            } else {
              // signUp sem erro mas sem user: significa email já registrado (Supabase devolve user:null por segurança).
              // Tenta autenticar com a senha enviada para reaproveitar conta órfã.
              const {data:loginData, error:loginErr} = await tmpCliente.auth.signInWithPassword({
                email: emailLimpo, password: form.senha
              });
              if(loginErr || !loginData?.user){
                throw new Error(
                  'Este email já existe no sistema de autenticação, mas não foi possível validar com a senha informada. '+
                  'Use a senha real do usuário, ou peça que ele use "Esqueci minha senha" na tela de login.'
                );
              }
              userId = loginData.user.id;
              await tmpCliente.auth.signOut();
            }
            if(!userId) throw new Error('Não foi possível obter o ID do usuário.');
            // upsert no perfil (cria se não existir; se existir, atualiza dados)
            const {error: perfilErr} = await _supa.from('perfis').upsert({
              id: userId, nome: form.nome.trim(), email: emailLimpo,
              empresa_id: empresaId, role: form.role, paginas: pagsFinal
            }, {onConflict:'id'});
            if(perfilErr) throw new Error('Conta validada, mas erro ao salvar permissões: ' + perfilErr.message);
            setStatus({ok:true, msg:`✅ Acesso criado/vinculado!\n📧 Email: ${emailLimpo}\n🔑 Senha: ${form.senha}`});
            setCriando(false); setForm(FORM_VAZIO); carregar();
          } catch(e) {
            setStatus({ok:false, msg:'❌ ' + e.message});
          }
          setLoading(false);
        };

        // Envia link de redefinição de senha por email. Funciona com chave anon.
        const resetarSenha = async (p) => {
          if(!await confirmar(`Enviar link de redefinição de senha para ${p.email}?\n\nO usuário receberá um email para criar uma nova senha.`,'Resetar senha')) return;
          setLoading(true); setStatus(null);
          try {
            const {error} = await _supa.auth.resetPasswordForEmail(p.email, {
              redirectTo: window.location.origin + window.location.pathname
            });
            if(error) throw error;
            setStatus({ok:true, msg:`✅ Link de redefinição enviado para ${p.email}.`});
          } catch(e) {
            setStatus({ok:false, msg:'❌ '+e.message});
          }
          setLoading(false);
        };

        // Permite ao próprio usuário logado trocar a sua senha (Supabase exige usuário autenticado).
        const alterarSenhaPropria = async () => {
          if(!editando) return;
          if(editando.id !== adminPerfil?.id){
            setStatus({ok:false,msg:'⚠️ Você só pode trocar a sua própria senha. Para resetar a senha de outro usuário, use o botão "Resetar senha" na listagem.'});
            return;
          }
          const novaSenha = (editando.novaSenha||'').trim();
          if(novaSenha.length < 6){
            setStatus({ok:false,msg:'A nova senha deve ter pelo menos 6 caracteres.'});
            return;
          }
          if(!await confirmar('Confirmar alteração da sua senha? Você precisará fazer login novamente.','Alterar Senha')) return;
          setLoading(true); setStatus(null);
          try {
            const {error} = await _supa.auth.updateUser({password: novaSenha});
            if(error) throw error;
            setStatus({ok:true,msg:'✅ Sua senha foi alterada. Faça login novamente.'});
            setEditando(p=>({...p,novaSenha:''}));
          } catch(e) {
            setStatus({ok:false,msg:'❌ '+e.message});
          }
          setLoading(false);
        };

        const salvarEdicao = async () => {
          setLoading(true); setStatus(null);
          try {
            const pagsFinal = editando.role==='admin' ? TODAS_PAGINAS.map(p=>p.k) : editando.paginas;
            const {error} = await _supa.from('perfis').update({
              nome:editando.nome, role:editando.role, paginas:pagsFinal
            }).eq('id',editando.id);
            if(error) throw error;
            setStatus({ok:true,msg:'✅ Permissões atualizadas.'});
            setEditando(null); carregar();
          } catch(e) {
            setStatus({ok:false,msg:'❌ Erro: '+e.message});
          }
          setLoading(false);
        };

        const removerAcesso = async (p) => {
          if(!await confirmar(`Remover acesso de "${p.nome}"? Esta ação não pode ser desfeita.`,'Remover Acesso')) return;
          setLoading(true);
          const {error} = await _supa.from('perfis').delete().eq('id',p.id);
          if(!error){ setStatus({ok:true,msg:`✅ Acesso de ${p.nome} removido.`}); carregar(); }
          else setStatus({ok:false,msg:'❌ Erro: '+error.message});
          setLoading(false);
        };

        const CheckPaginas = ({paginas, onChange}) => (
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6,marginTop:6}}>
            {TODAS_PAGINAS.map(p=>(
              <label key={p.k} style={{display:'flex',alignItems:'center',gap:7,fontSize:13,cursor:'pointer',padding:'5px 8px',borderRadius:6,background:paginas.includes(p.k)?'var(--c-cream)':'transparent'}}>
                <input type="checkbox" checked={paginas.includes(p.k)} onChange={()=>onChange(p.k)} style={{cursor:'pointer'}}/>

        if(editando) return (
          <div>
            <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:20}}>
              <button onClick={()=>setEditando(null)} style={s.btnOutline}>← Voltar</button>
              <div style={{fontSize:18,fontWeight:800,color:C.pri}}>✏️ Editar Acesso: {editando.nome}</div>
            </div>
            {status&&<div style={{padding:'10px 14px',borderRadius:6,marginBottom:14,background:status.ok?'#DCFCE7':'#FEE2E2',color:status.ok?'#166534':'#991B1B',fontSize:13}}>{status.msg}</div>}
            <div style={s.card}>
              <div style={{marginBottom:14}}>
                <label style={s.label}>Nome</label>
                <input style={s.input} value={editando.nome} onChange={e=>setEditando(p=>({...p,nome:e.target.value}))}/>

              <div style={{marginBottom:16}}>
                <label style={s.label}>Perfil de acesso</label>
                <div style={{display:'flex',gap:10,marginTop:6}}>
                  {['admin','usuario'].map(r=>(
                    <label key={r} style={{display:'flex',alignItems:'center',gap:6,fontSize:13,cursor:'pointer',padding:'7px 14px',borderRadius:7,border:`1.5px solid ${editando.role===r?C.pri:C.border}`,background:editando.role===r?'var(--c-cream)':'transparent',fontWeight:editando.role===r?700:400}}>
                      <input type="radio" name="role_edit" checked={editando.role===r} onChange={()=>setEditando(p=>({...p,role:r}))} style={{cursor:'pointer'}}/>
                      {r==='admin'?'👑 Administrador':'👤 Usuário'}
