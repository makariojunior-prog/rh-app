    const { useState, useCallback, useEffect } = React;

    const DIAS_SF = ["SEG","TER","QUA","QUI","SEX"];
    const DIAS_SS = ["SEG","TER","QUA","QUI","SEX","SAB"];
    const DIA_LABEL = {SEG:"Seg",TER:"Ter",QUA:"Qua",QUI:"Qui",SEX:"Sex",SAB:"Sáb"};
    const DIA_LABEL_FULL = {SEG:"Segunda",TER:"Terça",QUA:"Quarta",QUI:"Quinta",SEX:"Sexta",SAB:"Sábado"};
    const WEEKDAY_MAP = {1:"SEG",2:"TER",3:"QUA",4:"QUI",5:"SEX",6:"SAB",0:"DOM"};

    function fmtBRL(v){ return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
    function fmtDate(str){ if(!str) return ""; const[y,m,d]=str.split("-"); return `${d}/${m}/${y}`; }

    function parseDDMMYYYY(str){
      const[d,m,y]=str.split("/");
      return new Date(parseInt(y),parseInt(m)-1,parseInt(d));
    }
    function toISO(date){
      return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
    }
    function isPresente(bat1){
      if(!bat1||bat1.trim()===""||bat1.trim()==="00:00") return false;
      return true;
    }
    function parseCSV(text){
      const lines=text.trim().split(/\r?\n/);
      if(lines.length<2) throw new Error("Arquivo vazio ou inválido");
      const header=lines[0].split(";");
      if(!header[0].includes("Crach")) throw new Error("Formato não reconhecido. Verifique se é o arquivo do ponto.");
      const empMap={};
      const allDates=[];
      for(let i=1;i<lines.length;i++){
        const cols=lines[i].split(";");
        if(cols.length<8) continue;
        const cracha=cols[0].trim();
        const nome=cols[1].trim();
        const dataStr=cols[2].trim();
        const bat1=cols[7].trim();
        if(!cracha||!nome||!dataStr) continue;
        const dateObj=parseDDMMYYYY(dataStr);
        const weekday=dateObj.getDay();
        const diaKey=WEEKDAY_MAP[weekday];
        allDates.push(dateObj);
        if(!empMap[cracha]) empMap[cracha]={id:cracha,nome,presente:{},trabalhouSab:false};
        if(diaKey&&diaKey!=="DOM"){
          empMap[cracha].presente[diaKey]=isPresente(bat1);
          if(diaKey==="SAB"&&isPresente(bat1)) empMap[cracha].trabalhouSab=true;
        }
      }
      const employees=Object.values(empMap).map((e,i)=>({
        id:i+1, cracha:e.id, nome:e.nome,
        escala:e.trabalhouSab?"SEG-SAB":"SEG-SEX",
        presente:e.presente,
        afastado: false,
        valorPago: "",
      }));
      const sorted=allDates.sort((a,b)=>a-b);
      return { employees, semanaIni:toISO(sorted[0]), semanaFim:toISO(sorted[sorted.length-1]) };
    }

    // INSS progressivo 2025
    function calcINSS(salario) {
      const s = Number(salario) || 0;
      if (s <= 0) return 0;
      const faixas = [
        { limite: 1518.00, aliq: 0.075 },
        { limite: 2793.00, aliq: 0.09  },
        { limite: 4189.50, aliq: 0.12  },
        { limite: 8157.41, aliq: 0.14  },
      ];
      let total = 0, base = 0;
      for (const f of faixas) {
        const topo = Math.min(s, f.limite);
        if (topo <= base) break;
        total += (topo - base) * f.aliq;
        base = f.limite;
        if (s <= f.limite) break;
      }
      return Math.round(total * 100) / 100;
    }
    function calcFGTS(salario) {
      return Math.round((Number(salario) || 0) * 0.08 * 100) / 100;
    }
    function calcPericulosidade(salario) {
      return Math.round((Number(salario) || 0) * 0.30 * 100) / 100;
    }

    const GAS_SCRIPT = `// ============================================================
// RegistroVT.gs v3 — Web App do RH

var SPREADSHEET_ID = '1I_dQgjotKP4s-y_8z9gPAT8gTZlwEcNLBBv23dsSBDU';

function _resp(obj) {
  return ContentService
    .createTextOutput(JSON.stringify(obj))
    .setMimeType(ContentService.MimeType.JSON);
}

function _fmtDate(d) {
  if (!d) return '';
  if (d instanceof Date) return Utilities.formatDate(d, 'America/Sao_Paulo', 'yyyy-MM-dd');
  return String(d);
}

function _isoToDate(iso) {
  if (!iso) return null;
  var parts = String(iso).split('-');
  if (parts.length !== 3) return null;
  return new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
}

// ---------------------------------------------------------------
// GET
// ---------------------------------------------------------------
function doGet(e) {
  try {
    var acao = (e && e.parameter && e.parameter.acao) || 'folha_dados';
    var ss = SpreadsheetApp.openById(SPREADSHEET_ID);

    if (acao === 'colaboradores' || acao === 'folha_dados') {
      var resp = { ok: true };
      resp.colaboradores = _lerColaboradores(ss);

      if (acao === 'folha_dados') {
        var ini = e.parameter.ini || '';
        var fim = e.parameter.fim || '';
        resp.atestados = _lerAtestados(ss, ini, fim);
      }
      return _resp(resp);
    }

    if (acao === 'atestados') {
      var ini = e.parameter.ini || '';
      var fim = e.parameter.fim || '';
      return _resp({ ok: true, atestados: _lerAtestados(ss, ini, fim) });
    }

    return _resp({ ok: false, msg: 'Ação desconhecida: ' + acao });
  } catch (err) {
    return _resp({ ok: false, msg: err.message });
  }
}

// ---------------------------------------------------------------
// Leitura de COLABORADORES
// ---------------------------------------------------------------
function _bool(v) {
  if (typeof v === 'boolean') return v;
  var s = String(v).trim().toUpperCase();
  return s === 'SIM' || s === 'TRUE' || s === '1' || s === 'X' || s === 'YES';
}

function _lerColaboradores(ss) {
  var aba = ss.getSheetByName('COLABORADORES');
  if (!aba) throw new Error('Aba COLABORADORES não encontrada');
  var ultimaLinha = aba.getLastRow();
  if (ultimaLinha < 2) return [];

  var dados = aba.getRange(2, 1, ultimaLinha - 1, 37).getValues();
  var lista = [];
  for (var i = 0; i < dados.length; i++) {
    var linha = dados[i];
    var nome = linha[1];         // col B - NOME
    var encerramento = linha[6]; // col G - ENCERRAMENTO
    if (!nome || String(nome).trim() === '') continue;
    if (encerramento && String(encerramento).trim() !== '') continue; // pula desligados

    lista.push({
      nome:                   String(nome).trim(),
      telefone:               linha[2]  ? String(linha[2]).trim()  : '',  // C
      chavePix:               linha[3]  ? String(linha[3]).trim()  : '',  // D
      email:                  linha[4]  ? String(linha[4]).trim()  : '',  // E
      admissao:               _fmtDate(linha[5]),                         // F
      experiencia30:          _fmtDate(linha[7]),                         // H
      experiencia90:          _fmtDate(linha[8]),                         // I
      setor:                  linha[9]  ? String(linha[9]).trim()  : '',  // J
      funcao:                 linha[10] ? String(linha[10]).trim() : '',  // K
      cpf:                    linha[12] ? String(linha[12]).trim() : '',  // M
      nascimento:             _fmtDate(linha[13]),                        // N
      salario:                linha[14] || 0,                             // O
      transporte:             linha[18] || 0,                             // S
      contaSalario:           _bool(linha[24]),                          // Y
      aditivoContrato:        _bool(linha[25]),                          // Z
      usoArmario:             _bool(linha[26]),                          // AA
      lgpd:                   _bool(linha[27]),                          // AB
      imagem:                 _bool(linha[28]),                          // AC
      camera:                 _bool(linha[29]),                          // AD
      epiUniforme:            _bool(linha[30]),                          // AE
      acompanhamentoProducao: _bool(linha[31]),                          // AF
      usoCelular:             _bool(linha[32]),                          // AG
      usoVeiculo:             _bool(linha[33]),                          // AH
      termoConfidencialidade: _bool(linha[34]),                          // AI
      termoAssiduidade:       _bool(linha[35]),                          // AJ
      termoMudancaHorario:    _bool(linha[36])                           // AK
    });
  }
  return lista;
}

// ---------------------------------------------------------------
// Leitura de ATESTADOS no período
// ---------------------------------------------------------------
function _lerAtestados(ss, isoIni, isoFim) {
  var aba = ss.getSheetByName('ATESTADOS');
  if (!aba) return [];
  var ultimaLinha = aba.getLastRow();
  if (ultimaLinha < 2) return [];

  var dataIni = _isoToDate(isoIni);
  var dataFim = _isoToDate(isoFim);

  var dados = aba.getRange(2, 1, ultimaLinha - 1, 6).getValues();
  var lista = [];
  for (var i = 0; i < dados.length; i++) {
    var linha = dados[i];
    var nome   = linha[0]; // A - NOME
    var setor  = linha[1]; // B - SETOR
    var cid    = linha[2]; // C - CID
    var inicio = linha[3]; // D - INÍCIO
    var fim    = linha[4]; // E - FIM
    var obs    = linha[5]; // F - OBSERVAÇÕES
    if (!nome || !inicio) continue;

    var dIni = inicio instanceof Date ? inicio : null;
    var dFim = fim    instanceof Date ? fim    : dIni;
    if (!dIni) continue;

    if (dataIni && dataFim) {
      if (dFim < dataIni || dIni > dataFim) continue;
    }

    lista.push({
      nome:   String(nome).trim(),
      setor:  setor ? String(setor).trim() : '',
      cid:    cid   ? String(cid).trim()   : '',
      inicio: _fmtDate(dIni),
      fim:    _fmtDate(dFim),
      obs:    obs   ? String(obs).trim()   : ''
    });
  }
  return lista;
}

// ---------------------------------------------------------------
// POST
// ---------------------------------------------------------------
function doPost(e) {
  try {
    var dados = JSON.parse(e.postData.contents);
    var tipo  = dados.tipo || 'vt';
    var ss    = SpreadsheetApp.openById(SPREADSHEET_ID);
    var agora = Utilities.formatDate(new Date(), 'America/Sao_Paulo', 'dd/MM/yyyy HH:mm');

    if (tipo === 'vt') {
      var aba = ss.getSheetByName('VT');
      if (!aba) return _resp({ok:false, msg:'Aba VT não encontrada'});
      if (aba.getLastRow() === 0) {
        aba.appendRow(['Semana Início','Semana Fim','Colaborador','Escala','Dias Trabalhados','Passagens','Valor Calculado','Valor Pago','Afastado','Registrado em']);
      }
      dados.employees.forEach(function(emp) {
        aba.appendRow([
          dados.semanaIni, dados.semanaFim,
          emp.nome, emp.escala,
          emp.diasTrabalhados, emp.diasTrabalhados * 2,
          emp.valorCalculado, emp.valorPago,
          emp.afastado ? 'Sim' : 'Não', agora
        ]);
      });
      return _resp({ok:true, msg:'VT salvo com ' + dados.employees.length + ' registros'});
    }

    if (tipo === 'folha') {
      var ano    = dados.periodo ? dados.periodo.substring(3) : new Date().getFullYear();
      var nomeAba = 'FOLHA' + ano;
      var aba = ss.getSheetByName(nomeAba);
      if (!aba) aba = ss.insertSheet(nomeAba);
      if (aba.getLastRow() === 0) {
        aba.appendRow([
          'Período','Colaborador','Função','Dias Trabalhados','Faltas Injust.','Atestados','Férias','Folgas',
          'Horas Extras','Horas Faltas','DSR Perdidos','Feriados Perdidos','Caju (dias)','Caju (R$)',
          'Prêmio Assiduidade','Descontar VT','Produtos (R$)','Adiantamento (R$)','Total Desconto (R$)',
          'Banco Horas','Dias Faltas','Observações','Registrado em'
        ]);
      }
      dados.colaboradores.forEach(function(c) {
        aba.appendRow([
          dados.periodo, c.nome, c.funcao || '',
          c.diasTrabalhados, c.faltas, c.atestados, c.ferias, c.folgas,
          c.horasExtras, c.horasFaltas, c.dsrPerdidos, c.feriadosPerdidos,
          c.cajuDias, c.cajuValor,
          c.premioAssiduidade ? 'Sim' : 'Não',
          c.descontarVT       ? 'Sim' : 'Não',
          c.produtos || 0, c.adiantamento || 0, c.totalDesconto,
          c.bancoHoras ? 'Sim' : 'Não',
          (c.diasFaltas || []).join(', '),
          c.observacoes || '', agora
        ]);
      });
      return _resp({ok:true, msg:'Folha ' + dados.periodo + ' salva com ' + dados.colaboradores.length + ' registros'});
    }

    return _resp({ok:false, msg:'Tipo desconhecido: ' + tipo});
  } catch (err) {
    return _resp({ok:false, msg:err.message});
  }
}`;

      function DashboardPage({ onNavegar, gasUrl, colabAPI, setColabAPI, empresaId }) {
        const hoje = new Date();
        hoje.setHours(12, 0, 0, 0);

        const [ausencias, setAusencias] = React.useState({atestados:[],ferias:[]});

        React.useEffect(()=>{
          if(!empresaId) return;
          const today = new Date().toISOString().slice(0,10);
          Promise.all([
            _supa.from('atestados').select('colaborador_nome,setor,cid,fim').eq('empresa_id',empresaId).lte('inicio',today).gte('fim',today),
            _supa.from('ferias').select('colaborador_nome,inicio,fim,status').eq('empresa_id',empresaId).lte('inicio',today).gte('fim',today).in('status',['agendado','em_gozo'])
          ]).then(([atRes,fRes])=>{
            const atestados = (atRes.data||[]).map(a=>({
              nome:a.colaborador_nome,
              setor:a.setor||(colabAPI.find(c=>c.nome===a.colaborador_nome)||{}).setor||'Não informado',
              cid:a.cid||'',
              fim:a.fim||''
            }));
            const ferias = (fRes.data||[]).map(f=>({
              nome:f.colaborador_nome,
              setor:(colabAPI.find(c=>c.nome===f.colaborador_nome)||{}).setor||'Não informado',
              fim:f.fim||''
            }));
            setAusencias({atestados,ferias});
          });
        },[empresaId]);

        const lerStorage = () => ({
          marcacoes: (() => { try { return JSON.parse(localStorage.getItem("rh_folha_marc")  || "{}"); } catch(e) { return {}; } })(),
        });

        const [dados, setDados] = useState(lerStorage);
        const [loadingColab, setLoadingColab] = useState(false);
        const [buscaStatus, setBuscaStatus] = useState(null);
        const marcacoes = dados.marcacoes;

        const atualizar = async () => {
          const url = gasUrl || localStorage.getItem("rh_gas_url") || "";
          if (!url) {
            setDados(lerStorage());
            setBuscaStatus({ok:false, msg:"URL do Web App não configurada. Acesse ⚙️ Configurações para configurar a URL do Web App."});
            return;
          }
          setLoadingColab(true);
          setBuscaStatus(null);
          try {
            const res = await fetch(`${url}?acao=colaboradores`);
            const json = await res.json();
            if (json.ok) {
              localStorage.setItem("rh_colab_api", JSON.stringify(json.colaboradores || []));
              setColabAPI(json.colaboradores || []);
              setBuscaStatus({ok:true, msg:`✅ ${json.colaboradores?.length || 0} colaboradores atualizados.`});
            } else {
              setBuscaStatus({ok:false, msg:"Erro: " + (json.msg || "desconhecido")});
            }
          } catch(err) {
            setBuscaStatus({ok:false, msg:"⚠️ Não foi possível acessar o Web App. Erro: " + err.message});
          } finally {
            setDados(lerStorage());
            setLoadingColab(false);
          }
        };

        const normNome = n => !n ? "" : String(n).normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/\s+/g," ").trim();
        const parseISODate = iso => { if (!iso) return null; const [y,m,d] = iso.split("-"); return new Date(+y, +m-1, +d, 12, 0, 0); };
        const diffDias = dt => dt ? Math.round((dt - hoje) / 86400000) : null;
        const MESES = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
        const MESES_FULL = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

        // ====== ANIVERSARIANTES ======
        // nascimento vem como DD/MM/AAAA do GAS (coluna N)
        const getNasc = c => (c.nascimento || "").trim();
        const temCampoNasc = colabAPI.some(c => getNasc(c));

        const aniversariantes = colabAPI.map(c => {
          const nasc = getNasc(c);
          if (!nasc) return null;
          let dia, mes;
          if (nasc.includes("/")) { const p = nasc.split("/"); dia = +p[0]; mes = +p[1]; }
          else if (nasc.includes("-")) { const p = nasc.split("-"); mes = +p[1]; dia = +p[2]; }
          else return null;
          if (!dia || !mes || mes > 12 || dia > 31) return null;
          let anivRef = new Date(hoje.getFullYear(), mes-1, dia, 12, 0, 0);
          let diff = diffDias(anivRef);
          if (diff < -1) { anivRef = new Date(hoje.getFullYear()+1, mes-1, dia, 12, 0, 0); diff = diffDias(anivRef); }
          return { nome: c.nome || c.NOME || "", funcao: c.funcao || "", dia, mes, diff };
        }).filter(Boolean).sort((a,b) => a.diff - b.diff);

        // Limites de semana: usa domingo como fim de semana
        const dow = hoje.getDay(); // 0=Dom, 1=Seg, ..., 6=Sáb
        const diasAteSunday = dow === 0 ? 0 : 7 - dow;       // dias até o domingo desta semana
        const fimProxSemana = diasAteSunday + 7;              // domingo da próxima semana
        const mesAtual = hoje.getMonth() + 1;
        const ultimoDiaMes = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0, 12, 0, 0);
        const diasAteFimMes = Math.round((ultimoDiaMes - hoje) / 86400000);

        const anivHoje       = aniversariantes.filter(a => a.diff === 0);
        const anivEstaSemana = aniversariantes.filter(a => a.diff > 0 && a.diff <= diasAteSunday);
        const anivProxSemana = aniversariantes.filter(a => a.diff > diasAteSunday && a.diff <= fimProxSemana);
        const anivDoMes      = aniversariantes.filter(a => a.mes === mesAtual && a.diff > fimProxSemana && a.diff <= diasAteFimMes);

        // ====== EXPERIÊNCIAS ======
        const experiencias = colabAPI.flatMap(c => {
          const nome = c.nome || c.NOME || "";
          const funcao = c.funcao || "";
          return [
            c.experiencia30 ? { nome, funcao, tipo:"30 dias", cor:C.green, iso: c.experiencia30, diff: diffDias(parseISODate(c.experiencia30)) } : null,

          ].filter(Boolean);
        }).filter(e => e.diff !== null && e.diff >= -3 && e.diff <= 30)
          .sort((a,b) => a.diff - b.diff);

        // ====== ATESTADOS ======
        const atestadosAtivos = (() => {
          const resultado = [];
          Object.entries(marcacoes).forEach(([nomeKey, dias]) => {
            const dAtestado = Object.entries(dias)
              .filter(([, st]) => st === "atestado")
              .map(([iso]) => iso)
              .sort();
            if (!dAtestado.length) return;

            const grupos = [];
            let g = [dAtestado[0]];
            for (let i = 1; i < dAtestado.length; i++) {
              const prev = parseISODate(dAtestado[i-1]);
              const curr = parseISODate(dAtestado[i]);
              Math.round((curr - prev) / 86400000) <= 3 ? g.push(dAtestado[i]) : (grupos.push(g), g = [dAtestado[i]]);
            }
            grupos.push(g);

            grupos.forEach(grupo => {
              const fim = grupo[grupo.length - 1];
              const inicio = grupo[0];
              const diffFim = diffDias(parseISODate(fim));
              if (diffFim < -14) return;

              const dtRetorno = parseISODate(fim);
              dtRetorno.setDate(dtRetorno.getDate() + 1);
              while (dtRetorno.getDay() === 0 || dtRetorno.getDay() === 6) dtRetorno.setDate(dtRetorno.getDate() + 1);

              const colab = colabAPI.find(c => normNome(c.nome || c.NOME || "") === nomeKey);
              resultado.push({
                nome: colab?.nome || colab?.NOME || nomeKey,
                funcao: colab?.funcao || "",
                inicio, fim,
                retornoISO: toISO(dtRetorno),
                diffRetorno: diffDias(dtRetorno),
                diffFim
              });
            });
          });
          return resultado.sort((a,b) => a.diffRetorno - b.diffRetorno);
        })();

        const semDados = colabAPI.length === 0;

      function LoginPage() {
        const [email, setEmail] = useState('');
        const [senha, setSenha] = useState('');
        const [loading, setLoading] = useState(false);
        const [erro, setErro] = useState(null);

        const entrar = async () => {
          if(!email.trim()||!senha.trim()){ setErro('Preencha email e senha.'); return; }
          setLoading(true); setErro(null);
          const {error} = await _supa.auth.signInWithPassword({email:email.trim(), password:senha});
          if(error) setErro('Email ou senha incorretos.');
          setLoading(false);
        };

        return (
          <div style={{minHeight:'100vh',background:C.bg,display:'flex',alignItems:'center',justifyContent:'center'}}>
            <div style={{background:C.card,borderRadius:16,padding:'40px 44px',width:380,boxShadow:'0 8px 32px rgba(0,0,0,0.12)',border:`1px solid ${C.border}`}}>
              <div style={{textAlign:'center',marginBottom:32}}>
                <div style={{fontSize:32,marginBottom:8}}>🏠</div>
                <div style={{fontSize:22,fontWeight:800,color:C.pri,marginBottom:4}}>RH · Cantina em Casa</div>
                <div style={{fontSize:13,color:C.muted}}>Lumar Alimentos</div>
              </div>
              {erro && <div style={{background:'#FEE2E2',color:'#991B1B',borderRadius:8,padding:'10px 14px',fontSize:13,marginBottom:16}}>{erro}</div>}
              <div style={{marginBottom:14}}>
                <label style={s.label}>Email</label>
                <input style={s.input} type="email" placeholder="seu@email.com" value={email}
                  onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==='Enter'&&entrar()} autoFocus/>
              </div>
              <div style={{marginBottom:24}}>
                <label style={s.label}>Senha</label>
                <input style={s.input} type="password" placeholder="••••••••" value={senha}
                  onChange={e=>setSenha(e.target.value)} onKeyDown={e=>e.key==='Enter'&&entrar()}/>

              <button onClick={entrar} disabled={loading} style={{...s.btn,width:'100%',justifyContent:'center',padding:'11px',fontSize:14}}>

            </div>
          </div>
        );

      function ColaboradoresPage({ empresaId, setColabAPI, gasUrl }) {
        const [lista, setLista] = useState([]);

        const [form, setForm] = useState({});
        const [busca, setBusca] = useState("");

        const FORM_VAZIO = {

          nascimento:"", admissao:"", experiencia30:"", experiencia90:"",
          salario:"", transporte:"", periculosidade:false,

          termoConfidencialidade:false, termoAssiduidade:false, termoMudancaHorario:false
        };

        const normNome = n => !n ? "" : String(n).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/\s+/g," ").trim();

        const mapearParaApp = c => ({
          nome:c.nome, setor:c.setor||'', funcao:c.funcao||'', cpf:c.cpf||'',
          telefone:c.telefone||'', chavePix:c.chave_pix||'', email:c.email||'',
          nascimento:c.nascimento||'', admissao:c.admissao||'',
          experiencia30:c.experiencia_30||'', experiencia90:c.experiencia_90||'',
          salario:Number(c.salario)||0, inss:calcINSS(c.salario), fgts:calcFGTS(c.salario),
          transporte:Number(c.transporte)||0, periculosidade:!!c.periculosidade,
          contaSalario:!!c.conta_salario, aditivoContrato:!!c.aditivo_contrato,
          usoArmario:!!c.uso_armario, lgpd:!!c.lgpd, imagem:!!c.imagem,
          camera:!!c.camera, epiUniforme:!!c.epi_uniforme,
          acompanhamentoProducao:!!c.acompanhamento_producao,
          usoCelular:!!c.uso_celular, usoVeiculo:!!c.uso_veiculo,
          termoConfidencialidade:!!c.termo_confidencialidade,
          termoAssiduidade:!!c.termo_assiduidade,
          termoMudancaHorario:!!c.termo_mudanca_horario, id_supa:c.id
        });

        const carregarHistorico = async (colab) => {
          setLoadingHistorico(true);
          const url = gasUrl || localStorage.getItem('rh_gas_url') || '';
          if (url) {
            try {
              const ini = new Date(new Date().getFullYear()-3, 0, 1).toISOString().slice(0,10);
              const fim = new Date().toISOString().slice(0,10);
              const res = await fetch(url+'?acao=atestados&ini='+ini+'&fim='+fim);
              const json = await res.json();
              if (json.ok) {
                const nome = (colab.nome||'').toLowerCase();
                setHistoricoAtestados((json.atestados||[]).filter(a=>(a.nome||'').toLowerCase().includes(nome)));
              }
            } catch(e) { setHistoricoAtestados([]); }
          }
          try {
            const {data} = await _supa.from('ferias').select('*').eq('empresa_id',empresaId).ilike('colaborador_nome','%'+colab.nome+'%').order('inicio',{ascending:false});
            setHistoricoFerias(data||[]);
          } catch(e) { setHistoricoFerias([]); }
          setLoadingHistorico(false);
        };

        const carregar = async () => {
          setLoading(true); setStatus(null);
          try {
            const {data,error} = await _supa.from('colaboradores').select('*').eq('empresa_id',empresaId).eq('ativo',true).order('nome');
            if(error) throw error;
            setLista(data||[]);
            const {data:dataD} = await _supa.from('colaboradores').select('*').eq('empresa_id',empresaId).eq('ativo',false).order('nome');
            setListaDesligados(dataD||[]);
            // Merge datas do cache local (nascimento etc. podem não estar no Supabase ainda)
            const nacCache = {};
            try { JSON.parse(localStorage.getItem("rh_colab_api")||"[]").forEach(c=>{ nacCache[normNome(c.nome)]={nascimento:c.nascimento||'',admissao:c.admissao||'',experiencia30:c.experiencia30||'',experiencia90:c.experiencia90||''}; }); } catch(e){}
            setColabAPI((data||[]).map(c=>{
              const mapped = mapearParaApp(c);
              const cache = nacCache[normNome(c.nome)]||{};
              if(!mapped.nascimento) mapped.nascimento = cache.nascimento||'';
              if(!mapped.admissao)   mapped.admissao   = cache.admissao||'';
              if(!mapped.experiencia30) mapped.experiencia30 = cache.experiencia30||'';
              if(!mapped.experiencia90) mapped.experiencia90 = cache.experiencia90||'';
              return mapped;
            }));
          } catch(e) {
            setStatus({ok:false, msg:'❌ Erro ao carregar: '+e.message});
          } finally {
            setLoading(false);
          }
        };

        useEffect(()=>{ carregar(); },[empresaId]);

        const parseDateBR = s => {
          if(!s) return null;
          const str = String(s).trim();
          if(str.includes('/')) {
            const [d,m,y] = str.split('/');
            if(!d||!m||!y) return null;
            return `${y.padStart(4,'0')}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
          }
          if(str.includes('-')) return str; // já está em ISO
          return null;
        };

        const sincronizarPlanilha = async () => {
          const url = gasUrl || localStorage.getItem("rh_gas_url") || "";
          if(!url) {
            setStatus({ok:false, msg:"❌ URL do Web App (GAS) não configurada. Acesse ⚙️ Configurações para configurar a URL do Web App."}); return;
          }
          setLoading(true); setStatus({ok:null, msg:"⏳ Buscando colaboradores na planilha..."});
          try {
            const res = await fetch(`${url}?acao=colaboradores`);
            if(!res.ok) throw new Error(`Servidor retornou ${res.status}`);
            const json = await res.json();
            if(!json.ok) throw new Error(json.msg || "Resposta inválida do GAS");
            const colab = json.colaboradores || [];
            if(colab.length>0) console.log('[sync] GAS campos recebidos:', Object.keys(colab[0]));
            if(colab.length === 0) throw new Error("Nenhum colaborador encontrado na planilha");
            setStatus({ok:null, msg:`⏳ Salvando ${colab.length} colaboradores no Supabase...`});
            const records = colab.map(c => {
              const nome = (c.nome || c.NOME || "").trim();
              const nomeKey = normNome(nome);
              return {
                id: `${empresaId}_${nomeKey}`,
                empresa_id: empresaId,
                nome,
                nome_key: nomeKey,
                funcao: c.funcao||null, setor: c.setor||null, cpf: c.cpf||null,
                telefone: c.telefone||null, chave_pix: c.chavePix||null, email: c.email||null,
                nascimento: parseDateBR(c.nascimento),
                admissao: parseDateBR(c.admissao),
                experiencia_30: parseDateBR(c.experiencia30),
                experiencia_90: parseDateBR(c.experiencia90),
                salario: Number(c.salario)||0, inss: calcINSS(c.salario),
                fgts: calcFGTS(c.salario), transporte: Number(c.transporte)||0,
                conta_salario: !!c.contaSalario, aditivo_contrato: !!c.aditivoContrato,
                uso_armario: !!c.usoArmario, lgpd: !!c.lgpd, imagem: !!c.imagem,
                camera: !!c.camera, epi_uniforme: !!c.epiUniforme,
                acompanhamento_producao: !!c.acompanhamentoProducao,
                uso_celular: !!c.usoCelular, uso_veiculo: !!c.usoVeiculo,
                termo_confidencialidade: !!c.termoConfidencialidade,
                termo_assiduidade: !!c.termoAssiduidade,
                termo_mudanca_horario: !!c.termoMudancaHorario,
                periculosidade: false, periculosidade_valor: 0,
                ativo: true, atualizado_em: new Date().toISOString()
              };
            });
            console.log('[sync] Sample record fields:', Object.keys(records[0]||{}));
            console.log('[sync] Sample telefone:', records[0]?.telefone, 'chave_pix:', records[0]?.chave_pix);
            const {error} = await _supa.from('colaboradores').upsert(records, {onConflict:'id'});
            if(error) { console.error('[sync] Supabase error:', error); throw error; }
            // Populate colabAPI from GAS data (preserves nascimento/datas even sem colunas no Supabase)
            const colabParaApp = colab.map(c=>({
              nome:(c.nome||c.NOME||"").trim(), funcao:c.funcao||'', setor:c.setor||'',
              cpf:c.cpf||'', nascimento:c.nascimento||'', admissao:c.admissao||'',
              telefone:c.telefone||'', chavePix:c.chavePix||'', email:c.email||'',
              experiencia30:c.experiencia30||'', experiencia90:c.experiencia90||'',
              salario:Number(c.salario)||0, inss:calcINSS(c.salario), fgts:calcFGTS(c.salario),
              transporte:Number(c.transporte)||0, periculosidade:false,
              contaSalario:!!c.contaSalario, aditivoContrato:!!c.aditivoContrato,
              usoArmario:!!c.usoArmario, lgpd:!!c.lgpd, imagem:!!c.imagem,
              camera:!!c.camera, epiUniforme:!!c.epiUniforme,
              acompanhamentoProducao:!!c.acompanhamentoProducao,
              usoCelular:!!c.usoCelular, usoVeiculo:!!c.usoVeiculo,
              termoConfidencialidade:!!c.termoConfidencialidade,
              termoAssiduidade:!!c.termoAssiduidade,
              termoMudancaHorario:!!c.termoMudancaHorario
            }));

            const {data:supaD} = await _supa.from('colaboradores').select('*').eq('empresa_id',empresaId).eq('ativo',false).order('nome');
            setListaDesligados(supaD||[]);
            setStatus({ok:true, msg:`✅ ${colab.length} colaboradores sincronizados com sucesso!`});
          } catch(e) {
            setStatus({ok:false, msg:"❌ Erro ao sincronizar: " + e.message});
          }
          setLoading(false);
        };

        const abrirNovo = () => { setForm(FORM_VAZIO); setEditando({novo:true}); setStatus(null); setAbaEditar('dados'); setHistoricoAtestados([]); setHistoricoFerias([]); };
        const abrirEdicao = c => {
          setForm({
            nome:c.nome||'', funcao:c.funcao||'', setor:c.setor||'', cpf:c.cpf||'',
            telefone:c.telefone||'', chavePix:c.chave_pix||'', email:c.email||'',

              funcao:form.funcao.trim()||null, setor:form.setor.trim()||null,

              transporte:parseFloat(String(form.transporte).replace(",","."))||0,

              termo_assiduidade:!!form.termoAssiduidade,
              termo_mudanca_horario:!!form.termoMudancaHorario,
              ativo:true, atualizado_em:new Date().toISOString()
            };
            let data, error;
            if(editando.novo){
              payload.id = crypto.randomUUID();
              ({data,error} = await _supa.from('colaboradores').insert(payload).select().single());
            } else {
              ({data,error} = await _supa.from('colaboradores').update(payload).eq('id',editando.id).select().single());
            }
            if(error) throw error;
            const novaLista = editando.novo
              ? [...lista, data].sort((a,b)=>a.nome.localeCompare(b.nome,'pt'))
              : lista.map(x=>x.id===editando.id?data:x);
            setLista(novaLista);
            setColabAPI(novaLista.map(mapearParaApp));
            setStatus({ok:true, msg:editando.novo?"✅ Colaborador adicionado.":"✅ Alterações salvas."});
            setEditando(null);
          } catch(err){ setStatus({ok:false,msg:"❌ Erro: "+err.message}); }
          setLoading(false);
        };

        const reativar = async c => {
          if(!window.confirm('Reativar "'+c.nome+'"?')) return;
          setLoading(true);
          const {error} = await _supa.from('colaboradores').update({ativo:true,atualizado_em:new Date().toISOString()}).eq('id',c.id);
          if(!error){
            setListaDesligados(prev=>prev.filter(x=>x.id!==c.id));
            const novaLista = [...lista,{...c,ativo:true}].sort((a,b)=>a.nome.localeCompare(b.nome,'pt'));
            setLista(novaLista); setColabAPI(novaLista.map(mapearParaApp));
            setStatus({ok:true,msg:'✅ '+c.nome+' reativado.'});
          } else { setStatus({ok:false,msg:'❌ Erro: '+error.message}); }
          setLoading(false);
        };

      function AcessosPage({ perfil: adminPerfil, empresaId }) {
        const TODAS_PAGINAS = [
          {k:'dashboard',  l:'🏠 Início'},
          {k:'colaboradores', l:'👥 Colaboradores'},
          {k:'vt',         l:'🚌 Vale Transporte'},
          {k:'folha',      l:'💼 Folha de Pagamento'},
          {k:'ferias',     l:'🏖️ Férias'},
          {k:'atestados',  l:'🏥 Atestados'},
          {k:'ponto_hist', l:'📊 Histórico Ponto'},
        ];

        const [lista, setLista] = useState([]);
        const [loading, setLoading] = useState(true);
        const [status, setStatus] = useState(null);
        const [criando, setCriando] = useState(false);
        const [editando, setEditando] = useState(null);
        const [form, setForm] = useState({});

        const FORM_VAZIO = {nome:'',email:'',senha:'',role:'usuario',paginas:['dashboard']};

        const carregar = async () => {
          setLoading(true);
          try {
            const {data,error} = await _supa.from('perfis').select('*').eq('empresa_id',empresaId).order('nome');
            if(error) throw error;
            setLista(data||[]);
          } catch(e) {
            setStatus({ok:false,msg:'❌ Erro: '+e.message});
          } finally {
            setLoading(false);
          }
        };

        useEffect(()=>{ carregar(); },[]);

        const togglePagina = (k) => {
          setForm(p=>({...p,paginas: p.paginas.includes(k) ? p.paginas.filter(x=>x!==k) : [...p.paginas,k]}));
        };

        const criarAcesso = async () => {
          if(!form.nome.trim()||!form.email.trim()||!form.senha.trim()){
            setStatus({ok:false,msg:'Preencha nome, email e senha.'}); return;
          }
          if(form.senha.length < 6){
            setStatus({ok:false,msg:'A senha deve ter pelo menos 6 caracteres.'}); return;
          }
          setLoading(true); setStatus(null);
          try {
            // Cliente isolado: não afeta a sessão do admin
            const tmpCliente = supabase.createClient(SUPA_URL, SUPA_KEY, {
              auth: {
                persistSession: false, autoRefreshToken: false, detectSessionInUrl: false,
                storage: { getItem:()=>null, setItem:()=>{}, removeItem:()=>{} }
              }
            });
            const {data, error: signUpErr} = await tmpCliente.auth.signUp({
              email: form.email.trim(), password: form.senha
            });
            if(signUpErr) throw new Error('Erro ao criar conta: ' + signUpErr.message);
            if(!data?.user) throw new Error('Este email já está cadastrado no sistema. Use um email diferente.');
            const pagsFinal = form.role==='admin' ? TODAS_PAGINAS.map(p=>p.k) : form.paginas;
            const {error: perfilErr} = await _supa.from('perfis').insert({
              id: data.user.id, nome: form.nome.trim(), email: form.email.trim(),
              empresa_id: empresaId, role: form.role, paginas: pagsFinal
            });
            if(perfilErr) throw new Error('Conta criada, mas erro ao salvar permissões: ' + perfilErr.message);
            setStatus({ok:true, msg:`✅ Acesso criado!\n📧 Email: ${form.email}\n🔑 Senha: ${form.senha}`});
            setCriando(false); setForm(FORM_VAZIO); carregar();
          } catch(e) {
            setStatus({ok:false, msg:'❌ ' + e.message});
          }
          setLoading(false);
        };

        const salvarEdicao = async () => {
          setLoading(true); setStatus(null);
          try {
            const pagsFinal = editando.role==='admin' ? TODAS_PAGINAS.map(p=>p.k) : editando.paginas;
            const {error} = await _supa.from('perfis').update({
              nome:editando.nome, role:editando.role, paginas:pagsFinal
            }).eq('id',editando.id);
            if(error) throw error;
            setStatus({ok:true,msg:'✅ Permissões atualizadas.'});
            setEditando(null); carregar();
          } catch(e) {
            setStatus({ok:false,msg:'❌ Erro: '+e.message});
          }
          setLoading(false);
        };

        const removerAcesso = async (p) => {
          if(!window.confirm(`Remover acesso de "${p.nome}"?`)) return;
          setLoading(true);
          const {error} = await _supa.from('perfis').delete().eq('id',p.id);
          if(!error){ setStatus({ok:true,msg:`✅ Acesso de ${p.nome} removido.`}); carregar(); }
          else setStatus({ok:false,msg:'❌ Erro: '+error.message});
          setLoading(false);
        };

        const CheckPaginas = ({paginas, onChange}) => (
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6,marginTop:6}}>
            {TODAS_PAGINAS.map(p=>(
              <label key={p.k} style={{display:'flex',alignItems:'center',gap:7,fontSize:13,cursor:'pointer',padding:'5px 8px',borderRadius:6,background:paginas.includes(p.k)?'#EDE9E1':'transparent'}}>
                <input type="checkbox" checked={paginas.includes(p.k)} onChange={()=>onChange(p.k)} style={{cursor:'pointer'}}/>
                {p.l}
              </label>
            ))}
          </div>
        );

        if(editando) return (
          <div>
            <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:20}}>
              <button onClick={()=>setEditando(null)} style={s.btnOutline}>← Voltar</button>
              <div style={{fontSize:18,fontWeight:800,color:C.pri}}>✏️ Editar Acesso: {editando.nome}</div>
            </div>
            {status&&<div style={{padding:'10px 14px',borderRadius:6,marginBottom:14,background:status.ok?'#DCFCE7':'#FEE2E2',color:status.ok?'#166534':'#991B1B',fontSize:13}}>{status.msg}</div>}
            <div style={s.card}>
              <div style={{marginBottom:14}}>
                <label style={s.label}>Nome</label>
                <input style={s.input} value={editando.nome} onChange={e=>setEditando(p=>({...p,nome:e.target.value}))}/>
              </div>
              <div style={{marginBottom:16}}>
                <label style={s.label}>Perfil de acesso</label>
                <div style={{display:'flex',gap:10,marginTop:6}}>
                  {['admin','usuario'].map(r=>(
                    <label key={r} style={{display:'flex',alignItems:'center',gap:6,fontSize:13,cursor:'pointer',padding:'7px 14px',borderRadius:7,border:`1.5px solid ${editando.role===r?C.pri:C.border}`,background:editando.role===r?'#EDE9E1':'transparent',fontWeight:editando.role===r?700:400}}>
                      <input type="radio" name="role_edit" checked={editando.role===r} onChange={()=>setEditando(p=>({...p,role:r}))} style={{cursor:'pointer'}}/>
                      {r==='admin'?'👑 Administrador':'👤 Usuário'}
                    </label>
                  ))}
                </div>
              </div>
              {editando.role==='usuario'&&(
                <div style={{marginBottom:16}}>
                  <label style={s.label}>Páginas permitidas</label>
                  <CheckPaginas paginas={editando.paginas||[]} onChange={k=>setEditando(p=>({...p,paginas:p.paginas.includes(k)?p.paginas.filter(x=>x!==k):[...p.paginas,k]}))}/>
                </div>
              )}
              {editando.role==='admin'&&<div style={{...s.infoBox,marginBottom:16}}>Administradores têm acesso a todas as páginas automaticamente.</div>}
              <div style={{display:'flex',gap:10}}>
                <button onClick={salvarEdicao} style={s.btn} disabled={loading}>{loading?'Salvando...':'💾 Salvar'}</button>
                <button onClick={()=>setEditando(null)} style={s.btnOutline}>Cancelar</button>
              </div>
            </div>
          </div>
        );

        if(criando) return (
          <div>
            <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:20}}>
              <button onClick={()=>{setCriando(false);setStatus(null);}} style={s.btnOutline}>← Voltar</button>
              <div style={{fontSize:18,fontWeight:800,color:C.pri}}>➕ Novo Acesso</div>
            </div>
            {status&&<div style={{padding:'10px 14px',borderRadius:6,marginBottom:14,background:status.ok?'#DCFCE7':'#FEE2E2',color:status.ok?'#166534':'#991B1B',fontSize:13,wordBreak:'break-word'}}>{status.msg}</div>}
            <div style={s.card}>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0 20px'}}>
                <div style={{marginBottom:14}}>
                  <label style={s.label}>Nome *</label>
                  <input style={s.input} placeholder="Nome completo" value={form.nome} onChange={e=>setForm(p=>({...p,nome:e.target.value}))}/>
                </div>
                <div style={{marginBottom:14}}>
                  <label style={s.label}>Email *</label>
                  <input style={s.input} type="email" placeholder="email@exemplo.com" value={form.email} onChange={e=>setForm(p=>({...p,email:e.target.value}))}/>
                </div>
                <div style={{marginBottom:16}}>
                  <label style={s.label}>Senha temporária *</label>
                  <input style={s.input} placeholder="Mínimo 6 caracteres" value={form.senha} onChange={e=>setForm(p=>({...p,senha:e.target.value}))}/>
                </div>
              </div>
              <div style={{marginBottom:16}}>
                <label style={s.label}>Perfil de acesso</label>
                <div style={{display:'flex',gap:10,marginTop:6}}>
                  {['admin','usuario'].map(r=>(
                    <label key={r} style={{display:'flex',alignItems:'center',gap:6,fontSize:13,cursor:'pointer',padding:'7px 14px',borderRadius:7,border:`1.5px solid ${form.role===r?C.pri:C.border}`,background:form.role===r?'#EDE9E1':'transparent',fontWeight:form.role===r?700:400}}>
                      <input type="radio" name="role_new" checked={form.role===r} onChange={()=>setForm(p=>({...p,role:r}))} style={{cursor:'pointer'}}/>
                      {r==='admin'?'👑 Administrador':'👤 Usuário'}
                    </label>
                  ))}
                </div>
              </div>
              {form.role==='usuario'&&(
                <div style={{marginBottom:16}}>
                  <label style={s.label}>Páginas permitidas</label>
                  <CheckPaginas paginas={form.paginas} onChange={togglePagina}/>
                </div>
              )}
              {form.role==='admin'&&<div style={{...s.infoBox,marginBottom:16}}>Administradores têm acesso a todas as páginas automaticamente.</div>}
              <div style={{display:'flex',gap:10}}>
                <button onClick={criarAcesso} style={s.btn} disabled={loading}>{loading?'Criando...':'✅ Criar Acesso'}</button>
                <button onClick={()=>{setCriando(false);setStatus(null);}} style={s.btnOutline}>Cancelar</button>
              </div>
            </div>
          </div>
        );

        return (
          <div>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
              <div style={{fontSize:20,fontWeight:800,color:C.pri}}>🔐 Gerenciar Acessos</div>
              <button onClick={()=>{setForm(FORM_VAZIO);setCriando(true);setStatus(null);}} style={s.btn}>+ Novo Acesso</button>
            </div>
            {status&&<div style={{padding:'10px 14px',borderRadius:6,marginBottom:14,background:status.ok?'#DCFCE7':'#FEE2E2',color:status.ok?'#166534':'#991B1B',fontSize:13,wordBreak:'break-word'}}>{status.msg}</div>}
            {loading?(
              <div style={{textAlign:'center',padding:40,color:C.muted}}>Carregando...</div>
            ):(
              <div style={s.card}>
                {lista.length===0?(
                  <div style={{textAlign:'center',padding:'32px 0',color:C.muted,fontSize:13}}>Nenhum usuário com acesso cadastrado.</div>
                ):(
                  <table style={s.table}>
                    <thead>
                      <tr>
                        <th style={s.th}>Nome</th>
                        <th style={s.th}>Email</th>
                        <th style={s.th}>Perfil</th>
                        <th style={s.th}>Páginas</th>
                        <th style={s.th}></th>
                      </tr>
                    </thead>
                    <tbody>
                      {lista.map(p=>(
                        <tr key={p.id} style={{borderBottom:`1px solid ${C.border}`}}>
                          <td style={{...s.td,fontWeight:600}}>{p.nome} {p.id===adminPerfil?.id&&<span style={{fontSize:10,color:C.muted}}>(você)</span>}</td>
                          <td style={{...s.td,fontSize:12,color:C.muted}}>{p.email}</td>
                          <td style={s.td}>
                            <span style={{display:'inline-block',padding:'3px 10px',borderRadius:20,fontSize:11,fontWeight:700,background:p.role==='admin'?'#FEF3C7':'#DBEAFE',color:p.role==='admin'?'#92400E':'#1E40AF'}}>
                              {p.role==='admin'?'👑 Admin':'👤 Usuário'}
                            </span>
                          </td>
                          <td style={{...s.td,fontSize:12,color:C.muted,maxWidth:200}}>
                            {p.role==='admin'?'Todas':(p.paginas||[]).length+' página(s)'}
                          </td>
                          <td style={{...s.td,textAlign:'right',whiteSpace:'nowrap'}}>
                            <button onClick={()=>setEditando({...p})} style={{...s.btnOutline,fontSize:11,padding:'4px 10px',marginRight:6}}>✏️ Editar</button>
                            {p.id!==adminPerfil?.id&&<button onClick={()=>removerAcesso(p)} style={{background:'none',border:'1px solid #FCA5A5',color:'#DC2626',borderRadius:5,fontSize:11,padding:'4px 10px',cursor:'pointer'}}>Remover</button>}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                )}
              </div>
            )}
          </div>
        );
      }

      function AtestadosPage({gasUrl, colabAPI, empresaId}) {
        function normStr(s) {
          return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]/g,'').toUpperCase();
        }
        const calcDias = (ini,fim) => {
          if(!ini||!fim) return 1;
          return Math.max(1, Math.round((new Date(fim+'T12:00:00')-new Date(ini+'T12:00:00'))/86400000)+1);
        };
        const VAZIO = {colaboradorNome:'',setor:'',cid:'',inicio:'',fim:'',obs:''};
        const hoje = new Date();
        const priDia = new Date(hoje.getFullYear(), hoje.getMonth(), 1).toISOString().slice(0,10);
        const ultDia = new Date(hoje.getFullYear(), hoje.getMonth()+1, 0).toISOString().slice(0,10);
        const [iniF, setIniF] = React.useState(priDia);
        const [fimF, setFimF] = React.useState(ultDia);
        const [lista, setLista] = React.useState([]);
        const [loading, setLoading] = React.useState(true);
        const [syncing, setSyncing] = React.useState(false);
        const [status, setStatus] = React.useState(null);
        const [filtroColab, setFiltroColab] = React.useState('');
        const [form, setForm] = React.useState(VAZIO);
        const [mostrarForm, setMostrarForm] = React.useState(false);

        const carregar = async () => {
          if(!empresaId) return;
          setLoading(true);
          const {data,error} = await _supa.from('atestados')
            .select('*').eq('empresa_id',empresaId)
            .gte('inicio',iniF).lte('inicio',fimF)
            .order('inicio',{ascending:false});
          if(!error) setLista(data||[]);
          setLoading(false);
        };

        React.useEffect(()=>{ carregar(); },[empresaId,iniF,fimF]);

        const sincronizar = async () => {
          const url = gasUrl || localStorage.getItem('rh_gas_url') || '';
          if(!url){ setStatus({ok:false,msg:'URL do GAS não configurada em ⚙️ Configurações.'}); return; }
          setSyncing(true); setStatus({ok:null,msg:'⏳ Buscando atestados na planilha...'});
          try {
            const ini5 = new Date(hoje.getFullYear()-5,0,1).toISOString().slice(0,10);
            const fim5 = new Date().toISOString().slice(0,10);
            const res = await fetch(url+'?acao=atestados&ini='+ini5+'&fim='+fim5);
            if(!res.ok) throw new Error('Servidor retornou '+res.status);
            const json = await res.json();
            if(!json.ok) throw new Error(json.msg||'Erro no GAS');
            const atestados = json.atestados||[];
            if(atestados.length===0){ setStatus({ok:true,msg:'Planilha sem atestados no período.'}); setSyncing(false); return; }
            setStatus({ok:null,msg:'⏳ Salvando '+atestados.length+' atestados no Supabase...'});
            const records = atestados.map(a=>({
              id: empresaId+'_'+normStr(a.nome)+'_'+(a.inicio||'').replace(/-/g,''),
              empresa_id: empresaId,
              colaborador_nome: (a.nome||'').trim(),
              setor: a.setor||null,
              cid: a.cid||null,
              inicio: a.inicio||null,
              fim: a.fim||a.inicio||null,
              dias: calcDias(a.inicio,a.fim||a.inicio),
              obs: a.obs||null,
              origem: 'planilha'
            })).filter(r=>r.inicio);
            const {error} = await _supa.from('atestados').upsert(records,{onConflict:'id'});
            if(error) throw error;
            setStatus({ok:true,msg:'✅ '+records.length+' atestados sincronizados!'});
            carregar();
          } catch(e){ setStatus({ok:false,msg:'❌ '+e.message}); }
          setSyncing(false);
        };

        const salvarNovo = async () => {
          if(!form.colaboradorNome||!form.inicio||!form.fim){
            setStatus({ok:false,msg:'Preencha colaborador, início e fim.'}); return;
          }
          setLoading(true);
          const dias = calcDias(form.inicio,form.fim);
          const {error} = await _supa.from('atestados').insert({
            empresa_id: empresaId,
            colaborador_nome: form.colaboradorNome.trim(),
            setor: form.setor||null, cid: form.cid||null,
            inicio: form.inicio, fim: form.fim, dias,
            obs: form.obs||null, origem: 'manual'
          });
          if(error){ setStatus({ok:false,msg:'❌ '+error.message}); }
          else { setStatus({ok:true,msg:'✅ Atestado incluído!'}); setMostrarForm(false); setForm(VAZIO); carregar(); }
          setLoading(false);
        };

        const excluir = async (id, nome) => {
          if(!window.confirm('Excluir atestado de '+nome+'?')) return;
          await _supa.from('atestados').delete().eq('id',id);
          carregar();
        };

        const filtrados = lista.filter(a=>!filtroColab||(a.colaborador_nome||'').toLowerCase().includes(filtroColab.toLowerCase()));
        const totalDias = filtrados.reduce((acc,a)=>acc+(a.dias||0),0);
        const colab = [...new Set(filtrados.map(a=>a.colaborador_nome))].length;

        return (
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
              <div>
                <div style={{fontSize:20,fontWeight:800,color:C.pri}}>🏥 Atestados</div>
                <div style={{fontSize:13,color:C.muted}}>Atestados médicos dos colaboradores</div>
              </div>
              <div style={{display:"flex",gap:8}}>
                <button onClick={()=>{ setMostrarForm(true); setForm(VAZIO); setStatus(null); }} style={s.btn}>➕ Novo Atestado</button>
                <button onClick={sincronizar} style={s.btnOutline} disabled={syncing}>{syncing?'Sincronizando...':'🔄 Sincronizar Planilha'}</button>
              </div>
            </div>

            {status&&<div style={{...s.card,background:status.ok===true?'#DCFCE7':status.ok===false?'#FEE2E2':'#EFF6FF',color:status.ok===true?'#166534':status.ok===false?'#991B1B':'#1D4ED8',margin:"12px 0"}}>{status.msg}</div>}

            {mostrarForm&&(
              <div style={{...s.card,marginBottom:16}}>
                <div style={{fontSize:15,fontWeight:700,color:C.pri,marginBottom:16}}>Novo Atestado</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 20px"}}>
                  <div style={{marginBottom:14,gridColumn:"1/-1"}}>
                    <label style={s.label}>Colaborador *</label>
                    <select value={form.colaboradorNome}
                      onChange={e=>{ const c=colabAPI.find(x=>x.nome===e.target.value); setForm(p=>({...p,colaboradorNome:e.target.value,setor:c?c.setor||'':''})); }}
                      style={{...s.input,width:"100%"}}>
                      <option value="">Selecione ou digite abaixo...</option>
                      {[...colabAPI].sort((a,b)=>a.nome.localeCompare(b.nome,'pt')).map(c=>(<option key={c.nome} value={c.nome}>{c.nome}</option>))}
                    </select>
                    <input type="text" value={form.colaboradorNome} onChange={e=>setForm(p=>({...p,colaboradorNome:e.target.value}))} placeholder="Ou digite o nome manualmente..." style={{...s.input,marginTop:4}}/>
                  </div>
                  {form.setor&&(
                    <div style={{marginBottom:14}}>
                      <label style={s.label}>Setor (do cadastro)</label>
                      <div style={{...s.input,background:"#F9FAFB",color:C.muted,fontSize:13}}>{form.setor}</div>
                    </div>
                  )}
                  <div style={{marginBottom:14}}>
                    <label style={s.label}>CID</label>
                    <input type="text" value={form.cid} onChange={e=>setForm(p=>({...p,cid:e.target.value}))} placeholder="Ex: J00, M54..." style={s.input}/>
                  </div>
                  <div style={{marginBottom:14}}>
                    <label style={s.label}>Início *</label>
                    <input type="date" value={form.inicio} onChange={e=>setForm(p=>({...p,inicio:e.target.value}))} style={s.input}/>
                  </div>
                  <div style={{marginBottom:14}}>
                    <label style={s.label}>Fim *</label>
                    <input type="date" value={form.fim} onChange={e=>setForm(p=>({...p,fim:e.target.value}))} style={s.input}/>
                  </div>
                  <div style={{marginBottom:14}}>
                    <label style={s.label}>Duração</label>
                    <div style={{...s.input,background:"#F9FAFB",color:C.muted}}>{form.inicio&&form.fim?calcDias(form.inicio,form.fim)+' dia(s)':'—'}</div>
                  </div>
                  <div style={{marginBottom:14,gridColumn:"1/-1"}}>
                    <label style={s.label}>Observações</label>
                    <input type="text" value={form.obs} onChange={e=>setForm(p=>({...p,obs:e.target.value}))} placeholder="Opcional" style={s.input}/>
                  </div>
                </div>
                <div style={{display:"flex",gap:10}}>
                  <button onClick={salvarNovo} style={s.btn} disabled={loading}>{loading?'Salvando...':'💾 Salvar'}</button>
                  <button onClick={()=>setMostrarForm(false)} style={s.btnOutline}>Cancelar</button>
                </div>
              </div>
            )}

            <div style={{...s.card,display:"flex",gap:12,alignItems:"flex-end",flexWrap:"wrap",marginBottom:16}}>
              <div><label style={s.label}>De</label><input type="date" value={iniF} onChange={e=>setIniF(e.target.value)} style={s.input}/></div>
              <div><label style={s.label}>Até</label><input type="date" value={fimF} onChange={e=>setFimF(e.target.value)} style={s.input}/></div>
              <div style={{flex:1,minWidth:180}}>
                <label style={s.label}>Filtrar colaborador</label>
                <input type="text" value={filtroColab} onChange={e=>setFiltroColab(e.target.value)} placeholder="Nome..." style={s.input}/>
              </div>
            </div>

            {filtrados.length>0&&(
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:16}}>
                <div style={{...s.card,textAlign:"center",padding:"16px"}}><div style={{fontSize:28,fontWeight:800,color:C.pri}}>{filtrados.length}</div><div style={{fontSize:12,color:C.muted}}>Atestados</div></div>
                <div style={{...s.card,textAlign:"center",padding:"16px"}}><div style={{fontSize:28,fontWeight:800,color:C.pri}}>{totalDias}</div><div style={{fontSize:12,color:C.muted}}>Dias afastados</div></div>
                <div style={{...s.card,textAlign:"center",padding:"16px"}}><div style={{fontSize:28,fontWeight:800,color:C.pri}}>{colab}</div><div style={{fontSize:12,color:C.muted}}>Colaboradores</div></div>
              </div>
            )}

            <div style={{...s.card,padding:0,overflow:"hidden"}}>
              <table style={{width:"100%",borderCollapse:"collapse"}}>
                <thead><tr style={{background:"#F9FAFB"}}>
                  <th style={s.th}>Colaborador</th><th style={s.th}>Setor</th><th style={s.th}>CID</th>
                  <th style={s.th}>Início</th><th style={s.th}>Fim</th>
                  <th style={{...s.th,textAlign:"center"}}>Dias</th>
                  <th style={s.th}>Obs.</th><th style={s.th}>Origem</th>
                  <th style={{...s.th,textAlign:"right"}}></th>
                </tr></thead>
                <tbody>
                  {loading?(
                    <tr><td colSpan={9} style={{textAlign:"center",padding:"32px",color:C.muted}}>Carregando...</td></tr>
                  ):filtrados.length===0?(
                    <tr><td colSpan={9} style={{textAlign:"center",padding:"32px",color:C.muted}}>
                      Nenhum atestado no período. Use "Sincronizar Planilha" para importar ou "Novo Atestado" para incluir.
                    </td></tr>
                  ):filtrados.map(a=>{
                    const d1=a.inicio?new Date(a.inicio+'T12:00:00'):null;
                    const d2=a.fim?new Date(a.fim+'T12:00:00'):null;
                    return(
                      <tr key={a.id} style={{borderTop:"1px solid "+C.border,background:"#fff"}}>
                        <td style={{...s.td,fontWeight:600}}>{a.colaborador_nome}</td>
                        <td style={{...s.td,fontSize:12,color:C.muted}}>{a.setor||"—"}</td>
