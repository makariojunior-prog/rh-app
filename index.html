      function AdiantamentosPage({ colabAPI, empresaId }) {
        const hoje = new Date().toISOString().slice(0,10);
        const mesAtual = hoje.slice(0,7);

        // ── Tabs ──
        const [aba, setAba] = React.useState('avulsos');

        // ── Avulsos ──
        const [mesRef, setMesRef] = React.useState(mesAtual);
        const [lista, setLista] = React.useState([]);
        const [loading, setLoading] = React.useState(true);
        const [status, setStatus] = React.useState(null);
        const [mostrarForm, setMostrarForm] = React.useState(false);
        const VAZIO = {colaboradorNome:'',valor:'',dataConcessao:hoje,obs:''};
        const [form, setForm] = React.useState(VAZIO);

        const carregar = async () => {
          if(!empresaId) return;
          setLoading(true);
          const {data,error} = await _supa.from('adiantamentos')
            .select('*').eq('empresa_id',empresaId)
            .eq('mes_referencia',mesRef)
            .order('data_concessao',{ascending:false});
          if(!error) setLista(data||[]);
          setLoading(false);
        };

        React.useEffect(()=>{ carregar(); },[empresaId,mesRef]);

        const salvar = async () => {
          if(!form.colaboradorNome||!form.valor||!form.dataConcessao){
            setStatus({ok:false,msg:'Preencha colaborador, valor e data.'}); return;
          }
          const val = parseFloat(String(form.valor).replace(',','.'));
          if(isNaN(val)||val<=0){ setStatus({ok:false,msg:'Valor inválido.'}); return; }
          const _dia=parseInt(form.dataConcessao.slice(-2));
          const [_yyyy,_mm]=form.dataConcessao.slice(0,7).split('-');
          let mesR;
          if(_dia>=26){ const nd=new Date(parseInt(_yyyy),parseInt(_mm),1); mesR=`${nd.getFullYear()}-${String(nd.getMonth()+1).padStart(2,'0')}`; }
          else mesR=form.dataConcessao.slice(0,7);
          setLoading(true);
          const colab = colabAPI.find(c=>c.nome===form.colaboradorNome);
          const {error} = await _supa.from('adiantamentos').insert({
            empresa_id:empresaId,
            colaborador_id:colab?.id||null,
            colaborador_nome:form.colaboradorNome.trim(),
            valor:val,
            data_concessao:form.dataConcessao,
            mes_referencia:mesR,
            status:'pendente',
            obs:form.obs||null
          });
          if(error){ setStatus({ok:false,msg:'❌ '+error.message}); }
          else{ setStatus({ok:true,msg:'✅ Adiantamento registrado!'}); setMostrarForm(false); setForm(VAZIO); carregar(); }
          setLoading(false);
        };

        const cancelarAdt = async (id) => {
          if(!await confirmar('Cancelar este adiantamento? Ele ficará com status "cancelado".','Cancelar Adiantamento')) return;
          setLoading(true);
          await _supa.from('adiantamentos').update({status:'cancelado'}).eq('id',id);
          await carregar();
        };

        const totalPendente = lista.filter(a=>a.status==='pendente').reduce((s,a)=>s+Number(a.valor),0);
        const corSt = {pendente:{bg:"#FEF9C3",c:"#92400E"},descontado:{bg:"#DCFCE7",c:"#166534"},cancelado:{bg:"#FEE2E2",c:"#991B1B"}};
        const porColab = {};
        lista.filter(a=>a.status==='pendente').forEach(a=>{
          if(!porColab[a.colaborador_nome]) porColab[a.colaborador_nome]=0;
          porColab[a.colaborador_nome]+=Number(a.valor);
        });

        // ── Fixos ──
        const [fixos, setFixos] = React.useState([]);
        const [loadingFixos, setLoadingFixos] = React.useState(false);
        const [statusFixo, setStatusFixo] = React.useState(null);
        const [mostrarFormFixo, setMostrarFormFixo] = React.useState(false);
        const VAZIO_FIXO = {colaboradorNome:'',valor:'',descricao:'Adiantamento Fixo'};
        const [formFixo, setFormFixo] = React.useState(VAZIO_FIXO);

        const carregarFixos = async () => {
          if(!empresaId) return;
          setLoadingFixos(true);
          const {data} = await _supa.from('adiantamentos_fixos').select('*').eq('empresa_id',empresaId).order('colaborador_nome');
          setFixos(data||[]);
          setLoadingFixos(false);
        };

        React.useEffect(()=>{ carregarFixos(); },[empresaId]);

        const salvarFixo = async () => {
          if(!formFixo.colaboradorNome||!formFixo.valor){
            setStatusFixo({ok:false,msg:'Preencha colaborador e valor.'}); return;
          }
          const val = parseFloat(String(formFixo.valor).replace(',','.'));
          if(isNaN(val)||val<=0){ setStatusFixo({ok:false,msg:'Valor inválido.'}); return; }
          setLoadingFixos(true);
          const {error} = await _supa.from('adiantamentos_fixos').insert({
            empresa_id:empresaId,
            colaborador_nome:formFixo.colaboradorNome.trim(),
            valor:val,
            descricao:formFixo.descricao.trim()||'Adiantamento Fixo',
            ativo:true
          });
          if(error){ setStatusFixo({ok:false,msg:'❌ '+error.message}); }
          else{ setStatusFixo({ok:true,msg:'✅ Adiantamento fixo criado! Será incluído automaticamente na Folha de Pagamento todos os meses.'}); setMostrarFormFixo(false); setFormFixo(VAZIO_FIXO); carregarFixos(); }
          setLoadingFixos(false);
        };

        const toggleAtivoFixo = async (id, ativo) => {
          setLoadingFixos(true);
          await _supa.from('adiantamentos_fixos').update({ativo:!ativo}).eq('id',id);
          await carregarFixos();
        };

        const excluirFixo = async (id, nome) => {
          if(!await confirmar(`Excluir adiantamento fixo de ${nome}? Esta ação não pode ser desfeita.`,'Excluir Adiantamento Fixo')) return;
          setLoadingFixos(true);
          await _supa.from('adiantamentos_fixos').delete().eq('id',id);
          await carregarFixos();
        };

        const fixosAtivos = fixos.filter(f=>f.ativo);
        const totalFixosAtivos = fixosAtivos.reduce((s,f)=>s+Number(f.valor),0);

        return (
          <div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
              <div>
                <div style={{fontSize:20,fontWeight:800,color:C.pri}}>💵 Adiantamentos</div>
                <div style={{fontSize:13,color:C.muted}}>Avulsos e recorrentes mensais</div>
              </div>
            </div>

            {/* Tabs */}
            <div style={{display:"flex",gap:0,borderBottom:`2px solid ${C.border}`,marginBottom:18}}>
              {[
                {k:'avulsos', l:'💵 Avulsos', badge: lista.filter(a=>a.status==='pendente').length||null},
                {k:'fixos',   l:'📌 Fixos Mensais', badge: fixosAtivos.length||null}
              ].map(t=>(
                <button key={t.k} onClick={()=>setAba(t.k)} style={{
                  background:"none",border:"none",borderBottom:aba===t.k?`2px solid ${C.acc}`:"2px solid transparent",
                  marginBottom:-2,padding:"8px 20px",cursor:"pointer",fontWeight:aba===t.k?700:400,
                  color:aba===t.k?C.acc:C.muted,fontSize:13,display:"flex",alignItems:"center",gap:6
                }}>
                  {t.l}
                  {t.badge>0&&<span style={{background:aba===t.k?C.acc:"#E5E7EB",color:aba===t.k?"#fff":C.muted,borderRadius:20,fontSize:10,fontWeight:700,padding:"1px 7px"}}>{t.badge}</span>}
                </button>
              ))}
            </div>

            {/* ───── ABA AVULSOS ───── */}
            {aba==='avulsos'&&(
              <div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
                  <div style={{display:"flex",gap:8,alignItems:"center"}}>
                    <label style={{...s.label,marginBottom:0}}>Mês ref.:</label>
                    <input type="month" value={mesRef} onChange={e=>setMesRef(e.target.value)} style={{...s.input,width:150,marginBottom:0}}/>
                  </div>
                  <button onClick={()=>{setMostrarForm(true);setStatus(null);setForm(VAZIO);}} style={s.btn}>+ Novo Avulso</button>
                </div>

                {status&&<div style={{padding:"10px 14px",borderRadius:6,marginBottom:14,background:status.ok?"#DCFCE7":"#FEE2E2",color:status.ok?"#166534":"#991B1B",fontSize:13}}>{status.msg}</div>}

                {mostrarForm&&(
                  <div style={{...s.card,marginBottom:16,border:"1px solid "+C.pri}}>
                    <div style={{fontWeight:700,color:C.pri,marginBottom:14,fontSize:13,textTransform:"uppercase",letterSpacing:"0.05em"}}>Registrar Adiantamento Avulso</div>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 20px"}}>
                      <div style={{marginBottom:14}}>
                        <label style={s.label}>Colaborador *</label>
                        <select value={form.colaboradorNome} onChange={e=>setForm(p=>({...p,colaboradorNome:e.target.value}))} style={s.input}>
                          <option value="">Selecione...</option>
                          {[...colabAPI].sort((a,b)=>(a.nome||'').localeCompare(b.nome||'','pt')).map(c=>(
                            <option key={c.nome} value={c.nome}>{c.nome}</option>
                          ))}
                        </select>
                      </div>
                      <div style={{marginBottom:14}}>
                        <label style={s.label}>Valor (R$) *</label>
                        <input type="number" step="0.01" min="0" value={form.valor} onChange={e=>setForm(p=>({...p,valor:e.target.value}))} placeholder="0,00" style={s.input}/>
                      </div>
                      <div style={{marginBottom:14}}>
                        <label style={s.label}>Data da Concessão *</label>
                        <input type="date" value={form.dataConcessao} onChange={e=>setForm(p=>({...p,dataConcessao:e.target.value}))} style={s.input}/>
                        <div style={{fontSize:11,color:C.muted,marginTop:3}}>Adiantamento no dia ≥ 26 é contabilizado na folha do mês seguinte.</div>
                      </div>
                      <div style={{marginBottom:14}}>
                        <label style={s.label}>Observações</label>
                        <input type="text" value={form.obs} onChange={e=>setForm(p=>({...p,obs:e.target.value}))} placeholder="Motivo, etc." style={s.input}/>
                      </div>
                    </div>
                    <div style={{display:"flex",gap:10}}>
                      <button onClick={salvar} style={s.btn} disabled={loading}>💾 Salvar</button>
                      <button onClick={()=>{setMostrarForm(false);setStatus(null);}} style={s.btnOutline}>Cancelar</button>
                    </div>
                  </div>
                )}

                {Object.keys(porColab).length>0&&(
                  <div style={{...s.card,marginBottom:14,background:"#FFFBEB",border:"1px solid #FCD34D"}}>
                    <div style={{fontWeight:700,fontSize:13,color:"#92400E",marginBottom:8}}>
                      ⚠️ Pendentes para desconto na Folha de {mesRef.split('-').reverse().join('/')}
                    </div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:8,alignItems:"center"}}>
                      {Object.entries(porColab).map(([nome,val])=>(
                        <span key={nome} style={{background:"#FEF9C3",border:"1px solid #FCD34D",borderRadius:8,padding:"4px 12px",fontSize:12,fontWeight:600}}>
                          {nome}: <span style={{color:"#92400E"}}>{fmtBRL(val)}</span>
                        </span>
                      ))}
                      <span style={{background:C.pri,color:"#fff",borderRadius:8,padding:"4px 12px",fontSize:12,fontWeight:700}}>
                        Total pendente: {fmtBRL(totalPendente)}
                      </span>
                    </div>
                  </div>
                )}

                {loading?(
                  <div style={{textAlign:"center",padding:"32px",color:C.muted}}>Carregando...</div>
                ):lista.length===0?(
                  <div style={{...s.card,textAlign:"center",padding:"48px 20px",color:C.muted}}>
                    <div style={{fontSize:32,marginBottom:8}}>💵</div>
                    <div style={{fontWeight:700,marginBottom:4}}>Nenhum adiantamento em {mesRef.split('-').reverse().join('/')}</div>
                    <div style={{fontSize:12}}>Clique em "+ Novo Avulso" para registrar.</div>
                  </div>
                ):(
                  <div style={s.card}>
                    <table style={{width:"100%",borderCollapse:"collapse"}}>
                      <thead>
                        <tr style={{background:"var(--c-subtle)"}}>
                          <th style={s.th}>Colaborador</th><th style={s.th}>Valor</th>
                          <th style={s.th}>Data</th><th style={s.th}>Mês Ref.</th>
                          <th style={{...s.th,textAlign:"center"}}>Status</th>
                          <th style={s.th}>Obs</th><th style={{...s.th,textAlign:"right"}}></th>
                        </tr>
                      </thead>
                      <tbody>
                        {lista.map(a=>{
                          const cor=corSt[a.status]||corSt.pendente;
                          return(
                            <tr key={a.id} style={{borderTop:"1px solid "+C.border}}>
                              <td style={{...s.td,fontWeight:600}}>{a.colaborador_nome}</td>
                              <td style={{...s.td,fontWeight:700,color:C.pri}}>{fmtBRL(Number(a.valor))}</td>
                              <td style={{...s.td,fontSize:12}}>{a.data_concessao?new Date(a.data_concessao+'T12:00:00').toLocaleDateString('pt-BR'):'—'}</td>
                              <td style={{...s.td,fontSize:12}}>{a.mes_referencia?a.mes_referencia.split('-').reverse().join('/'):'—'}</td>
                              <td style={{...s.td,textAlign:"center"}}>
                                <span style={{background:cor.bg,color:cor.c,padding:"2px 8px",borderRadius:10,fontSize:11,fontWeight:700}}>{a.status}</span>
                              </td>
                              <td style={{...s.td,fontSize:12,color:C.muted}}>{a.obs||'—'}</td>
                              <td style={{...s.td,textAlign:"right"}}>
                                {a.status==='pendente'&&(
                                  <button onClick={()=>cancelarAdt(a.id)} style={{background:"none",border:"1px solid #FCA5A5",color:"#DC2626",borderRadius:5,fontSize:11,padding:"4px 10px",cursor:"pointer"}}>Cancelar</button>
                                )}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            )}

            {/* ───── ABA FIXOS ───── */}
            {aba==='fixos'&&(
              <div>
                {/* Info card */}
                <div style={{...s.card,background:"#F5F3FF",border:"1px solid #C4B5FD",marginBottom:16}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:10}}>
                    <div>
                      <div style={{fontWeight:800,color:"#5B21B6",fontSize:13,marginBottom:4}}>📌 Como funcionam os Adiantamentos Fixos</div>
                      <div style={{fontSize:12,color:"#6D28D9",lineHeight:1.7}}>
                        São valores mensais <strong>recorrentes</strong> descontados automaticamente na Folha de Pagamento.<br/>
                        Diferente dos avulsos, <strong>não são criados mês a mês</strong> — ficam ativos até você desativar ou excluir.<br/>
                        Aparecem na coluna <strong>Adiant. R$</strong> da Folha com o indicador <strong>📌 fixo</strong>.
                      </div>
                    </div>
                    {fixosAtivos.length>0&&(
                      <div style={{background:"#7C3AED",color:"#fff",borderRadius:10,padding:"8px 16px",textAlign:"center",flexShrink:0}}>
                        <div style={{fontSize:10,opacity:0.8,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:2}}>Total fixo/mês</div>
                        <div style={{fontSize:16,fontWeight:800}}>{fmtBRL(totalFixosAtivos)}</div>
                      </div>
                    )}
                  </div>
                </div>

                <div style={{display:"flex",justifyContent:"flex-end",marginBottom:14}}>
                  <button onClick={()=>{setMostrarFormFixo(true);setStatusFixo(null);setFormFixo(VAZIO_FIXO);}} style={{...s.btn,background:"#7C3AED"}}>📌 + Novo Fixo</button>
                </div>

                {statusFixo&&<div style={{padding:"10px 14px",borderRadius:6,marginBottom:14,background:statusFixo.ok?"#DCFCE7":"#FEE2E2",color:statusFixo.ok?"#166534":"#991B1B",fontSize:13}}>{statusFixo.msg}</div>}

                {mostrarFormFixo&&(
                  <div style={{...s.card,marginBottom:16,border:"2px solid #7C3AED"}}>
                    <div style={{fontWeight:700,color:"#5B21B6",marginBottom:14,fontSize:13,textTransform:"uppercase",letterSpacing:"0.05em"}}>📌 Cadastrar Adiantamento Fixo Mensal</div>
                    <div style={{...s.card,background:"#FFFBEB",border:"1px solid #FCD34D",marginBottom:14,padding:"10px 14px"}}>
                      <div style={{fontSize:12,color:"#92400E"}}>⚠️ Este valor será descontado automaticamente na folha <strong>todos os meses</strong>, enquanto estiver ativo. Use apenas para benefícios recorrentes (ex: antecipação de salário fixa, desconto de convênio, etc).</div>
                    </div>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 20px"}}>
                      <div style={{marginBottom:14}}>
                        <label style={s.label}>Colaborador *</label>
                        <select value={formFixo.colaboradorNome} onChange={e=>setFormFixo(p=>({...p,colaboradorNome:e.target.value}))} style={s.input}>
                          <option value="">Selecione...</option>
                          {[...colabAPI].sort((a,b)=>(a.nome||'').localeCompare(b.nome||'','pt')).map(c=>(
                            <option key={c.nome} value={c.nome}>{c.nome}</option>
                          ))}
                        </select>
                      </div>
                      <div style={{marginBottom:14}}>
                        <label style={s.label}>Valor mensal (R$) *</label>
                        <input type="number" step="0.01" min="0.01" value={formFixo.valor} onChange={e=>setFormFixo(p=>({...p,valor:e.target.value}))} placeholder="0,00" style={s.input}/>
                      </div>
                      <div style={{marginBottom:14,gridColumn:"1/-1"}}>
                        <label style={s.label}>Descrição</label>
                        <input type="text" value={formFixo.descricao} onChange={e=>setFormFixo(p=>({...p,descricao:e.target.value}))} placeholder="Ex: Antecipação salarial, convênio farmácia..." style={s.input}/>
                      </div>
                    </div>
                    <div style={{display:"flex",gap:10}}>
                      <button onClick={salvarFixo} style={{...s.btn,background:"#7C3AED"}} disabled={loadingFixos}>📌 Criar Fixo</button>
                      <button onClick={()=>{setMostrarFormFixo(false);setStatusFixo(null);}} style={s.btnOutline}>Cancelar</button>
                    </div>
                  </div>
                )}

                {loadingFixos?(
                  <div style={{textAlign:"center",padding:"32px",color:C.muted}}>Carregando...</div>
                ):fixos.length===0?(
                  <div style={{...s.card,textAlign:"center",padding:"48px 20px",color:C.muted}}>
                    <div style={{fontSize:32,marginBottom:8}}>📌</div>
                    <div style={{fontWeight:700,marginBottom:4}}>Nenhum adiantamento fixo cadastrado</div>
                    <div style={{fontSize:12}}>Clique em "+ Novo Fixo" para criar um desconto mensal recorrente.</div>
                  </div>
                ):(
                  <div style={s.card}>
                    <table style={{width:"100%",borderCollapse:"collapse"}}>
                      <thead>
                        <tr style={{background:"var(--c-subtle)"}}>
                          <th style={s.th}>Colaborador</th>
                          <th style={s.th}>Valor/mês</th>
                          <th style={s.th}>Descrição</th>
                          <th style={{...s.th,textAlign:"center"}}>Status</th>
                          <th style={{...s.th,textAlign:"right"}}></th>
                        </tr>
                      </thead>
                      <tbody>
                        {fixos.map(f=>(
                          <tr key={f.id} style={{borderTop:"1px solid "+C.border,opacity:f.ativo?1:0.55}}>
                            <td style={{...s.td,fontWeight:600}}>{f.colaborador_nome}</td>
                            <td style={{...s.td,fontWeight:700,color:f.ativo?"#7C3AED":C.muted}}>{fmtBRL(Number(f.valor))}</td>
                            <td style={{...s.td,fontSize:12,color:C.muted}}>{f.descricao||'—'}</td>
                            <td style={{...s.td,textAlign:"center"}}>
                              <span style={{background:f.ativo?"#EDE9FE":"#F3F4F6",color:f.ativo?"#5B21B6":C.muted,padding:"2px 10px",borderRadius:10,fontSize:11,fontWeight:700}}>
                                {f.ativo?'✅ Ativo':'⏸ Inativo'}
                              </span>
                            </td>
                            <td style={{...s.td,textAlign:"right"}}>
                              <div style={{display:"flex",gap:6,justifyContent:"flex-end"}}>
                                <button
                                  onClick={()=>toggleAtivoFixo(f.id,f.ativo)}
                                  style={{background:"none",border:`1px solid ${f.ativo?"#FCD34D":"#A78BFA"}`,color:f.ativo?"#92400E":"#5B21B6",borderRadius:5,fontSize:11,padding:"4px 10px",cursor:"pointer"}}
                                  disabled={loadingFixos}
                                >
                                  {f.ativo?'⏸ Pausar':'▶ Ativar'}
                                </button>
                                <button
                                  onClick={()=>excluirFixo(f.id,f.colaborador_nome)}
                                  style={{background:"none",border:"1px solid #FCA5A5",color:"#DC2626",borderRadius:5,fontSize:11,padding:"4px 10px",cursor:"pointer"}}
                                  disabled={loadingFixos}
                                >
                                  🗑 Excluir
                                </button>
                              </div>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                    {fixosAtivos.length>0&&(
                      <div style={{marginTop:12,padding:"8px 12px",background:"#F5F3FF",borderRadius:7,fontSize:12,color:"#5B21B6",fontWeight:600}}>
                        📌 Total descontado automaticamente todo mês: <strong>{fmtBRL(totalFixosAtivos)}</strong> · {fixosAtivos.length} colaborador{fixosAtivos.length!==1?"es":""}
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}
          </div>
        );
      }

      function ComprasPage({ colabAPI, empresaId }) {
        const hoje = new Date();
        const mesAtual = `${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,'0')}`;
        const VAZIO = { colaboradorNome:'', produto:'', valor:'', dataCompra: hoje.toISOString().slice(0,10), mesReferencia: mesAtual, obs:'' };

        const [mesRef, setMesRef] = React.useState(mesAtual);
        const [lista, setLista] = React.useState([]);
        const [loading, setLoading] = React.useState(true);
        const [status, setStatus] = React.useState(null);
        const [mostrarForm, setMostrarForm] = React.useState(false);
        const [form, setForm] = React.useState(VAZIO);

        const carregar = async () => {
          if(!empresaId) return;
          setLoading(true);
          const {data,error} = await _supa.from('compras').select('*').eq('empresa_id',empresaId).eq('mes_referencia',mesRef).order('data_compra',{ascending:false});
          if(!error) setLista(data||[]);
          setLoading(false);
        };

        React.useEffect(()=>{ carregar(); },[empresaId,mesRef]);

        const salvar = async () => {
          if(!form.colaboradorNome||!form.produto||!form.valor||!form.dataCompra){
            setStatus({ok:false,msg:'Preencha colaborador, produto, valor e data.'}); return;
          }
          const valor = parseFloat(String(form.valor).replace(',','.'));
          if(isNaN(valor)||valor<=0){ setStatus({ok:false,msg:'Valor deve ser maior que zero.'}); return; }
          setLoading(true);
          const {error} = await _supa.from('compras').insert({
            id: crypto.randomUUID(),
            empresa_id: empresaId,
            colaborador_nome: form.colaboradorNome.trim(),
            produto: form.produto.trim(),
            valor,
            data_compra: form.dataCompra,
            mes_referencia: form.mesReferencia,
            status: 'pendente',
            obs: form.obs||null
          });
          if(error){ setStatus({ok:false,msg:'❌ '+error.message}); }
          else { setStatus({ok:true,msg:'✅ Compra lançada!'}); setMostrarForm(false); setForm(VAZIO); carregar(); }
          setLoading(false);
        };

        const excluir = async (id, nome) => {
          if(!await confirmar('Excluir compra de '+nome+'?','Excluir Compra')) return;
          await _supa.from('compras').delete().eq('id',id);
          carregar();
        };

        const resumoPorColab = Object.values(lista.reduce((acc,c)=>{
          if(c.status!=='pendente') return acc;
          const k = c.colaborador_nome;
          if(!acc[k]) acc[k]={nome:k,total:0,qtd:0};
          acc[k].total += Number(c.valor)||0;
          acc[k].qtd++;
          return acc;
        },{})).sort((a,b)=>b.total-a.total);

        const totalPendente = resumoPorColab.reduce((s,c)=>s+c.total,0);

        return (
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
              <div>
                <div style={{fontSize:20,fontWeight:800,color:C.pri}}>🛍️ Compras de Funcionários</div>
                <div style={{fontSize:13,color:C.muted}}>Compras de produtos descontadas em folha</div>
              </div>
              <button onClick={()=>{setMostrarForm(true);setForm({...VAZIO,mesReferencia:mesRef});setStatus(null);}} style={s.btn}>➕ Nova Compra</button>
            </div>

            {status&&<div style={{...s.card,background:status.ok?'#DCFCE7':'#FEE2E2',color:status.ok?'#166534':'#991B1B',margin:"12px 0"}}>{status.msg}</div>}

            {mostrarForm&&(
              <div style={{...s.card,marginBottom:16}}>
                <div style={{fontSize:15,fontWeight:700,color:C.pri,marginBottom:16}}>Nova Compra</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 20px"}}>
                  <div style={{marginBottom:14,gridColumn:"1/-1"}}>
                    <label style={s.label}>Colaborador *</label>
                    <select value={form.colaboradorNome} onChange={e=>setForm(p=>({...p,colaboradorNome:e.target.value}))} style={{...s.input,width:"100%"}}>
                      <option value="">Selecione...</option>
                      {[...colabAPI].sort((a,b)=>a.nome.localeCompare(b.nome,'pt')).map(c=>(<option key={c.nome} value={c.nome}>{c.nome}</option>))}
                    </select>
                  </div>
                  <div style={{marginBottom:14,gridColumn:"1/-1"}}>
                    <label style={s.label}>Produto *</label>
                    <input type="text" value={form.produto} onChange={e=>setForm(p=>({...p,produto:e.target.value}))} placeholder="Ex: Frango, Linguiça, Marmita..." style={s.input}/>
                  </div>
                  <div style={{marginBottom:14}}>
                    <label style={s.label}>Valor (R$) *</label>
                    <input type="number" step="0.01" min="0.01" value={form.valor} onChange={e=>setForm(p=>({...p,valor:e.target.value}))} placeholder="0,00" style={s.input}/>
                  </div>
                  <div style={{marginBottom:14}}>
                    <label style={s.label}>Data da Compra *</label>
                    <input type="date" value={form.dataCompra} onChange={e=>{
                      const d=e.target.value;
                      const dia=parseInt(d.slice(-2));
                      const [yyyy,mm]=d.slice(0,7).split('-');
                      let mr;
                      if(dia>=26){ const nd=new Date(parseInt(yyyy),parseInt(mm),1); mr=`${nd.getFullYear()}-${String(nd.getMonth()+1).padStart(2,'0')}`; }
                      else mr=d.slice(0,7);
                      setForm(p=>({...p,dataCompra:d,mesReferencia:mr}));
                    }} style={s.input}/>
                    <div style={{fontSize:11,color:C.muted,marginTop:3}}>Compra no dia ≥ 26 é contabilizada na folha do mês seguinte.</div>
                  </div>
                  <div style={{marginBottom:14}}>
                    <label style={s.label}>Mês de Referência (Folha) *</label>
                    <input type="month" value={form.mesReferencia} onChange={e=>setForm(p=>({...p,mesReferencia:e.target.value}))} style={s.input}/>
                    <div style={{fontSize:11,color:C.muted,marginTop:3}}>Ajustado automaticamente pela data, mas pode ser corrigido aqui.</div>
                  </div>
                  <div style={{marginBottom:14}}>
                    <label style={s.label}>Observações</label>
                    <input type="text" value={form.obs} onChange={e=>setForm(p=>({...p,obs:e.target.value}))} placeholder="Opcional" style={s.input}/>
                  </div>
                </div>
                <div style={{display:"flex",gap:10}}>
                  <button onClick={salvar} style={s.btn} disabled={loading}>{loading?'Salvando...':'💾 Salvar'}</button>
                  <button onClick={()=>setMostrarForm(false)} style={s.btnOutline}>Cancelar</button>
                </div>
              </div>
            )}

            <div style={{...s.card,display:"flex",gap:12,alignItems:"flex-end",marginBottom:16}}>
              <div>
                <label style={s.label}>Mês de referência</label>
                <input type="month" value={mesRef} onChange={e=>setMesRef(e.target.value)} style={s.input}/>
              </div>
            </div>

            {resumoPorColab.length>0&&(
              <div style={{...s.card,marginBottom:16}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                  <div style={{fontWeight:700,color:C.amber,fontSize:13,textTransform:"uppercase",letterSpacing:"0.05em"}}>⏳ Pendentes para desconto na Folha</div>
                  <div style={{fontWeight:800,fontSize:15,color:C.danger}}>{fmtBRL(totalPendente)}</div>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:10}}>
                  {resumoPorColab.map((c,i)=>(
                    <div key={i} style={{background:"#FFFBEB",border:"1px solid #FDE68A",borderRadius:8,padding:"12px 14px"}}>
                      <div style={{fontWeight:700,fontSize:13,color:C.pri,marginBottom:2}}>{c.nome}</div>
                      <div style={{fontSize:11,color:C.muted}}>{c.qtd} compra{c.qtd!==1?"s":""}</div>
                      <div style={{fontSize:16,fontWeight:800,color:C.amber,marginTop:4}}>{fmtBRL(c.total)}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            <div style={{...s.card,padding:0,overflow:"hidden"}}>
              <table style={{width:"100%",borderCollapse:"collapse"}}>
                <thead><tr style={{background:"var(--c-subtle)"}}>
                  <th style={s.th}>Colaborador</th>
                  <th style={s.th}>Produto</th>
                  <th style={{...s.th,textAlign:"right"}}>Valor</th>
                  <th style={s.th}>Data</th>
                  <th style={s.th}>Ref. Folha</th>
                  <th style={s.th}>Status</th>
                  <th style={s.th}>Obs.</th>
                  <th style={{...s.th,textAlign:"right"}}></th>
                </tr></thead>
                <tbody>
                  {loading?(
                    <tr><td colSpan={8} style={{textAlign:"center",padding:"32px",color:C.muted}}>Carregando...</td></tr>
                  ):lista.length===0?(
                    <tr><td colSpan={8} style={{textAlign:"center",padding:"32px",color:C.muted}}>Nenhuma compra registrada no período.</td></tr>
                  ):lista.map(c=>{
                    const dt = c.data_compra?new Date(c.data_compra+'T12:00:00'):null;
                    const isPendente = c.status==='pendente';
                    return (
                      <tr key={c.id} style={{borderTop:"1px solid "+C.border}}>
                        <td style={{...s.td,fontWeight:600}}>{c.colaborador_nome}</td>
                        <td style={s.td}>{c.produto}</td>
                        <td style={{...s.td,textAlign:"right",fontWeight:700,color:C.danger}}>{fmtBRL(Number(c.valor)||0)}</td>
                        <td style={{...s.td,fontSize:12}}>{dt?dt.toLocaleDateString('pt-BR'):'—'}</td>
                        <td style={{...s.td,fontSize:12,color:C.muted}}>{c.mes_referencia||'—'}</td>
                        <td style={s.td}>
                          <span style={{background:isPendente?"#FEF9C3":"#DCFCE7",color:isPendente?"#92400E":"#166534",padding:"2px 8px",borderRadius:8,fontSize:11,fontWeight:700}}>
                            {isPendente?'Pendente':'Descontado'}
                          </span>
                        </td>
                        <td style={{...s.td,fontSize:12,color:C.muted}}>{c.obs||"—"}</td>
                        <td style={{...s.td,textAlign:"right"}}>
                          {isPendente&&<button onClick={()=>excluir(c.id,c.colaborador_nome)} style={{background:"none",border:"1px solid #FCA5A5",color:"#DC2626",borderRadius:4,fontSize:11,padding:"3px 8px",cursor:"pointer"}}>✕</button>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        );
      }

      function PontoPage({ colabAPI, empresaId, isAdmin }) {
        const hoje = new Date();
        const mesAtual = `${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,'0')}`;
        const [mes, setMes] = React.useState(mesAtual);
        const [lista, setLista] = React.useState([]);
        const [loading, setLoading] = React.useState(true);
        const [status, setStatus] = React.useState(null);
        const [csvStatus, setCsvStatus] = React.useState(null);
        const [editando, setEditando] = React.useState(null); // {id, campo, valor}

        const hhmmToMin = str => { if(!str||str==="00:00") return 0; const [h,m]=str.split(":"); return parseInt(h)*60+parseInt(m||0); };
        const horVal = h => h && h !== "" && h !== "00:00";

        const carregar = async () => {
          if(!empresaId) return;
          setLoading(true);
          const ini = mes + "-01";
          const [_a, _m] = mes.split('-');
          const ultimoDia = new Date(parseInt(_a), parseInt(_m), 0).getDate();
          const fim = `${mes}-${String(ultimoDia).padStart(2,'0')}`;
          const {data, error} = await _supa.from('registros_ponto').select('*').eq('empresa_id',empresaId).gte('data',ini).lte('data',fim).order('colaborador_nome').order('data');
          if(!error) setLista(data||[]);
          setLoading(false);
        };

        React.useEffect(()=>{ carregar(); },[empresaId,mes]);

        const salvarStatus = async (id, novoStatus) => {
          const {error} = await _supa.from('registros_ponto').update({status_manual:novoStatus||null,atualizado_em:new Date().toISOString()}).eq('id',id);
          if(error){ setStatus({ok:false,msg:'❌ Erro ao atualizar status: '+error.message}); return; }
          setLista(prev=>prev.map(r=>r.id===id?{...r,status_manual:novoStatus||null}:r));
        };

        const salvarPontoManual = async (id, campo, valor) => {
          const {error} = await _supa.from('registros_ponto').update({[campo]:valor,fonte:'editado',atualizado_em:new Date().toISOString()}).eq('id',id);
          if(error){ setStatus({ok:false,msg:'❌ Erro ao salvar: '+error.message}); return; }
          setLista(prev=>prev.map(r=>r.id===id?{...r,[campo]:valor,fonte:'editado'}:r));
          setEditando(null);
        };

        const handleCsvUpload = e => {
          const file = e.target.files[0];
          if(!file) return;
          const reader = new FileReader();
          reader.onload = async ev => {
            try {
              const text = new TextDecoder("iso-8859-1").decode(new Uint8Array(ev.target.result));
              const empMap = parsePontoDetalhado(text);
              setCsvStatus({ok:null, msg:"⏳ Salvando ponto no banco..."});
              const r = await upsertRegistrosPonto(empMap, empresaId);
              setCsvStatus({ok:true, msg:`✅ ${r.count} registros salvos/atualizados.`});
              carregar();
            } catch(err) { setCsvStatus({ok:false, msg:"❌ "+err.message}); }
          };
          reader.readAsArrayBuffer(file);
          e.target.value = "";
        };

        // Agrupado por funcionário
        const porColab = lista.reduce((acc,r)=>{
          if(!acc[r.colaborador_nome]) acc[r.colaborador_nome]=[];
          acc[r.colaborador_nome].push(r);
          return acc;
        },{});

        const STATUS_OPTS = [
          {v:"",l:"Auto"},
          {v:"atestado",l:"Atestado"},
          {v:"atestado_meio",l:"Atestado ½ Per."},
          {v:"abono",l:"Abono"},
          {v:"ferias",l:"Férias"},
          {v:"folga",l:"Folga"},
        ];

        return (
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
              <div>
                <div style={{fontSize:20,fontWeight:800,color:C.pri}}>📋 Banco de Ponto</div>
                <div style={{fontSize:13,color:C.muted}}>Registros acumulados do ponto eletrônico</div>
              </div>
              <label style={{...s.btn,cursor:"pointer"}}>
                ⬆️ Importar CSV
                <input type="file" accept=".csv" style={{display:"none"}} onChange={handleCsvUpload}/>
              </label>
            </div>

            {csvStatus&&<div style={{...s.card,background:csvStatus.ok===true?'#DCFCE7':csvStatus.ok===false?'#FEE2E2':'#EFF6FF',color:csvStatus.ok===true?'#166534':csvStatus.ok===false?'#991B1B':'#1D4ED8',margin:"12px 0"}}>{csvStatus.msg}</div>}
            {status&&<div style={{...s.card,background:status.ok===true?'#DCFCE7':'#FEE2E2',color:status.ok===true?'#166534':'#991B1B',margin:"12px 0",cursor:'pointer'}} onClick={()=>setStatus(null)}>{status.msg} <span style={{opacity:0.5,fontSize:11}}>✕</span></div>}

            <div style={{...s.card,display:"flex",gap:12,alignItems:"flex-end",marginBottom:16}}>
              <div>
                <label style={s.label}>Mês</label>
                <input type="month" value={mes} onChange={e=>setMes(e.target.value)} style={s.input}/>
              </div>
              <div style={{fontSize:13,color:C.muted}}>{lista.length} registros encontrados</div>
            </div>

            {loading?(
              <div style={{...s.card,textAlign:"center",padding:"32px",color:C.muted}}>Carregando...</div>
            ):Object.entries(porColab).length===0?(
              <div style={{...s.card,textAlign:"center",padding:"40px",color:C.muted}}>
                <div style={{fontSize:32,marginBottom:8}}>📋</div>
                <div>Nenhum registro de ponto para este mês.</div>
                <div style={{fontSize:12,marginTop:4}}>Importe um CSV do ponto ou carregue pelo módulo VT ou Folha.</div>
              </div>
            ):(
              Object.entries(porColab).map(([nome, dias])=>(
                <div key={nome} style={{...s.card,padding:0,overflow:"hidden",marginBottom:12}}>
                  <div style={{background:C.pri,color:"#fff",padding:"10px 16px",fontWeight:700,fontSize:13}}>
                    👤 {nome} — {dias.length} dias
                  </div>
                  <div style={{overflowX:"auto"}}>
                    <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                      <thead><tr style={{background:"var(--c-subtle)"}}>
                        <th style={s.th}>Data</th>
                        <th style={s.thC}>E1</th><th style={s.thC}>S1</th><th style={s.thC}>E2</th><th style={s.thC}>S2</th>
                        <th style={s.thC}>B1</th><th style={s.thC}>B2</th><th style={s.thC}>B3</th><th style={s.thC}>B4</th>
                        <th style={s.thC}>H.Extra</th>
                        <th style={{...s.th,minWidth:120}}>Status</th>
                        <th style={s.th}>Fonte</th>
                      </tr></thead>
                      <tbody>
                        {dias.map((r,i)=>{
                          const dt = new Date(r.data+'T12:00:00');
                          const dow = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][dt.getDay()];
                          const temBatida = horVal(r.real_b1)||horVal(r.real_b2)||horVal(r.real_b3)||horVal(r.real_b4);
                          const temPrev = horVal(r.previsto_e1)||horVal(r.previsto_s1);
                          const isFalta = temPrev && !temBatida && !r.status_manual;
                          const foiEditado = r.fonte==='editado';
                          const editandoEste = (campo) => editando?.id===r.id && editando?.campo===campo;
                          const CelulaBatida = ({campo, valor}) => {
                            if(editandoEste(campo)){
                              return(
                                <td style={{...s.tdC,padding:'2px'}}>
                                  <input autoFocus type="text" defaultValue={valor||''} placeholder="HH:MM"
                                    style={{width:52,fontSize:11,border:`1.5px solid ${C.acc}`,borderRadius:4,padding:'2px 4px',textAlign:'center'}}
                                    onBlur={e=>salvarPontoManual(r.id,campo,e.target.value.trim())}
                                    onKeyDown={e=>{if(e.key==='Enter')e.target.blur();if(e.key==='Escape')setEditando(null);}}
                                  />
                                </td>
                              );
                            }
                            return(
                              <td style={{...s.tdC,color:horVal(valor)?C.text:C.muted,fontWeight:horVal(valor)?600:400,
                                cursor:isAdmin?'pointer':undefined,
                                background:isAdmin&&horVal(valor)?'transparent':undefined}}
                                title={isAdmin?'Clique para editar':undefined}
                                onClick={isAdmin?()=>setEditando({id:r.id,campo,valor:valor||''}):undefined}>
                                {valor||'—'}
                                {isAdmin&&horVal(valor)&&<span style={{fontSize:8,color:C.muted,marginLeft:2}}>✏️</span>}
                              </td>
                            );
                          };
                          return (
                            <tr key={r.id} style={{borderTop:`1px solid ${C.border}`,background:foiEditado?"#FFFBEB":isFalta?"#FFF0F0":i%2===0?"#fff":"#FAFAFA"}}>
                              <td style={{...s.td,fontWeight:600}}>{dt.toLocaleDateString('pt-BR')} <span style={{fontSize:10,color:C.muted}}>{dow}</span></td>
                              <td style={{...s.tdC,color:C.muted,fontSize:11}}>{r.previsto_e1||"—"}</td>
                              <td style={{...s.tdC,color:C.muted,fontSize:11}}>{r.previsto_s1||"—"}</td>
                              <td style={{...s.tdC,color:C.muted,fontSize:11}}>{r.previsto_e2||"—"}</td>
                              <td style={{...s.tdC,color:C.muted,fontSize:11}}>{r.previsto_s2||"—"}</td>
                              <CelulaBatida campo="real_b1" valor={r.real_b1}/>
                              <CelulaBatida campo="real_b2" valor={r.real_b2}/>
                              <CelulaBatida campo="real_b3" valor={r.real_b3}/>
                              <CelulaBatida campo="real_b4" valor={r.real_b4}/>
                              <td style={{...s.tdC,color:hhmmToMin(r.hora_extra)>0?C.green:C.muted,fontWeight:hhmmToMin(r.hora_extra)>0?700:400}}>{r.hora_extra||"00:00"}</td>
                              <td style={s.td}>
                                <select value={r.status_manual||""} onChange={e=>salvarStatus(r.id,e.target.value)}
                                  style={{fontSize:11,border:`1px solid ${C.border}`,borderRadius:4,padding:"2px 4px",
                                    background:r.status_manual==="atestado"?"#FFF7ED":r.status_manual==="atestado_meio"?"#FEF3C7":r.status_manual==="abono"?"#EFF6FF":r.status_manual?"#F0FFF4":"#fff"}}>
                                  {STATUS_OPTS.map(o=>(<option key={o.v} value={o.v}>{o.l}</option>))}
                                </select>
                                {isFalta&&<span style={{marginLeft:4,fontSize:10,color:C.danger,fontWeight:700}}>FALTA</span>}
                              </td>
                              <td style={{...s.td,fontSize:10,color:foiEditado?'#92400E':C.muted,fontWeight:foiEditado?700:400}}>
                                {foiEditado?'✏️ editado':'csv'}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              ))
            )}
          </div>
        );
      }

      // ============================================================
      // MÓDULO TERMOS DE ASSINATURA
      // ============================================================
      function TermosPage({ empresaId, colabAPI }) {
        const [termos, setTermos] = React.useState([]);
        const [loading, setLoading] = React.useState(true);
        const [status, setStatus] = React.useState(null);
        const [mostrarForm, setMostrarForm] = React.useState(false);
        const VAZIO = {nome:'',descricao:''};
        const [form, setForm] = React.useState(VAZIO);
        const [saving, setSaving] = React.useState(false);
        const [stats, setStats] = React.useState({});

        const carregar = async () => {
          setLoading(true);
          const {data:tdData} = await _supa.from('termos_assinatura').select('*').eq('empresa_id',empresaId).order('ordem');
          setTermos(tdData||[]);
          const {data:ctData} = await _supa.from('colaborador_termos').select('termo_id,assinado').eq('empresa_id',empresaId);
          const m = {};
          (ctData||[]).forEach(ct=>{
            if(!m[ct.termo_id]) m[ct.termo_id]={assinados:0,total:0};
            m[ct.termo_id].total++;
            if(ct.assinado) m[ct.termo_id].assinados++;
          });
          setStats(m);
          setLoading(false);
        };

        React.useEffect(()=>{ carregar(); },[empresaId]);

        const salvar = async () => {
          if(!form.nome.trim()){ setStatus({ok:false,msg:'Nome é obrigatório.'}); return; }
          setSaving(true); setStatus(null);
          const {error} = await _supa.from('termos_assinatura').insert({
            empresa_id:empresaId,
            nome:form.nome.trim(),
            descricao:form.descricao.trim()||null,
            ativo:true,
            ordem:(termos.length+1),
          });
          if(error){ setStatus({ok:false,msg:'❌ '+error.message}); }
          else { setStatus({ok:true,msg:'✅ Termo criado com sucesso.'}); setMostrarForm(false); setForm(VAZIO); await carregar(); }
          setSaving(false);
        };

        const toggleAtivo = async t => {
          await _supa.from('termos_assinatura').update({ativo:!t.ativo}).eq('id',t.id);
          await carregar();
        };

        const excluir = async t => {
          if(t.campo_legado){ setStatus({ok:false,msg:'⚠️ Termos do sistema não podem ser excluídos. Você pode pausá-los.'}); return; }
          if(!await confirmar(`Excluir "${t.nome}"? Todos os registros de assinatura deste termo serão removidos.`,'Excluir Termo')) return;
          await _supa.from('termos_assinatura').delete().eq('id',t.id);
          await carregar();
        };

        const totalColab = (colabAPI||[]).length;

        return (
          <div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
              <div>
                <div style={{fontSize:20,fontWeight:800,color:C.pri}}>📝 Termos de Assinatura</div>
                <div style={{fontSize:13,color:C.muted}}>Gerencie os documentos que os colaboradores precisam assinar</div>
              </div>
              <button style={s.btn} onClick={()=>{setMostrarForm(true);setForm(VAZIO);setStatus(null);}}>+ Novo Termo</button>
            </div>

            {status&&<div style={{...s.card,background:status.ok?'#DCFCE7':'#FEE2E2',color:status.ok?'#166534':'#991B1B',margin:'12px 0',cursor:'pointer'}} onClick={()=>setStatus(null)}>{status.msg} <span style={{opacity:0.5,fontSize:11}}>✕</span></div>}

            {mostrarForm&&(
              <div style={{...s.card,border:'2px solid '+C.acc,marginBottom:16}}>
                <div style={{fontWeight:700,fontSize:14,color:C.pri,marginBottom:14}}>➕ Novo Termo</div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0 20px'}}>
                  <div style={{marginBottom:14}}>
                    <label style={s.label}>Nome do Termo *</label>
                    <input style={s.input} value={form.nome} onChange={e=>setForm(p=>({...p,nome:e.target.value}))} placeholder="Ex: Termo de Uso de Equipamento" autoFocus/>
                  </div>
                  <div style={{marginBottom:14}}>
                    <label style={s.label}>Descrição (opcional)</label>
                    <input style={s.input} value={form.descricao} onChange={e=>setForm(p=>({...p,descricao:e.target.value}))} placeholder="Breve descrição do documento..."/>
                  </div>
                </div>
                <div style={{display:'flex',gap:10}}>
                  <button style={s.btn} onClick={salvar} disabled={saving}>{saving?'Salvando...':'💾 Salvar Termo'}</button>
                  <button style={s.btnOutline} onClick={()=>setMostrarForm(false)}>Cancelar</button>
                </div>
              </div>
            )}

            {loading?(
              <div style={{...s.card,color:C.muted,textAlign:'center',padding:32}}>Carregando termos...</div>
            ):(
              <div style={s.card}>
                <div style={{display:'flex',gap:20,marginBottom:16}}>

      // ============================================================
      // MÓDULO FOLHA DE PAGAMENTO
      // ============================================================
      function FolhaPage({ colabAPI, setColabAPI, empresaId, valorDSR }) {
        const dsrUnitario = parseFloat(String(valorDSR||"7,20").replace(",",".")) || 7.20;

        const hoje = new Date();
        const [mesAno, setMesAno] = useState(()=>{
          const m = hoje.getMonth()+1; const y = hoje.getFullYear();
          return `${String(m).padStart(2,"0")}/${y}`;
        });
        const [folhaData, setFolhaData] = useState({});
        const [marcacoes, setMarcacoes] = useState(()=>{ try{return JSON.parse(localStorage.getItem("rh_folha_marc")||"{}");}catch(e){return {};} });
        const [feriados, setFeriados] = useState(()=>{ try{return JSON.parse(localStorage.getItem("rh_feriados")||"[]");}catch(e){return [];} });
        const [ajustes, setAjustes] = useState(()=>{ try{return JSON.parse(localStorage.getItem("rh_folha_ajustes")||"{}");}catch(e){return {};} });
        const [csvStatus, setCsvStatus] = useState(null);
        const [saveStatus, setSaveStatus] = useState(null);
        const [adiantSupa, setAdiantSupa] = useState({});
        const [adiantFixosSupa, setAdiantFixosSupa] = useState({});
        const [comprasSupa, setComprasSupa] = useState({});
        const [drag, setDrag] = useState(false);
        const [colabSelecionado, setColabSelecionado] = useState(null);
        const [showRegras, setShowRegras] = useState(false);
        const [folhaTab, setFolhaTab] = useState("contabilidade");
        const [historicoFolha, setHistoricoFolha] = useState([]);
        const [loadingHistFolha, setLoadingHistFolha] = useState(false);
        const [terminadosMap, setTerminadosMap] = useState({});
        const [excluidos, setExcluidos] = useState(()=>{ try{return new Set(JSON.parse(localStorage.getItem('rh_folha_excluidos_'+mesAno)||'[]'));}catch(e){return new Set();} });
        const [comissoesMap, setComissoesMap] = useState({});

        useEffect(()=>{localStorage.setItem("rh_folha_marc",JSON.stringify(marcacoes));},[marcacoes]);
        useEffect(()=>{localStorage.setItem("rh_feriados",JSON.stringify(feriados));},[feriados]);
        useEffect(()=>{localStorage.setItem("rh_folha_ajustes",JSON.stringify(ajustes));},[ajustes]);
        useEffect(()=>{ try{setExcluidos(new Set(JSON.parse(localStorage.getItem('rh_folha_excluidos_'+mesAno)||'[]')));}catch(e){setExcluidos(new Set());} },[mesAno]);
        useEffect(()=>{ localStorage.setItem('rh_folha_excluidos_'+mesAno,JSON.stringify([...excluidos])); },[excluidos,mesAno]);
        useEffect(()=>{
          async function _loadComissoes(){
            const [m,a]=mesAno.split('/').map(Number);
            const fim=new Date(a,m-1,25).toISOString().split('T')[0];
            const {data}=await _supa.from('comissoes_mensais').select('colaborador_nome,valor_total').eq('empresa_id',empresaId).eq('data_fim',fim);
            const map={};
            (data||[]).forEach(c=>{map[c.colaborador_nome]=(c.valor_total||0);});
            setComissoesMap(map);
          }
          _loadComissoes();
        },[mesAno,empresaId]);

        useEffect(()=>{
          if(!empresaId) return;
          // Reset stale data before reloading so switching month/empresa never shows stale values
          setAdiantSupa({});
          setAdiantFixosSupa({});
          setComprasSupa({});
          const mesR = mesAno.split('/').reverse().join('-');
          const norm = (n)=>String(n||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
          _supa.from('adiantamentos').select('id,colaborador_nome,valor').eq('empresa_id',empresaId).eq('mes_referencia',mesR).eq('status','pendente').then(({data})=>{
            const mapa = {};
            (data||[]).forEach(a=>{
              const k = norm(a.colaborador_nome);
              if(!mapa[k]) mapa[k]={valor:0,ids:[]};
              mapa[k].valor += Number(a.valor);
              mapa[k].ids.push(a.id);
            });
            setAdiantSupa(mapa);
          }).catch(err=>console.error('adiantamentos load error:',err));
          _supa.from('colaboradores').select('nome,data_encerramento').eq('empresa_id',empresaId).eq('ativo',false).not('data_encerramento','is',null).then(({data})=>{
            const m={};
            (data||[]).forEach(c=>{ if(c.nome) m[normalizarNome(c.nome)]=c.data_encerramento; });
            setTerminadosMap(m);
          }).catch(()=>{});
          _supa.from('adiantamentos_fixos').select('colaborador_nome,valor').eq('empresa_id',empresaId).eq('ativo',true).then(({data})=>{
            const mapa = {};
            (data||[]).forEach(f=>{
              const k = norm(f.colaborador_nome);
              if(!mapa[k]) mapa[k]={valor:0};
              mapa[k].valor += Number(f.valor);
            });
            setAdiantFixosSupa(mapa);
          }).catch(err=>console.error('adiantamentos_fixos load error:',err));
          _supa.from('compras').select('id,colaborador_nome,valor').eq('empresa_id',empresaId).eq('mes_referencia',mesR).eq('status','pendente').then(({data})=>{
            const mapa = {};
            (data||[]).forEach(c=>{
              const k = norm(c.colaborador_nome);
              if(!mapa[k]) mapa[k]={valor:0,ids:[]};
              mapa[k].valor += Number(c.valor);
              mapa[k].ids.push(c.id);
            });
            setComprasSupa(mapa);
          }).catch(err=>console.error('compras load error:',err));
          // Carrega registros de ponto do Supabase para o período
          const [mes2, ano2] = mesAno.split("/").map(Number);
          const iniISO = `${ano2}-${String(mes2-1||12).padStart(2,'0')}-26`;
          const fimISO = `${ano2}-${String(mes2).padStart(2,'0')}-25`;
          _supa.from('registros_ponto').select('*').eq('empresa_id',empresaId).gte('data',iniISO).lte('data',fimISO).then(({data:rp})=>{
            if(!rp||rp.length===0) return;
            const empMap = {};
            rp.forEach(r=>{
              if(!empMap[r.colaborador_nome]) empMap[r.colaborador_nome]={cracha:r.cracha,nome:r.colaborador_nome,dias:{}};
              empMap[r.colaborador_nome].dias[r.data]={
                data:r.data,
                previsto:{e1:r.previsto_e1,s1:r.previsto_s1,e2:r.previsto_e2,s2:r.previsto_s2},
                real:{b1:r.real_b1,b2:r.real_b2,b3:r.real_b3,b4:r.real_b4},
                horaExtra:r.hora_extra,
                statusManual:r.status_manual||null
              };
            });
            setFolhaData(prev => {
              const merged = {...empMap};
              Object.entries(prev||{}).forEach(([nome,d])=>{
                if(!merged[nome]) merged[nome]=d;
                else merged[nome]={...merged[nome],dias:{...empMap[nome]?.dias,...d.dias}};
              });
              return merged;
            });
          }).catch(err=>console.error('registros_ponto load error:',err));
        },[empresaId,mesAno]);

        const [mes, ano] = mesAno.split("/").map(n=>parseInt(n));
        const dataIni = new Date(ano, mes-2, 26);
        const dataFim = new Date(ano, mes-1, 25);
        const periodoLabel = `${String(dataIni.getDate()).padStart(2,"0")}/${String(dataIni.getMonth()+1).padStart(2,"0")}/${dataIni.getFullYear()} a ${String(dataFim.getDate()).padStart(2,"0")}/${String(dataFim.getMonth()+1).padStart(2,"0")}/${dataFim.getFullYear()}`;

        const datasPeriodo = [];
        const d = new Date(dataIni);
        while (d <= dataFim) { datasPeriodo.push(toISO(new Date(d))); d.setDate(d.getDate()+1); }

        // ---- Helpers de nome e data ----
        const normalizarNome = (n) => {
          if (!n) return "";
          return String(n)
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // remove acentos
            .toUpperCase()
            .replace(/\s+/g, " ")
            .trim();
        };

        // ---- Feriados nacionais brasileiros (cálculo da Páscoa + fixos) ----
        const calcularFeriadosBR = (ano) => {
          // Algoritmo de Meeus/Jones/Butcher para Páscoa
          const a = ano % 19;
          const b = Math.floor(ano / 100);
          const c = ano % 100;
          const d = Math.floor(b / 4);
          const e = b % 4;
          const f = Math.floor((b + 8) / 25);
          const g = Math.floor((b - f + 1) / 3);
          const h = (19*a + b - d - g + 15) % 30;
          const i = Math.floor(c / 4);
          const k = c % 4;
          const l = (32 + 2*e + 2*i - h - k) % 7;
          const m = Math.floor((a + 11*h + 22*l) / 451);
          const mes = Math.floor((h + l - 7*m + 114) / 31);
          const dia = ((h + l - 7*m + 114) % 31) + 1;
          const pascoa = new Date(ano, mes-1, dia);
          const addDias = (d, n) => { const r = new Date(d); r.setDate(r.getDate()+n); return r; };
          const fmt = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
          return {
            [`${ano}-01-01`]: "Confraternização Universal",
            [fmt(addDias(pascoa,-48))]: "Segunda de Carnaval",
            [fmt(addDias(pascoa,-47))]: "Terça de Carnaval",
            [fmt(addDias(pascoa,-2))]: "Sexta-Feira Santa",
            [`${ano}-04-21`]: "Tiradentes",
            [`${ano}-05-01`]: "Dia do Trabalho",
            [fmt(addDias(pascoa,60))]: "Corpus Christi",
            [`${ano}-09-07`]: "Independência do Brasil",
            [`${ano}-10-12`]: "Nossa Sra. Aparecida",
            [`${ano}-11-02`]: "Finados",
            [`${ano}-11-15`]: "Proclamação da República",
            [`${ano}-11-20`]: "Consciência Negra",
            [`${ano}-12-25`]: "Natal"
          };
        };

        // Auto-preencher feriados nacionais ao mudar mês/ano (só adiciona, preserva existentes)
        const [anosFeriadosCarregados, setAnosFeriadosCarregados] = useState(()=>{
          try { return JSON.parse(localStorage.getItem("rh_anos_feriados")||"[]"); } catch(e) { return []; }
        });
        useEffect(()=>{ localStorage.setItem("rh_anos_feriados", JSON.stringify(anosFeriadosCarregados)); }, [anosFeriadosCarregados]);

        useEffect(()=>{
          // Garante que feriados nacionais do ano e ano-1 SEMPRE estejam na lista,
          // independente da flag de "anos carregados". Evita situações em que um feriado
          // nacional fica de fora (ex: Terça de Carnaval) e cai como falta indevida.
          const anosPrecisos = [ano-1, ano];
          const novosFeriados = {};
          anosPrecisos.forEach(y => Object.assign(novosFeriados, calcularFeriadosBR(y)));
          setFeriados(prev => {
            const set = new Set(prev);
            let changed = false;
            Object.keys(novosFeriados).forEach(iso => { if(!set.has(iso)){ set.add(iso); changed = true; } });
            return changed ? Array.from(set).sort() : prev;
          });
          const anosFaltando = anosPrecisos.filter(y => !anosFeriadosCarregados.includes(y));
          if(anosFaltando.length) setAnosFeriadosCarregados(prev => [...new Set([...prev, ...anosFaltando])]);
        }, [ano]);

        // ---- Detectar período do CSV importado ----
        const csvPeriodoSugerido = (()=>{
          const todasDatas = Object.values(folhaData).flatMap(e => Object.keys(e.dias||{}));
          if (todasDatas.length === 0) return null;
          const sorted = todasDatas.sort();
          const primeira = sorted[0]; // yyyy-mm-dd
          const ultima = sorted[sorted.length - 1];
          const [uY, uM] = ultima.split("-");
          return { primeira, ultima, mesAnoSugerido: `${uM}/${uY}` };
        })();

        const periodoBate = !csvPeriodoSugerido || csvPeriodoSugerido.mesAnoSugerido === mesAno;

        const handleFile = useCallback((file)=>{
          if (!file) return;
          if (!file.name.toLowerCase().endsWith(".csv")) {
            setCsvStatus({ok:false, msg:"Selecione um arquivo .csv do ponto."});
            return;
          }
          const reader = new FileReader();
          reader.onload = (e)=>{
            try {
              const bytes = new Uint8Array(e.target.result);
              const text = new TextDecoder("iso-8859-1").decode(bytes);
              const data = parsePontoDetalhado(text);
              setFolhaData(data);
              setCsvStatus({ok:true, msg:`✅ Ponto importado: ${Object.keys(data).length} colaboradores. Salvando no banco...`});
              upsertRegistrosPonto(data, empresaId).then(r=>{
                setCsvStatus({ok:true, msg:`✅ Ponto importado: ${Object.keys(data).length} colaboradores | 🗄️ ${r.count} registros salvos.`});
              }).catch(err=>{
                setCsvStatus({ok:false, msg:"Erro ao salvar ponto: " + err.message});
              });
            } catch(err) {
              setCsvStatus({ok:false, msg:"Erro: " + err.message});
            }
          };
          reader.readAsArrayBuffer(file);
        }, [empresaId]);

        const onDropFolha = useCallback((e)=>{ e.preventDefault(); setDrag(false); handleFile(e.dataTransfer.files[0]); }, [handleFile]);

        const hhmmToMin = (str)=>{
          if (!str || str === "00:00") return 0;
          const parts = str.split(":");
          return parseInt(parts[0])*60 + parseInt(parts[1]||0);
        };
        const minToHHMM = (min)=>{
          if (!min || min < 0) return "00:00";
          const h = Math.floor(min/60);
          const m = min%60;
          return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
        };

        const analisarDia = (nomeKey, iso, diaDados, colabInfo)=>{
          // nomeKey vem normalizado para buscar em marcacoes
          const marc = marcacoes[nomeKey]?.[iso];
          const isFeriado = feriados.includes(iso);
          const horarioValido = (h)=> h && h !== "" && h !== "00:00";
          const temPrevisao = diaDados && (horarioValido(diaDados.previsto.e1) || horarioValido(diaDados.previsto.s1) || horarioValido(diaDados.previsto.e2) || horarioValido(diaDados.previsto.s2));
          const temBatida = diaDados && (horarioValido(diaDados.real.b1) || horarioValido(diaDados.real.b2) || horarioValido(diaDados.real.b3) || horarioValido(diaDados.real.b4));
          // Jornada do colaborador (SEG-SEX = 5x2 não trabalha sábado, SEG-SAB = 6x1 padrão).
          // Se não houver info, assume SEG-SAB (todos os dias úteis previstos contam).
          const jornada = colabInfo?.jornada || "SEG-SAB";
          // Dia da semana (0=Dom..6=Sáb). Usar T12:00:00 para evitar offset de timezone.
          const dow = new Date(iso + "T12:00:00").getDay();
          // Domingo nunca conta como dia previsto (afasta qualquer batida residual ou previsão fantasma).
          if (dow === 0) return {status:"nao_previsto", diaUtilPrevisto: false};
          // Se jornada é SEG-SEX e dia é sábado, NUNCA gera falta — fora da escala.
          if (jornada === "SEG-SEX" && dow === 6) {
            if (temBatida) return {status:"trabalhou", diaUtilPrevisto: false};
            return {status:"nao_previsto", diaUtilPrevisto: false};
          }
          if (marc === "ferias") return {status:"ferias", diaUtilPrevisto: !!temPrevisao};
          if (marc === "atestado") return {status:"atestado", diaUtilPrevisto: !!temPrevisao};
          if (marc === "atestado_meio") return {status:"atestado_meio", diaUtilPrevisto: !!temPrevisao};
          if (marc === "abono") return {status:"abono", diaUtilPrevisto: !!temPrevisao};
          if (marc === "folga") return {status:"folga", diaUtilPrevisto: !!temPrevisao};
          // Verificar status_manual vindo do banco de ponto
          const smDb = diaDados?.statusManual;
          if (smDb === "atestado") return {status:"atestado", diaUtilPrevisto: !!temPrevisao};
          if (smDb === "atestado_meio") return {status:"atestado_meio", diaUtilPrevisto: !!temPrevisao};
          if (smDb === "abono") return {status:"abono", diaUtilPrevisto: !!temPrevisao};
          if (smDb === "ferias") return {status:"ferias", diaUtilPrevisto: !!temPrevisao};
          if (smDb === "folga") return {status:"folga", diaUtilPrevisto: !!temPrevisao};
          if (isFeriado) return {status:"feriado", diaUtilPrevisto: !!temPrevisao};
          if (!temPrevisao) return {status:"nao_previsto", diaUtilPrevisto: false};
          if (temBatida) return {status:"trabalhou", diaUtilPrevisto: true};
          return {status:"falta", diaUtilPrevisto: true};
        };

        const calcularColab = useCallback((nomeKey, dados, colabInfo)=>{
          let diasTrabalhados=0, faltas=0, atestados=0, atestadosMeio=0, ferias=0, folgas=0, abonos=0;
          let horasExtrasMin=0, horasFaltasMin=0;
          let atrasosInjustificados=0;
          const diasFaltas = [];
          // Data de fim da experiência (col I = EXPERIÊNCIA 90 DIAS)
          const fimExperiencia = colabInfo?.experiencia90 ? new Date(colabInfo.experiencia90 + "T12:00:00") : null;

          datasPeriodo.forEach(iso=>{
            const diaDados = dados?.dias?.[iso];
            const a = analisarDia(nomeKey, iso, diaDados, colabInfo);
            if (a.status === "trabalhou") {
              diasTrabalhados++;
              if (diaDados?.horaExtra) horasExtrasMin += hhmmToMin(diaDados.horaExtra);
              if (diaDados) {
                const prevMin = (hhmmToMin(diaDados.previsto.s1)-hhmmToMin(diaDados.previsto.e1)) +
                                (hhmmToMin(diaDados.previsto.s2)-hhmmToMin(diaDados.previsto.e2));
                const realMin = ((hhmmToMin(diaDados.real.b2)-hhmmToMin(diaDados.real.b1)) || 0) +
                                ((hhmmToMin(diaDados.real.b4)-hhmmToMin(diaDados.real.b3)) || 0);
                if (realMin > 0 && prevMin > realMin) horasFaltasMin += (prevMin - realMin);
                // Atraso injustificado (> 10 min de tolerância)
                const prevE1 = hhmmToMin(diaDados.previsto.e1);
                const realB1 = hhmmToMin(diaDados.real.b1);
                if (prevE1 > 0 && realB1 > 0 && realB1 > prevE1 + 10) atrasosInjustificados++;
              }
            } else if (a.status === "falta") {
              faltas++;
              diasFaltas.push(iso.split("-").reverse().join("/"));
            } else if (a.status === "atestado") { atestados++; }
            else if (a.status === "atestado_meio") { diasTrabalhados++; atestadosMeio++; }
            else if (a.status === "abono")  { abonos++; }
            else if (a.status === "ferias") { ferias++; }
            else if (a.status === "folga")  { folgas++; }
          });

          let dsrPerdidos = 0, feriadosNaSemanaPerdidos = 0;
          const semanasMap = {};
          datasPeriodo.forEach(iso=>{
            const dd = new Date(iso+"T12:00:00");
            const dayOfWeek = dd.getDay();
            const domingo = new Date(dd);
            domingo.setDate(dd.getDate() - dayOfWeek);
            const semKey = toISO(domingo);
            if (!semanasMap[semKey]) semanasMap[semKey] = [];
            semanasMap[semKey].push(iso);
          });
          Object.keys(semanasMap).forEach(semKey=>{
            const isosSemana = semanasMap[semKey];
            let temFaltaSemana = false;
            isosSemana.forEach(iso=>{
              const a = analisarDia(nomeKey, iso, dados?.dias?.[iso], colabInfo);
              if (a.status === "falta") temFaltaSemana = true;
            });
            if (temFaltaSemana) {
              dsrPerdidos += 1;
              isosSemana.forEach(iso=>{
                if (feriados.includes(iso)) feriadosNaSemanaPerdidos += 1;
              });
            }
            // abono não gera perda de DSR (já tratado pelo status diferente de "falta")
          });

          // CAJU: só recebe dias trabalhados + atestados + férias que sejam APÓS experiência
          let diasUteisPrevistos = 0;
          let cajuDias = 0;
          let diasEmExperiencia = 0;
          datasPeriodo.forEach(iso=>{
            const diaDados = dados?.dias?.[iso];
            const horarioValido = (h)=> h && h !== "" && h !== "00:00";
            const temPrev = diaDados && (horarioValido(diaDados.previsto.e1) || horarioValido(diaDados.previsto.s1) || horarioValido(diaDados.previsto.e2) || horarioValido(diaDados.previsto.s2));
            if (temPrev) diasUteisPrevistos++;

            // Está em experiência neste dia?
            const dtDia = new Date(iso+"T12:00:00");
            const emExperiencia = fimExperiencia && dtDia <= fimExperiencia;
            if (emExperiencia && temPrev) diasEmExperiencia++;

            // Conta caju só se já saiu da experiência E está presente/atestado/férias (não conta falta)
            if (!emExperiencia && temPrev) {
              const a = analisarDia(nomeKey, iso, diaDados, colabInfo);
              if (a.status === "trabalhou" || a.status === "atestado" || a.status === "atestado_meio" || a.status === "ferias") {
                cajuDias++;
              }
            }
          });
          const cajuValor = cajuDias * 5;

          const aj = ajustes[nomeKey] || {};
          const produtos = parseFloat(String(aj.produtos||"").replace(",","."))||(comprasSupa[nomeKey]?.valor||0);
          const adiantAvulso = adiantSupa[nomeKey]?.valor||0;
          const adiantFixo   = adiantFixosSupa[nomeKey]?.valor||0;
          const adiantAuto   = adiantAvulso + adiantFixo;
          const adiantamento = parseFloat(String(aj.adiantamento||"").replace(",",".")) || adiantAuto;
          // Prêmio assiduidade: qualquer atraso injustificado = 0 dias; atestado/abono = perde só aquele dia
          const premioAssiduidadeDias = atrasosInjustificados > 0 ? 0 : Math.max(0, 30 - atestados - abonos);
          const premioAuto = faltas === 0 && atrasosInjustificados === 0;
          const premioAssiduidade = aj.premioAssiduidade !== undefined ? aj.premioAssiduidade : premioAuto;
          // VT: pré-selecionado se transporte > 0 na planilha
          const descontarVTAuto = (colabInfo?.transporte || 0) > 0;
          const descontarVT = aj.descontarVT !== undefined ? aj.descontarVT : descontarVTAuto;
          const bancoHoras = aj.bancoHoras !== undefined ? aj.bancoHoras : false;
          const totalDesconto = produtos + adiantamento;

          return {
            diasTrabalhados, faltas, atestados, atestadosMeio, ferias, folgas, abonos,
            feriadosPerdidos: feriadosNaSemanaPerdidos,
            horasExtras: minToHHMM(horasExtrasMin),
            horasExtrasMin,
            horasFaltas: minToHHMM(horasFaltasMin),
            horasFaltasMin,
            dsrPerdidos, diasUteisPrevistos, diasEmExperiencia,
            cajuDias, cajuValor,
            premioAssiduidade, premioAssiduidadeDias, atrasosInjustificados, descontarVT, bancoHoras,
            produtos, adiantamento, adiantAvulso, adiantFixo, adiantAuto, totalDesconto,
            diasFaltas, observacoes: aj.observacoes||"",
            emExperiencia: diasEmExperiencia > 0,
            valorTransporte: colabInfo?.transporte || 0
          };
        }, [datasPeriodo, marcacoes, feriados, ajustes]);

        const colaboradoresUnificados = (() => {
          const mapa = new Map();
          // GAS agora retorna objetos com campos padronizados (nome, funcao, setor, transporte, experiencia90, etc.)
          colabAPI.forEach(c=>{
            const nomeOriginal = c.nome || c.NOME || "";
            const nomeKey = normalizarNome(nomeOriginal);
            if (!nomeKey) return;
            mapa.set(nomeKey, {
              nomeKey,
              nome: nomeOriginal,
              funcao: c.funcao || c["FUNÇÃO"] || c.FUNCAO || "",
              setor: c.setor || c.SETOR || "",
              salario: c.salario || c["SALÁRIO"] || c.SALARIO || 0,
              transporte: c.transporte || 0,
              periculosidade: !!c.periculosidade,
              experiencia30: c.experiencia30 || "",
              experiencia90: c.experiencia90 || "",
              admissao: c.admissao || "",
              nascimento: c.nascimento || "",
              jornada: c.jornada || "SEG-SAB",
              encerramento: terminadosMap[nomeKey]||"",
              fonteCadastro: true, fonteCSV: false, dadosCSV: null
            });
          });
          Object.keys(folhaData).forEach(nomeCSV=>{
            const nomeKey = normalizarNome(nomeCSV);
            if (mapa.has(nomeKey)) {
              const ex = mapa.get(nomeKey);
              ex.fonteCSV = true;
              ex.dadosCSV = folhaData[nomeCSV];
              // Se no CSV tiver um nome um pouco diferente, mostrar o da planilha (prefere cadastro)
            } else {
              mapa.set(nomeKey, {
                nomeKey, nome: nomeCSV, funcao:"", setor:"", salario:0,
                transporte: 0, experiencia30:"", experiencia90:"", admissao:"",
                jornada: "SEG-SAB",
                encerramento: terminadosMap[nomeKey]||"",
                fonteCadastro:false, fonteCSV:true, dadosCSV: folhaData[nomeCSV]
              });
            }
          });
          return Array.from(mapa.values()).sort((a,b)=>a.nome.localeCompare(b.nome));
        })();

        const excluirDaFolha = (nomeKey) => setExcluidos(prev=>{ const n=new Set(prev); n.add(nomeKey); return n; });
        const restaurarExcluidos = () => setExcluidos(new Set());
        const comEncerramento = colaboradoresUnificados.filter(c=>c.encerramento&&!excluidos.has(c.nomeKey));
        const resultados = colaboradoresUnificados
          .filter(c=>!excluidos.has(c.nomeKey))
          .map(c=>({...c, calc: calcularColab(c.nomeKey, c.dadosCSV, c)}));

        const totais = resultados.reduce((acc,r)=>{
          acc.diasTrabalhados += r.calc.diasTrabalhados;
          acc.faltas += r.calc.faltas;
          acc.atestados += r.calc.atestados;
          acc.ferias += r.calc.ferias;
          acc.cajuValor += r.calc.cajuValor;
          acc.totalDesconto += r.calc.totalDesconto;
          acc.horasExtrasMin += r.calc.horasExtrasMin;
          return acc;
        }, {diasTrabalhados:0,faltas:0,atestados:0,ferias:0,cajuValor:0,totalDesconto:0,horasExtrasMin:0});

        const carregarHistoricoFolha = async () => {
          if (!empresaId) return;
          setLoadingHistFolha(true);
          try {
            const {data} = await _supa.from('folha_mensal')
              .select('periodo,colaborador_nome,setor,salario_bruto,salario_liquido')
              .eq('empresa_id',empresaId).order('periodo',{ascending:false}).limit(5000);
            setHistoricoFolha(data||[]);
