      function FolhaPage({ colabAPI, setColabAPI, gasUrl }) {
        const GAS_URL = gasUrl || "https://script.google.com/macros/s/AKfycbw2KhlWuitfSpPFO6Q6M6vHnK5MzaatvemNQ44Hr3zbyLT8xx9Es-tqSe_v5pi0xtAo/exec";

        const hoje = new Date();
        const [mesAno, setMesAno] = useState(()=>{
          const m = hoje.getMonth()+1; const y = hoje.getFullYear();
          return `${String(m).padStart(2,"0")}/${y}`;
        });
        const [folhaData, setFolhaData] = useState({});
        const [marcacoes, setMarcacoes] = useState(()=>{ try{return JSON.parse(localStorage.getItem("rh_folha_marc")||"{}");}catch(e){return {};} });
        const [feriados, setFeriados] = useState(()=>{ try{return JSON.parse(localStorage.getItem("rh_feriados")||"[]");}catch(e){return [];} });
        const [ajustes, setAjustes] = useState(()=>{ try{return JSON.parse(localStorage.getItem("rh_folha_ajustes")||"{}");}catch(e){return {};} });
        const [csvStatus, setCsvStatus] = useState(null);
        const [apiStatus, setApiStatus] = useState(null);
        const [saveStatus, setSaveStatus] = useState(null);
        const [drag, setDrag] = useState(false);
        const [colabSelecionado, setColabSelecionado] = useState(null);
        const [loadingAPI, setLoadingAPI] = useState(false);
        const [showRegras, setShowRegras] = useState(false);

        useEffect(()=>{localStorage.setItem("rh_folha_marc",JSON.stringify(marcacoes));},[marcacoes]);
        useEffect(()=>{localStorage.setItem("rh_feriados",JSON.stringify(feriados));},[feriados]);
        useEffect(()=>{localStorage.setItem("rh_folha_ajustes",JSON.stringify(ajustes));},[ajustes]);

        const [mes, ano] = mesAno.split("/").map(n=>parseInt(n));
        const dataIni = new Date(ano, mes-2, 26);
        const dataFim = new Date(ano, mes-1, 25);
        const periodoLabel = `${String(dataIni.getDate()).padStart(2,"0")}/${String(dataIni.getMonth()+1).padStart(2,"0")}/${dataIni.getFullYear()} a ${String(dataFim.getDate()).padStart(2,"0")}/${String(dataFim.getMonth()+1).padStart(2,"0")}/${dataFim.getFullYear()}`;

        const datasPeriodo = [];
        const d = new Date(dataIni);
        while (d <= dataFim) { datasPeriodo.push(toISO(new Date(d))); d.setDate(d.getDate()+1); }

        // ---- Helpers de nome e data ----
        const normalizarNome = (n) => {
          if (!n) return "";
          return String(n)
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // remove acentos
            .toUpperCase()
            .replace(/\s+/g, " ")
            .trim();
        };

        // ---- Feriados nacionais brasileiros (cálculo da Páscoa + fixos) ----
        const calcularFeriadosBR = (ano) => {
          // Algoritmo de Meeus/Jones/Butcher para Páscoa
          const a = ano % 19;
          const b = Math.floor(ano / 100);
          const c = ano % 100;
          const d = Math.floor(b / 4);
          const e = b % 4;
          const f = Math.floor((b + 8) / 25);
          const g = Math.floor((b - f + 1) / 3);
          const h = (19*a + b - d - g + 15) % 30;
          const i = Math.floor(c / 4);
          const k = c % 4;
          const l = (32 + 2*e + 2*i - h - k) % 7;
          const m = Math.floor((a + 11*h + 22*l) / 451);
          const mes = Math.floor((h + l - 7*m + 114) / 31);
          const dia = ((h + l - 7*m + 114) % 31) + 1;
          const pascoa = new Date(ano, mes-1, dia);
          const addDias = (d, n) => { const r = new Date(d); r.setDate(r.getDate()+n); return r; };
          const fmt = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
          return {
            [`${ano}-01-01`]: "Confraternização Universal",
            [fmt(addDias(pascoa,-48))]: "Segunda de Carnaval",
            [fmt(addDias(pascoa,-47))]: "Terça de Carnaval",
            [fmt(addDias(pascoa,-2))]: "Sexta-Feira Santa",
            [`${ano}-04-21`]: "Tiradentes",
            [`${ano}-05-01`]: "Dia do Trabalho",
            [fmt(addDias(pascoa,60))]: "Corpus Christi",
            [`${ano}-09-07`]: "Independência do Brasil",
            [`${ano}-10-12`]: "Nossa Sra. Aparecida",
            [`${ano}-11-02`]: "Finados",
            [`${ano}-11-15`]: "Proclamação da República",
            [`${ano}-11-20`]: "Consciência Negra",
            [`${ano}-12-25`]: "Natal"
          };
        };

        // Auto-preencher feriados nacionais ao mudar mês/ano (só adiciona, preserva existentes)
        const [anosFeriadosCarregados, setAnosFeriadosCarregados] = useState(()=>{
          try { return JSON.parse(localStorage.getItem("rh_anos_feriados")||"[]"); } catch(e) { return []; }
        });
        useEffect(()=>{ localStorage.setItem("rh_anos_feriados", JSON.stringify(anosFeriadosCarregados)); }, [anosFeriadosCarregados]);

        useEffect(()=>{
          const anosPrecisos = [ano-1, ano];
          const anosFaltando = anosPrecisos.filter(y => !anosFeriadosCarregados.includes(y));
          if (anosFaltando.length === 0) return;
          const novosFeriados = {};
          anosFaltando.forEach(y => Object.assign(novosFeriados, calcularFeriadosBR(y)));
          setFeriados(prev => {
            const set = new Set(prev);
            Object.keys(novosFeriados).forEach(iso => set.add(iso));
            return Array.from(set).sort();
          });
          setAnosFeriadosCarregados(prev => [...new Set([...prev, ...anosFaltando])]);
        }, [ano, anosFeriadosCarregados]);

        const buscarColaboradores = useCallback(async ()=>{
          setLoadingAPI(true);
          setApiStatus({ok:null,msg:"Buscando colaboradores e atestados na planilha..."});
          try {
            const isoIni = toISO(dataIni);
            const isoFim = toISO(dataFim);
            const res = await fetch(`${GAS_URL}?acao=folha_dados&ini=${isoIni}&fim=${isoFim}`);
            const json = await res.json();
            if (json.ok) {
              setColabAPI(json.colaboradores || []);
              // Aplicar atestados automaticamente nas marcações
              const novasMarc = { ...marcacoes };
              (json.atestados || []).forEach(at => {
                const nomeKey = at.nome; // vamos matching pelo nome normalizado no app
                const dIni = new Date(at.inicio + "T12:00:00");
                const dFim = new Date(at.fim + "T12:00:00");
                const d = new Date(dIni);
                while (d <= dFim) {
                  const iso = toISO(d);
                  if (!novasMarc[nomeKey]) novasMarc[nomeKey] = {};
                  else novasMarc[nomeKey] = { ...novasMarc[nomeKey] };
                  // Não sobrescreve férias/folgas marcadas manualmente
                  if (!novasMarc[nomeKey][iso] || novasMarc[nomeKey][iso] === "atestado") {
                    novasMarc[nomeKey][iso] = "atestado";
                  }
                  d.setDate(d.getDate()+1);
                }
              });
              setMarcacoes(novasMarc);
              const atMsg = (json.atestados || []).length > 0 ? ` · ${json.atestados.length} atestados aplicados` : "";
              setApiStatus({ok:true, msg:`✅ ${json.colaboradores?.length || 0} colaboradores carregados${atMsg}.`});
            } else {
              setApiStatus({ok:false, msg:"Erro: " + (json.msg||"desconhecido")});
            }
          } catch(err) {
            setApiStatus({ok:false, msg:"⚠️ Não foi possível acessar o Web App do GAS. Verifique se (1) a implantação foi atualizada com Nova Versão após o último deploy e (2) o acesso está como 'Qualquer pessoa'. Erro técnico: " + err.message});
          } finally {
            setLoadingAPI(false);
          }
        }, [GAS_URL, dataIni, dataFim, marcacoes]);

        // ---- Detectar período do CSV importado ----
        const csvPeriodoSugerido = (()=>{
          const todasDatas = Object.values(folhaData).flatMap(e => Object.keys(e.dias||{}));
          if (todasDatas.length === 0) return null;
          const sorted = todasDatas.sort();
          const primeira = sorted[0]; // yyyy-mm-dd
          const ultima = sorted[sorted.length - 1];
          const [uY, uM] = ultima.split("-");
          return { primeira, ultima, mesAnoSugerido: `${uM}/${uY}` };
        })();

        const periodoBate = !csvPeriodoSugerido || csvPeriodoSugerido.mesAnoSugerido === mesAno;

        const parseCSVFolha = useCallback((text)=>{
          const lines = text.trim().split(/\r?\n/);
          if (lines.length < 2) throw new Error("Arquivo vazio ou inválido");
          const header = lines[0].split(";");
          if (!header[0].includes("Crach")) throw new Error("Formato não reconhecido. Use o CSV do ponto eletrônico.");
          const empMap = {};
          for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(";").map(s=>s.trim());
            if (cols.length < 11) continue;
            const cracha = cols[0];
            const nome = cols[1];
            const dataStr = cols[2];
            if (!cracha||!nome||!dataStr) continue;
            const [dd,mm,yyyy] = dataStr.split("/");
            const iso = `${yyyy}-${mm.padStart(2,"0")}-${dd.padStart(2,"0")}`;
            const previsto = {e1: cols[3]||"", s1: cols[4]||"", e2: cols[5]||"", s2: cols[6]||""};
            const real = {b1: cols[7]||"", b2: cols[8]||"", b3: cols[9]||"", b4: cols[10]||""};
            const horaExtra = cols[11]||"00:00";
            if (!empMap[nome]) empMap[nome] = { cracha, nome, dias: {} };
            empMap[nome].dias[iso] = { data: iso, previsto, real, horaExtra };
          }
          return empMap;
        }, []);

        const handleFile = useCallback((file)=>{
          if (!file) return;
          if (!file.name.toLowerCase().endsWith(".csv")) {
            setCsvStatus({ok:false, msg:"Selecione um arquivo .csv do ponto."});
            return;
          }
          const reader = new FileReader();
          reader.onload = (e)=>{
            try {
              const bytes = new Uint8Array(e.target.result);
              const text = new TextDecoder("iso-8859-1").decode(bytes);
              const data = parseCSVFolha(text);
              setFolhaData(data);
              setCsvStatus({ok:true, msg:`✅ Ponto importado: ${Object.keys(data).length} colaboradores no CSV.`});
            } catch(err) {
              setCsvStatus({ok:false, msg:"Erro: " + err.message});
            }
          };
          reader.readAsArrayBuffer(file);
        }, [parseCSVFolha]);

        const onDropFolha = useCallback((e)=>{ e.preventDefault(); setDrag(false); handleFile(e.dataTransfer.files[0]); }, [handleFile]);

        const hhmmToMin = (str)=>{
          if (!str || str === "00:00") return 0;
          const parts = str.split(":");
          return parseInt(parts[0])*60 + parseInt(parts[1]||0);
        };
        const minToHHMM = (min)=>{
          if (!min || min < 0) return "00:00";
          const h = Math.floor(min/60);
          const m = min%60;
          return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
        };

        const analisarDia = (nomeKey, iso, diaDados)=>{
          // nomeKey vem normalizado para buscar em marcacoes
          const marc = marcacoes[nomeKey]?.[iso];
          const isFeriado = feriados.includes(iso);
          const horarioValido = (h)=> h && h !== "" && h !== "00:00";
          const temPrevisao = diaDados && (horarioValido(diaDados.previsto.e1) || horarioValido(diaDados.previsto.s1) || horarioValido(diaDados.previsto.e2) || horarioValido(diaDados.previsto.s2));
          const temBatida = diaDados && (horarioValido(diaDados.real.b1) || horarioValido(diaDados.real.b2) || horarioValido(diaDados.real.b3) || horarioValido(diaDados.real.b4));
          if (marc === "ferias") return {status:"ferias", diaUtilPrevisto: !!temPrevisao};
          if (marc === "atestado") return {status:"atestado", diaUtilPrevisto: !!temPrevisao};
          if (marc === "folga") return {status:"folga", diaUtilPrevisto: !!temPrevisao};
          if (isFeriado) return {status:"feriado", diaUtilPrevisto: !!temPrevisao};
          if (!temPrevisao) return {status:"nao_previsto", diaUtilPrevisto: false};
          if (temBatida) return {status:"trabalhou", diaUtilPrevisto: true};
          return {status:"falta", diaUtilPrevisto: true};
        };

        const calcularColab = useCallback((nomeKey, dados, colabInfo)=>{
          let diasTrabalhados=0, faltas=0, atestados=0, ferias=0, folgas=0;
          let horasExtrasMin=0, horasFaltasMin=0;
          const diasFaltas = [];
          // Data de fim da experiência (col I = EXPERIÊNCIA 90 DIAS)
          const fimExperiencia = colabInfo?.experiencia90 ? new Date(colabInfo.experiencia90 + "T12:00:00") : null;

          datasPeriodo.forEach(iso=>{
            const diaDados = dados?.dias?.[iso];
            const a = analisarDia(nomeKey, iso, diaDados);
            if (a.status === "trabalhou") {
              diasTrabalhados++;
              if (diaDados?.horaExtra) horasExtrasMin += hhmmToMin(diaDados.horaExtra);
              if (diaDados) {
                const prevMin = (hhmmToMin(diaDados.previsto.s1)-hhmmToMin(diaDados.previsto.e1)) + 
                                (hhmmToMin(diaDados.previsto.s2)-hhmmToMin(diaDados.previsto.e2));
                const realMin = ((hhmmToMin(diaDados.real.b2)-hhmmToMin(diaDados.real.b1)) || 0) +
                                ((hhmmToMin(diaDados.real.b4)-hhmmToMin(diaDados.real.b3)) || 0);
                if (realMin > 0 && prevMin > realMin) horasFaltasMin += (prevMin - realMin);
              }
            } else if (a.status === "falta") {
              faltas++;
              diasFaltas.push(iso.split("-").reverse().slice(0,2).join("/"));
            } else if (a.status === "atestado") { atestados++; }
            else if (a.status === "ferias") { ferias++; }
            else if (a.status === "folga") { folgas++; }
          });

          let dsrPerdidos = 0, feriadosNaSemanaPerdidos = 0;
          const semanasMap = {};
          datasPeriodo.forEach(iso=>{
            const dd = new Date(iso+"T12:00:00");
            const dayOfWeek = dd.getDay();
            const domingo = new Date(dd);
            domingo.setDate(dd.getDate() - dayOfWeek);
            const semKey = toISO(domingo);
            if (!semanasMap[semKey]) semanasMap[semKey] = [];
            semanasMap[semKey].push(iso);
          });
          Object.keys(semanasMap).forEach(semKey=>{
            const isosSemana = semanasMap[semKey];
            let temFaltaSemana = false;
            isosSemana.forEach(iso=>{
              const a = analisarDia(nomeKey, iso, dados?.dias?.[iso]);
              if (a.status === "falta") temFaltaSemana = true;
            });
            if (temFaltaSemana) {
              dsrPerdidos += 1;
              isosSemana.forEach(iso=>{
                if (feriados.includes(iso)) feriadosNaSemanaPerdidos += 1;
              });
            }
          });

          // CAJU: só recebe dias trabalhados + atestados + férias que sejam APÓS experiência
          let diasUteisPrevistos = 0;
          let cajuDias = 0;
          let diasEmExperiencia = 0;
          datasPeriodo.forEach(iso=>{
            const diaDados = dados?.dias?.[iso];
            const horarioValido = (h)=> h && h !== "" && h !== "00:00";
            const temPrev = diaDados && (horarioValido(diaDados.previsto.e1) || horarioValido(diaDados.previsto.s1) || horarioValido(diaDados.previsto.e2) || horarioValido(diaDados.previsto.s2));
            if (temPrev) diasUteisPrevistos++;

            // Está em experiência neste dia?
            const dtDia = new Date(iso+"T12:00:00");
            const emExperiencia = fimExperiencia && dtDia <= fimExperiencia;
            if (emExperiencia && temPrev) diasEmExperiencia++;

            // Conta caju só se já saiu da experiência E está presente/atestado/férias (não conta falta)
            if (!emExperiencia && temPrev) {
              const a = analisarDia(nomeKey, iso, diaDados);
              if (a.status === "trabalhou" || a.status === "atestado" || a.status === "ferias") {
                cajuDias++;
              }
            }
          });
          const cajuValor = cajuDias * 5;

          const aj = ajustes[nomeKey] || {};
          const produtos = parseFloat(String(aj.produtos||"").replace(",","."))||0;
          const adiantamento = parseFloat(String(aj.adiantamento||"").replace(",","."))||0;
          const premioAuto = faltas === 0;
          const premioAssiduidade = aj.premioAssiduidade !== undefined ? aj.premioAssiduidade : premioAuto;
          // VT: pré-selecionado se transporte > 0 na planilha
          const descontarVTAuto = (colabInfo?.transporte || 0) > 0;
          const descontarVT = aj.descontarVT !== undefined ? aj.descontarVT : descontarVTAuto;
          const bancoHoras = aj.bancoHoras !== undefined ? aj.bancoHoras : false;
          const totalDesconto = produtos + adiantamento;

          return {
            diasTrabalhados, faltas, atestados, ferias, folgas,
            feriadosPerdidos: feriadosNaSemanaPerdidos,
            horasExtras: minToHHMM(horasExtrasMin),
            horasExtrasMin,
            horasFaltas: minToHHMM(horasFaltasMin),
            horasFaltasMin,
            dsrPerdidos, diasUteisPrevistos, diasEmExperiencia,
            cajuDias, cajuValor,
            premioAssiduidade, descontarVT, bancoHoras,
            produtos, adiantamento, totalDesconto,
            diasFaltas, observacoes: aj.observacoes||"",
            emExperiencia: diasEmExperiencia > 0,
            valorTransporte: colabInfo?.transporte || 0
          };
        }, [datasPeriodo, marcacoes, feriados, ajustes]);

        const colaboradoresUnificados = (() => {
          const mapa = new Map();
          // GAS agora retorna objetos com campos padronizados (nome, funcao, setor, transporte, experiencia90, etc.)
          colabAPI.forEach(c=>{
            const nomeOriginal = c.nome || c.NOME || "";
            const nomeKey = normalizarNome(nomeOriginal);
            if (!nomeKey) return;
            mapa.set(nomeKey, {
              nomeKey,
              nome: nomeOriginal,
              funcao: c.funcao || c["FUNÇÃO"] || c.FUNCAO || "",
              setor: c.setor || c.SETOR || "",
              salario: c.salario || c["SALÁRIO"] || c.SALARIO || 0,
              transporte: c.transporte || 0,
              experiencia30: c.experiencia30 || "",
              experiencia90: c.experiencia90 || "",
              admissao: c.admissao || "",
              nascimento: c.nascimento || "",
              fonteCadastro: true, fonteCSV: false, dadosCSV: null
            });
          });
          Object.keys(folhaData).forEach(nomeCSV=>{
            const nomeKey = normalizarNome(nomeCSV);
            if (mapa.has(nomeKey)) {
              const ex = mapa.get(nomeKey);
              ex.fonteCSV = true;
              ex.dadosCSV = folhaData[nomeCSV];
              // Se no CSV tiver um nome um pouco diferente, mostrar o da planilha (prefere cadastro)
            } else {
              mapa.set(nomeKey, {
                nomeKey, nome: nomeCSV, funcao:"", setor:"", salario:0,
                transporte: 0, experiencia30:"", experiencia90:"", admissao:"",
                fonteCadastro:false, fonteCSV:true, dadosCSV: folhaData[nomeCSV]
              });
            }
          });
          return Array.from(mapa.values()).sort((a,b)=>a.nome.localeCompare(b.nome));
        })();

        const resultados = colaboradoresUnificados.map(c=>({...c, calc: calcularColab(c.nomeKey, c.dadosCSV, c)}));

        const totais = resultados.reduce((acc,r)=>{
          acc.diasTrabalhados += r.calc.diasTrabalhados;
          acc.faltas += r.calc.faltas;
          acc.atestados += r.calc.atestados;
          acc.ferias += r.calc.ferias;
          acc.cajuValor += r.calc.cajuValor;
          acc.totalDesconto += r.calc.totalDesconto;
          acc.horasExtrasMin += r.calc.horasExtrasMin;
          return acc;
        }, {diasTrabalhados:0,faltas:0,atestados:0,ferias:0,cajuValor:0,totalDesconto:0,horasExtrasMin:0});

        const salvarFolha = async () => {
          if (resultados.length === 0) { setSaveStatus({ok:false,msg:"Nenhum colaborador carregado."}); return; }
          setSaveStatus({ok:null, msg:"Enviando folha para a planilha..."});
          const payload = {
            tipo:"folha", periodo: mesAno,
            periodoInicio: toISO(dataIni), periodoFim: toISO(dataFim),
            colaboradores: resultados.map(r=>({
              nome: r.nome, funcao: r.funcao,
              diasTrabalhados: r.calc.diasTrabalhados,
              faltas: r.calc.faltas, atestados: r.calc.atestados,
              ferias: r.calc.ferias, folgas: r.calc.folgas,
              horasExtras: r.calc.horasExtras, horasFaltas: r.calc.horasFaltas,
              dsrPerdidos: r.calc.dsrPerdidos, feriadosPerdidos: r.calc.feriadosPerdidos,
              cajuDias: r.calc.cajuDias, cajuValor: r.calc.cajuValor,
              premioAssiduidade: r.calc.premioAssiduidade,
              descontarVT: r.calc.descontarVT,
              produtos: r.calc.produtos, adiantamento: r.calc.adiantamento,
              totalDesconto: r.calc.totalDesconto,
              bancoHoras: r.calc.bancoHoras,
              diasFaltas: r.calc.diasFaltas,
              observacoes: r.calc.observacoes
            }))
          };
          try {
            await fetch(GAS_URL, { method:"POST", mode:"no-cors", body:JSON.stringify(payload) });
            setSaveStatus({ok:true, msg:`✅ Folha ${mesAno} enviada! Verifique a aba FOLHA${ano} na planilha.`});
          } catch(err) {
            setSaveStatus({ok:false, msg:"Erro: " + err.message});
          }
        };

        const exportarCSVFolha = () => {
          const header = ["Período","Colaborador","Função","Dias Trab.","Faltas","Atestados","Férias","H.Extras","DSR Perd.","Caju Dias","Caju R$","Produtos R$","Adiant. R$","Total Desc. R$","Banco Horas","Dias Faltas"];
          const rows = resultados.map(r=>[
            periodoLabel, r.nome, r.funcao,
            r.calc.diasTrabalhados, r.calc.faltas, r.calc.atestados, r.calc.ferias,
            r.calc.horasExtras, r.calc.dsrPerdidos,
            r.calc.cajuDias, r.calc.cajuValor.toFixed(2).replace(".",","),
            r.calc.produtos.toFixed(2).replace(".",","),
            r.calc.adiantamento.toFixed(2).replace(".",","),
            r.calc.totalDesconto.toFixed(2).replace(".",","),
            r.calc.bancoHoras?"Sim":"Não",
            r.calc.diasFaltas.join(" | ")
          ]);
          const csv = [header, ...rows].map(r=>r.join(";")).join("\n");
          const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url; a.download = `Folha_${mesAno.replace("/","-")}.csv`;
          a.click();
          URL.revokeObjectURL(url);
        };

        const setMarcacao = (nome, iso, valor) => {
          setMarcacoes(prev=>{
            const novo = {...prev};
            if (!novo[nome]) novo[nome] = {}; else novo[nome] = {...novo[nome]};
            if (valor === null || valor === "") delete novo[nome][iso];
            else novo[nome][iso] = valor;
            return novo;
          });
        };
        const toggleFeriado = (iso) => {
          setFeriados(prev=>{
            if (prev.includes(iso)) return prev.filter(x=>x!==iso);
            return [...prev, iso].sort();
          });
        };
        const setAjuste = (nome, campo, valor) => {
          setAjustes(prev=>({...prev, [nome]:{...(prev[nome]||{}), [campo]: valor}}));
        };

        const colabInfoAtual = colabSelecionado ? resultados.find(r=>r.nomeKey === colabSelecionado) : null;

        return (
          <div>
            {showRegras && (
              <div onClick={()=>setShowRegras(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.45)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:"20px"}}>
                <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:14,width:"min(720px,100%)",maxHeight:"90vh",overflowY:"auto",boxShadow:"0 8px 40px rgba(0,0,0,0.25)"}}>
                  <div style={{background:C.pri,color:"#fff",padding:"18px 24px",display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:0,borderRadius:"14px 14px 0 0"}}>
                    <div>
                      <div style={{fontSize:16,fontWeight:800}}>🧮 Regras e Orientações do Cálculo</div>
                      <div style={{fontSize:11,opacity:0.7,marginTop:2}}>Folha de Pagamento · Cantina em Casa / Lumar Alimentos</div>
                    </div>
                    <button onClick={()=>setShowRegras(false)} style={{background:"transparent",border:"1px solid rgba(255,255,255,0.3)",color:"#fff",borderRadius:6,padding:"4px 10px",cursor:"pointer",fontSize:13}}>✕ Fechar</button>
                  </div>
                  <div style={{padding:"24px"}}>

                    <div style={{marginBottom:20}}>
                      <div style={{fontWeight:800,color:C.pri,fontSize:13,marginBottom:10,textTransform:"uppercase",letterSpacing:"0.05em"}}>📅 Período de Fechamento</div>
                      <div style={{background:C.rowAlt,border:`1px solid ${C.border}`,borderRadius:8,padding:"12px 14px",fontSize:13,lineHeight:1.8}}>
                        O período cobre do <strong>dia 26 do mês anterior</strong> ao <strong>dia 25 do mês de referência</strong>.<br/>
                        <em style={{color:C.muted,fontSize:12}}>Exemplo: Folha de Maio/2025 → período de 26/04/2025 a 25/05/2025.</em>
                      </div>
                    </div>

                    <div style={{marginBottom:20}}>
                      <div style={{fontWeight:800,color:C.pri,fontSize:13,marginBottom:10,textTransform:"uppercase",letterSpacing:"0.05em"}}>📊 Status dos Dias</div>
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                        {[
                          {s:"trabalhou",l:"Trabalhado",c:C.green,bg:"#E8F5EE",d:"Dia com registro de ponto (batida) dentro do horário previsto."},
                          {s:"falta",l:"Falta",c:C.danger,bg:"#FEE2E2",d:"Dia previsto sem batida e sem justificativa. Gera perda de DSR na semana."},
                          {s:"atestado",l:"Atestado",c:C.amber,bg:"#FFF8E7",d:"Afastamento médico justificado. Conta para CAJU, não gera falta nem perde DSR."},
                          {s:"ferias",l:"Férias",c:"#3b82f6",bg:"#DBEAFE",d:"Período de férias. Conta para CAJU. Não gera falta."},
                          {s:"folga",l:"Folga",c:"#8b5cf6",bg:"#EDE9FE",d:"Folga compensatória ou escala. Não conta como falta nem como dia trabalhado."},
                          {s:"feriado",l:"Feriado",c:"#D4972A",bg:"#FFF8E7",d:"Feriado nacional, estadual ou municipal marcado. Não conta como falta. Se houver falta na mesma semana, o feriado também é perdido."},
                        ].map((it,i)=>(
                          <div key={i} style={{background:it.bg,border:`1.5px solid ${it.c}30`,borderRadius:8,padding:"10px 12px"}}>
                            <div style={{fontWeight:800,color:it.c,fontSize:12,marginBottom:4}}>{it.l}</div>
                            <div style={{fontSize:12,color:C.text,lineHeight:1.6}}>{it.d}</div>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div style={{marginBottom:20}}>
                      <div style={{fontWeight:800,color:C.pri,fontSize:13,marginBottom:10,textTransform:"uppercase",letterSpacing:"0.05em"}}>💤 DSR — Descanso Semanal Remunerado</div>
                      <div style={{background:C.rowAlt,border:`1px solid ${C.border}`,borderRadius:8,padding:"12px 14px",fontSize:13,lineHeight:1.8}}>
                        <ul style={{paddingLeft:18,lineHeight:2.1}}>
                          <li>Toda semana em que o colaborador tiver <strong>pelo menos 1 falta injustificada</strong> gera perda de <strong>1 DSR</strong>.</li>
                          <li>Feriados que caem na mesma semana de uma falta também são perdidos (exibidos como <strong>+Nf</strong> na coluna DSR).</li>
                          <li>Atestados, férias e folgas <strong>não</strong> geram perda de DSR.</li>
                        </ul>
                      </div>
                    </div>

                    <div style={{marginBottom:20}}>
                      <div style={{fontWeight:800,color:C.pri,fontSize:13,marginBottom:10,textTransform:"uppercase",letterSpacing:"0.05em"}}>🍱 CAJU — Vale Alimentação</div>
                      <div style={{background:C.rowAlt,border:`1px solid ${C.border}`,borderRadius:8,padding:"12px 14px",fontSize:13,lineHeight:1.8}}>
                        <ul style={{paddingLeft:18,lineHeight:2.1}}>
                          <li>Valor: <strong>R$ 5,00 por dia</strong> que conta como trabalhado, atestado ou férias.</li>
                          <li>Dias de falta, folga e feriado <strong>não</strong> geram crédito CAJU.</li>
                          <li>Colaboradores em <strong>período de experiência (90 dias)</strong> não recebem CAJU durante esse período.</li>
                          <li>O fim da experiência é baseado na data cadastrada no campo <em>experiencia90</em> da planilha.</li>
                        </ul>
                      </div>
                    </div>

                    <div style={{marginBottom:20}}>
                      <div style={{fontWeight:800,color:C.pri,fontSize:13,marginBottom:10,textTransform:"uppercase",letterSpacing:"0.05em"}}>⏱️ Horas Extras e Horas Falta</div>
                      <div style={{background:C.rowAlt,border:`1px solid ${C.border}`,borderRadius:8,padding:"12px 14px",fontSize:13,lineHeight:1.8}}>
                        <ul style={{paddingLeft:18,lineHeight:2.1}}>
                          <li><strong>Horas Extras:</strong> Lidas diretamente do campo <em>Hora Extra</em> do CSV do ponto eletrônico.</li>
                          <li><strong>Horas Falta:</strong> Calculadas pela diferença entre o horário previsto e o real registrado no ponto.</li>
                          <li>Ambas são exibidas no formato <strong>HH:MM</strong>.</li>
                          <li>A flag <strong>Banco de Horas</strong> indica que as horas extras estão sendo acumuladas em banco, e não pagas.</li>
                        </ul>
                      </div>
                    </div>

                    <div style={{marginBottom:20}}>
                      <div style={{fontWeight:800,color:C.pri,fontSize:13,marginBottom:10,textTransform:"uppercase",letterSpacing:"0.05em"}}>🎯 Prêmio Assiduidade</div>
                      <div style={{background:C.rowAlt,border:`1px solid ${C.border}`,borderRadius:8,padding:"12px 14px",fontSize:13,lineHeight:1.8}}>
                        Marcado automaticamente como <strong>Sim</strong> quando o colaborador não possui nenhuma falta injustificada no período.
                        Pode ser ajustado manualmente no painel individual de cada colaborador.
                      </div>
                    </div>

                    <div style={{marginBottom:20}}>
                      <div style={{fontWeight:800,color:C.pri,fontSize:13,marginBottom:10,textTransform:"uppercase",letterSpacing:"0.05em"}}>🚌 Desconto Vale Transporte</div>
                      <div style={{background:C.rowAlt,border:`1px solid ${C.border}`,borderRadius:8,padding:"12px 14px",fontSize:13,lineHeight:1.8}}>
                        Ativado automaticamente se o colaborador possuir valor de transporte cadastrado na planilha (<em>campo transporte {">"} 0</em>).
                        Pode ser ajustado manualmente por colaborador.
                      </div>
                    </div>

                    <div style={{marginBottom:0}}>
                      <div style={{fontWeight:800,color:C.pri,fontSize:13,marginBottom:10,textTransform:"uppercase",letterSpacing:"0.05em"}}>💸 Descontos</div>
                      <div style={{background:C.rowAlt,border:`1px solid ${C.border}`,borderRadius:8,padding:"12px 14px",fontSize:13,lineHeight:1.8}}>
                        <ul style={{paddingLeft:18,lineHeight:2.1}}>
                          <li><strong>Produtos:</strong> Valor de compras de produtos da empresa descontados em folha (inserido manualmente).</li>
                          <li><strong>Adiantamento:</strong> Valor de adiantamento salarial a ser descontado (inserido manualmente).</li>
                          <li><strong>Total Descontos:</strong> Soma de Produtos + Adiantamento.</li>
                        </ul>
                      </div>
                    </div>

                  </div>
                </div>
              </div>
            )}

            <div style={{marginBottom:20,display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:10}}>
              <div>
                <div style={{fontSize:20,fontWeight:800,color:C.pri,marginBottom:4}}>💼 Folha de Pagamento</div>
                <div style={{fontSize:13,color:C.muted}}>Fechamento mensal do dia 26 ao 25 · cálculos automáticos a partir do ponto</div>
              </div>
              <button onClick={()=>setShowRegras(true)} style={{...s.btnOutline,fontSize:12,padding:"7px 14px",gap:6}}>
                🧮 Como funciona o cálculo?
              </button>
            </div>

            <div style={s.card}>
              <div style={s.cardTitle}>⚙️ Período de Fechamento</div>
              <div style={{display:"flex",gap:14,alignItems:"flex-end",flexWrap:"wrap"}}>
                <div>
                  <label style={s.label}>Mês / Ano de referência</label>
                  <input style={{...s.input,width:130}} value={mesAno} onChange={e=>setMesAno(e.target.value)} placeholder="MM/AAAA"/>
                </div>
                <div style={{flex:1,minWidth:200}}>
                  <label style={s.label}>Período calculado</label>
                  <div style={{padding:"8px 12px",background:C.rowAlt,border:`1px solid ${C.border}`,borderRadius:7,fontSize:13,fontWeight:700,color:C.pri}}>{periodoLabel}</div>
                </div>
                <button style={{...s.btnAcc,opacity:loadingAPI?0.6:1}} onClick={buscarColaboradores} disabled={loadingAPI}>
                  {loadingAPI?"⏳ Buscando...":"🔄 Carregar colaboradores da planilha"}
                </button>
              </div>
              {apiStatus&&<div style={{...(apiStatus.ok===true?s.successBox:apiStatus.ok===false?s.warnBox:s.infoBox),marginTop:12,marginBottom:0}}>{apiStatus.msg}</div>}
            </div>

            <div style={s.card}>
              <div style={s.cardTitle}>📂 Importar Ponto do Período</div>
              <div style={s.infoBox}>
                Exporte do ponto eletrônico o CSV com todos os colaboradores para o período <strong>{periodoLabel}</strong>.
              </div>
              <div style={s.dropZone(drag)} onDragOver={e=>{e.preventDefault();setDrag(true);}} onDragLeave={()=>setDrag(false)} onDrop={onDropFolha} onClick={()=>document.getElementById("csvFolhaInput").click()}>
                <div style={{fontSize:32,marginBottom:8}}>📄</div>
                <div style={{fontWeight:700,fontSize:15,marginBottom:4}}>Arraste o CSV do ponto aqui</div>
                <div style={{fontSize:13}}>ou clique para selecionar</div>
                <input id="csvFolhaInput" type="file" accept=".csv" style={{display:"none"}} onChange={e=>handleFile(e.target.files[0])}/>
              </div>
              {csvStatus&&<div style={csvStatus.ok?s.successBox:s.warnBox}>{csvStatus.msg}</div>}

              {csvPeriodoSugerido && !periodoBate && (
                <div style={{marginTop:12, marginBottom:0, background:"#FEF3C7", border:"1.5px solid #F59E0B", padding:"12px 14px", borderRadius:8}}>
                  <div style={{fontWeight:800, color:"#92400E", marginBottom:6}}>⚠️ Descompasso de período detectado</div>
                  <div style={{fontSize:12, color:"#78350F", marginBottom:10}}>
                    O CSV tem dados de <strong>{csvPeriodoSugerido.primeira.split("-").reverse().join("/")}</strong> a <strong>{csvPeriodoSugerido.ultima.split("-").reverse().join("/")}</strong> (folha de <strong>{csvPeriodoSugerido.mesAnoSugerido}</strong>),

                    {l:"Faltas",v:totais.faltas,c:C.danger},

                    {l:"Caju total",v:fmtBRL(totais.cajuValor),c:C.green,hl:true},

                <div style={{overflowX:"auto"}}>
                  <table style={{...s.table,fontSize:12}}>
                    <thead>
                      <tr>
                        <th style={s.th}>Colaborador</th>
                        <th style={s.thC}>Trab.</th>
                        <th style={s.thC}>Faltas</th>
                        <th style={s.thC}>Atest.</th>
                        <th style={s.thC}>Férias</th>
                        <th style={s.thC}>H.Extras</th>
                        <th style={s.thC}>DSR</th>
                        <th style={s.thC}>Caju</th>
                        <th style={s.thC}>Prod. R$</th>
                        <th style={s.thC}>Adiant. R$</th>
                        <th style={s.thC}>Total Desc.</th>
                        <th style={s.thC} title="Prêmio Assiduidade">Ass.</th>
                        <th style={s.thC} title="Descontar VT">VT</th>

                      </tr>
                    </thead>
                    <tbody>
                      {resultados.map((r,i)=>{

                        return (
                          <tr key={r.nomeKey} style={{...s.row(i),cursor:"pointer"}} onClick={()=>setColabSelecionado(r.nomeKey)}>
                            <td style={{...s.td,fontWeight:600,fontSize:12}}>
                              {r.nome}

                              {cruzamento === "nao_cadastrado" && <span title="No ponto, mas não cadastrado" style={{marginLeft:6,fontSize:9,color:C.danger,fontWeight:700}}>⚠ não cadastrado</span>}

            {resultados.length === 0 && (

                feriados={feriados}
                ajustes={ajustes[colabSelecionado]||{}}
                onMarcar={(iso,valor)=>setMarcacao(colabSelecionado,iso,valor)}
                onAjustar={(campo,val)=>setAjuste(colabSelecionado,campo,val)}

                analisarDia={(iso,diaDados)=>analisarDia(colabSelecionado,iso,diaDados)}

      function PainelColaborador({colab, datasPeriodo, marcacoes, feriados, ajustes, onMarcar, onAjustar, onClose, analisarDia}) {
        const STATUS_LABELS = {
          trabalhou:{l:"Trab.",c:C.green,bg:"#E8F5EE"},
          falta:{l:"Falta",c:C.danger,bg:"#FEE2E2"},
          atestado:{l:"Atest.",c:C.amber,bg:C.amberBg},
          ferias:{l:"Férias",c:"#3b82f6",bg:"#DBEAFE"},
          folga:{l:"Folga",c:"#8b5cf6",bg:"#EDE9FE"},
          feriado:{l:"Feriado",c:"#D4972A",bg:"#FFF8E7"},
          nao_previsto:{l:"",c:C.muted,bg:"#F3F3F3"}
        };

        const primeiro = new Date(datasPeriodo[0]+"T12:00:00");
        const dowPrimeiro = primeiro.getDay();
        const celulasVazias = Array(dowPrimeiro).fill(null);
        const celulas = [...celulasVazias, ...datasPeriodo];

        return (
          <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.45)",zIndex:100,display:"flex",justifyContent:"flex-end"}}>
            <div onClick={e=>e.stopPropagation()} style={{width:"min(560px,100%)",background:"#fff",height:"100%",overflowY:"auto",boxShadow:"-4px 0 20px rgba(0,0,0,0.2)"}}>
              <div style={{background:C.pri,color:"#fff",padding:"18px 22px",display:"flex",justifyContent:"space-between",alignItems:"flex-start",position:"sticky",top:0,zIndex:10}}>
                <div>
                  <div style={{fontSize:16,fontWeight:800}}>{colab.nome}</div>
                  {colab.funcao&&<div style={{fontSize:11,opacity:0.7,marginTop:2}}>{colab.funcao}{colab.setor?` · ${colab.setor}`:""}</div>}
                </div>
                <button onClick={onClose} style={{background:"transparent",border:"1px solid rgba(255,255,255,0.3)",color:"#fff",borderRadius:6,padding:"4px 10px",cursor:"pointer",fontSize:13}}>✕ Fechar</button>
              </div>

              <div style={{padding:"16px 22px",background:C.rowAlt,borderBottom:`1px solid ${C.border}`}}>
                <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
                  {[
                    {l:"Trab.",v:colab.calc.diasTrabalhados,c:C.green},
                    {l:"Faltas",v:colab.calc.faltas,c:C.danger},
                    {l:"Atest.",v:colab.calc.atestados,c:C.amber},
                    {l:"Férias",v:colab.calc.ferias,c:"#3b82f6"},
                    {l:"H.Extras",v:colab.calc.horasExtras,c:C.green},
                    {l:"DSR",v:`${colab.calc.dsrPerdidos}${colab.calc.feriadosPerdidos>0?`+${colab.calc.feriadosPerdidos}f`:""}`,c:C.danger},
                    {l:"Caju dias",v:colab.calc.cajuDias,c:C.pri},
                    {l:"Caju R$",v:fmtBRL(colab.calc.cajuValor),c:C.green}
                  ].map((it,i)=>(
                    <div key={i} style={{background:"#fff",borderRadius:7,padding:"7px 9px",border:`1px solid ${C.border}`}}>
                      <div style={{fontSize:9,color:C.muted,textTransform:"uppercase",letterSpacing:"0.04em"}}>{it.l}</div>
                      <div style={{fontSize:13,fontWeight:800,color:it.c}}>{it.v}</div>
                    </div>
                  ))}
                </div>
              </div>

              <div style={{padding:"16px 22px"}}>
                <div style={{fontSize:13,fontWeight:800,color:C.pri,marginBottom:10}}>📅 Calendário do período</div>
                <div style={{fontSize:11,color:C.muted,marginBottom:10}}>Clique em um dia para ciclar: <strong>Normal → Atestado → Férias → Folga → Normal</strong></div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:6}}>
                  {["D","S","T","Q","Q","S","S"].map((d,i)=>(
                    <div key={i} style={{textAlign:"center",fontSize:10,fontWeight:700,color:C.muted,padding:"4px 0"}}>{d}</div>
                  ))}
                </div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
                  {celulas.map((iso,idx)=>{
                    if (!iso) return <div key={idx}/>;
                    const d = new Date(iso+"T12:00:00");
                    const dia = d.getDate();
                    const diaDados = colab.dadosCSV?.dias?.[iso];
                    const a = analisarDia(iso, diaDados);
                    const info = STATUS_LABELS[a.status] || STATUS_LABELS.nao_previsto;
                    const isFer = feriados.includes(iso);
                    const marc = marcacoes[iso];
                    const clique = () => {
                      const ciclo = ["", "atestado", "ferias", "folga"];
                      const atual = marc || "";
                      const next = ciclo[(ciclo.indexOf(atual)+1)%ciclo.length];
                      onMarcar(iso, next || null);
                    };
                    return (
                      <button key={idx} onClick={clique} style={{
                        background:info.bg,
                        border:`1.5px solid ${info.c}40`,
                        borderRadius:6, padding:"6px 4px", cursor:"pointer",
                        display:"flex",flexDirection:"column",alignItems:"center",gap:2,
                        minHeight:58
                      }}>
                        <div style={{fontSize:13,fontWeight:800,color:info.c}}>{dia}</div>
                        <div style={{fontSize:8,color:info.c,fontWeight:700,textAlign:"center",lineHeight:1.1}}>
                          {isFer&&a.status==="feriado"?"Feriado":info.l}
                        </div>
                        {diaDados?.horaExtra && diaDados.horaExtra !== "00:00" && (
                          <div style={{fontSize:8,color:C.green,fontWeight:700}}>+{diaDados.horaExtra}</div>
                        )}
                      </button>
                    );
                  })}
                </div>

                <div style={{marginTop:14,display:"flex",flexWrap:"wrap",gap:6}}>
                  {Object.entries(STATUS_LABELS).filter(([k])=>k!=="nao_previsto").map(([k,v])=>(
                    <div key={k} style={{fontSize:10,background:v.bg,color:v.c,border:`1px solid ${v.c}30`,borderRadius:5,padding:"2px 7px",fontWeight:700}}>{v.l}</div>
                  ))}
                </div>
              </div>

              <div style={{padding:"0 22px 22px"}}>
                <div style={{fontSize:13,fontWeight:800,color:C.pri,marginBottom:10,marginTop:14}}>📝 Observações</div>
                <textarea style={{...s.input,minHeight:60,fontFamily:"inherit"}}
                          value={ajustes.observacoes||""}
                          onChange={e=>onAjustar("observacoes",e.target.value)}
                          placeholder="Notas adicionais..."/>

                {colab.calc.diasFaltas.length>0&&(
                  <div style={{marginTop:14,padding:"10px 14px",background:"#FEE2E2",border:"1px solid #FECACA",borderRadius:7}}>
                    <div style={{fontSize:11,fontWeight:700,color:C.danger,marginBottom:4}}>Dias de falta injustificada:</div>
                    <div style={{fontSize:12,color:"#991B1B"}}>{colab.calc.diasFaltas.join(" · ")}</div>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }


      // ============================================================
      // MÓDULO CONFIGURAÇÕES (admin only)
      // ============================================================
      function ConfiguracoesPage({ gasUrl, setGasUrl, empresa, setEmpresa, responsavel, setResponsavel, passagemStr, setPassagemStr, copiedScript, setCopiedScript }) {
        return (
          <div>
            <div style={{fontSize:20,fontWeight:800,color:C.pri,marginBottom:20}}>⚙️ Configurações</div>

            <div style={s.card}>
              <div style={s.cardTitle}>🔧 Google Apps Script (Web App)</div>
              <div style={s.infoBox}>
                Cole o script abaixo no <strong>Apps Script</strong> da sua planilha e publique como <strong>Web App</strong>
                {' '}(Executar como: <em>Eu</em> · Acesso: <em>Qualquer pessoa</em>).{' '}
                Sempre que atualizar o script, crie uma <strong>Nova versão</strong> antes de reimplantar.
              </div>
              <div style={{display:"flex",justifyContent:"flex-end",marginBottom:8}}>
                <button
                  onClick={()=>{ navigator.clipboard.writeText(GAS_SCRIPT).then(()=>{ setCopiedScript(true); setTimeout(()=>setCopiedScript(false),2500); }); }}
                  style={{...s.btnAcc,fontSize:12,padding:"7px 16px"}}

                  {copiedScript?"✅ Copiado!":"📋 Copiar script completo"}
                </button>
              </div>
              <pre style={{...s.codeBlock,maxHeight:380,overflowY:"auto",fontSize:11}}>{GAS_SCRIPT}</pre>
              <div style={{marginTop:12}}>
                <label style={s.label}>URL do Web App (cole aqui após implantar)</label>
                <input
                  style={s.input}
                  value={gasUrl}
                  onChange={e=>setGasUrl(e.target.value)}
                  placeholder="https://script.google.com/macros/s/.../exec"
                />
              </div>
            </div>

            <div style={s.card}>
              <div style={s.cardTitle}>🏢 Empresa</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 20px"}}>
                <div style={{marginBottom:14}}>
                  <label style={s.label}>Nome da empresa</label>
                  <input style={s.input} value={empresa} onChange={e=>setEmpresa(e.target.value)} placeholder="Nome da empresa"/>
                </div>
                <div style={{marginBottom:14}}>

                  <input style={s.input} value={responsavel} onChange={e=>setResponsavel(e.target.value)} placeholder="Nome do responsável"/>

                  <label style={s.label}>Valor da passagem (R$)</label>
                  <input style={s.input} value={passagemStr} onChange={e=>setPassagemStr(e.target.value)} placeholder="4,30"/>
                </div>
              </div>
            </div>
          </div>
        );
      }

    function App(){
      const [page,setPage]=useState("dashboard");
      const [empresa,setEmpresa]=useState(()=>localStorage.getItem("rh_empresa")||"Cantina em Casa / Lumar Alimentos");
      const [responsavel,setResponsavel]=useState(()=>localStorage.getItem("rh_responsavel")||"");
      const [passagemStr,setPassagemStr]=useState(()=>localStorage.getItem("rh_passagem")||"4,30");
      const [semanaIni,setSemanaIni]=useState(()=>localStorage.getItem("rh_semanaIni")||"");
      const [semanaFim,setSemanaFim]=useState(()=>localStorage.getItem("rh_semanaFim")||"");
      const [employees,setEmployees]=useState(()=>{ try{ return JSON.parse(localStorage.getItem("rh_employees")||"[]"); }catch(e){ return []; } });
      const [historico,setHistorico]=useState(()=>{ try{ return JSON.parse(localStorage.getItem("rh_historico")||"[]"); }catch(e){ return []; } });
      const [novoNome,setNovoNome]=useState("");
      const [novaEscala,setNovaEscala]=useState("SEG-SEX");
      const [csvStatus,setCsvStatus]=useState(null);
      const [drag,setDrag]=useState(false);
      const [vtTab,setVtTab]=useState("import");
      // Novos estados
      const [feriadosDia,setFeriadosDia]=useState({});
      const [gasUrl,setGasUrl]=useState(()=>localStorage.getItem("rh_gas_url")||"https://script.google.com/macros/s/AKfycbw2KhlWuitfSpPFO6Q6M6vHnK5MzaatvemNQ44Hr3zbyLT8xx9Es-tqSe_v5pi0xtAo/exec");
      const [gasStatus,setGasStatus]=useState(null);
      const [copiedScript,setCopiedScript]=useState(false);
      const [copiedCsv,setCopiedCsv]=useState(false);
      const [colabAPI,setColabAPI]=useState(()=>{ try{return JSON.parse(localStorage.getItem("rh_colab_api")||"[]");}catch(e){return [];} });
      const [empresaId,setEmpresaId]=useState(()=>localStorage.getItem("rh_empresa_id")||"cantina");
      const [usuario, setUsuario] = useState(null);
      const [perfil, setPerfil] = useState(null);
      const [loadingAuth, setLoadingAuth] = useState(true);

      useEffect(()=>{ localStorage.setItem("rh_empresa",empresa); },[empresa]);
      useEffect(()=>{ localStorage.setItem("rh_responsavel",responsavel); },[responsavel]);
      useEffect(()=>{ localStorage.setItem("rh_passagem",passagemStr); },[passagemStr]);
      useEffect(()=>{ localStorage.setItem("rh_semanaIni",semanaIni); },[semanaIni]);
      useEffect(()=>{ localStorage.setItem("rh_semanaFim",semanaFim); },[semanaFim]);
      useEffect(()=>{ localStorage.setItem("rh_employees",JSON.stringify(employees)); },[employees]);
      useEffect(()=>{ localStorage.setItem("rh_historico",JSON.stringify(historico)); },[historico]);
      useEffect(()=>{ localStorage.setItem("rh_gas_url",gasUrl); },[gasUrl]);
      useEffect(()=>{ localStorage.setItem("rh_colab_api",JSON.stringify(colabAPI)); },[colabAPI]);
      useEffect(()=>{ localStorage.setItem("rh_empresa_id",empresaId); },[empresaId]);
      useEffect(()=>{
        async function _carregarColab(){
          const {data,error}=await _supa.from('colaboradores').select('*').eq('empresa_id',empresaId).eq('ativo',true).order('nome');
          if(!error && data && data.length>0){
            setColabAPI(data.map(c=>({
              nome:c.nome, setor:c.setor||'', funcao:c.funcao||'', cpf:c.cpf||'',
              telefone:c.telefone||'', chavePix:c.chave_pix||'', email:c.email||'',
              nascimento:c.nascimento||'', admissao:c.admissao||'',
              experiencia30:c.experiencia_30||'', experiencia90:c.experiencia_90||'',
              salario:Number(c.salario)||0, inss:calcINSS(c.salario), fgts:calcFGTS(c.salario),
              transporte:Number(c.transporte)||0, periculosidade:!!c.periculosidade,
              contaSalario:!!c.conta_salario, aditivoContrato:!!c.aditivo_contrato,
              usoArmario:!!c.uso_armario, lgpd:!!c.lgpd, imagem:!!c.imagem,
              camera:!!c.camera, epiUniforme:!!c.epi_uniforme,
              acompanhamentoProducao:!!c.acompanhamento_producao,
              usoCelular:!!c.uso_celular, usoVeiculo:!!c.uso_veiculo,
              termoConfidencialidade:!!c.termo_confidencialidade,
              termoAssiduidade:!!c.termo_assiduidade,
              termoMudancaHorario:!!c.termo_mudanca_horario, id_supa:c.id
            })));
          }
        }
        _carregarColab();
      },[empresaId]);

      const carregarPerfil = useCallback(async (uid) => {
        try {
          const {data} = await _supa.from('perfis').select('*').eq('id',uid).single();
          if(data) {
            setPerfil(data);
            if(data.empresa_id) setEmpresaId(data.empresa_id);
          } else {
            setPerfil(null);
          }
        } catch(e) {
          setPerfil(null);
        }
        setLoadingAuth(false);
      },[]);

      useEffect(()=>{
        _supa.auth.getSession().then(({data:{session}})=>{
          if(session?.user){ setUsuario(session.user); carregarPerfil(session.user.id); }
          else setLoadingAuth(false);
        });
        const {data:{subscription}} = _supa.auth.onAuthStateChange((event,session)=>{
          if(session?.user){ setUsuario(session.user); carregarPerfil(session.user.id); }
          else { setUsuario(null); setPerfil(null); setLoadingAuth(false); }
        });
        return ()=>subscription.unsubscribe();
      },[]);

      const valorPassagem=parseFloat(passagemStr.replace(",","."))||0;

      // getDias respeita feriados e afastamento
      const getDias=(emp)=>{
        if(emp.afastado) return 0;
        const dias=emp.escala==="SEG-SAB"?DIAS_SS:DIAS_SF;
        return dias.filter(d=>emp.presente?.[d]&&!feriadosDia[d]).length;
      };

      // getValorFinal usa valorPago se preenchido, senão calcula
      const getValorFinal=(emp)=>{
        if(emp.afastado) return 0;
        const vp=emp.valorPago!==undefined&&emp.valorPago!==""&&emp.valorPago!==null;
        if(vp) return parseFloat(String(emp.valorPago).replace(",","."))||0;
        return getDias(emp)*2*valorPassagem;
      };

      const total=employees.reduce((s,e)=>s+getValorFinal(e),0);
      const semanaLabel=semanaIni&&semanaFim?`${fmtDate(semanaIni)} a ${fmtDate(semanaFim)}`:"— período não definido —";

      const toggleFeriado=(dia)=>setFeriadosDia(p=>({...p,[dia]:!p[dia]}));
      const toggleAtt=(id,dia)=>setEmployees(p=>p.map(e=>e.id===id?{...e,presente:{...e.presente,[dia]:!e.presente?.[dia]}}:e));
      const toggleAfastado=(id)=>setEmployees(p=>p.map(e=>e.id===id?{...e,afastado:!e.afastado}:e));
      const setValorPago=(id,val)=>setEmployees(p=>p.map(e=>e.id===id?{...e,valorPago:val}:e));
      const setAllDay=(dia,val)=>setEmployees(p=>p.map(e=>{ const dias=e.escala==="SEG-SAB"?DIAS_SS:DIAS_SF; if(!dias.includes(dia)) return e; return{...e,presente:{...e.presente,[dia]:val}}; }));
      const removeEmp=(id)=>setEmployees(p=>p.filter(e=>e.id!==id));
      const addEmp=()=>{ if(!novoNome.trim()) return; setEmployees(p=>[...p,{id:Date.now(),nome:novoNome.trim(),escala:novaEscala,presente:{},afastado:false,valorPago:""}]); setNovoNome(""); };

      const carregarDoHistorico=useCallback((entrada)=>{
        setEmployees(entrada.employees.map(e=>({afastado:false,valorPago:"",...e})));
        setSemanaIni(entrada.semanaIni);
        setSemanaFim(entrada.semanaFim);
        setCsvStatus({ok:true,msg:`✅ Semana ${entrada.label} carregada do histórico.`});
      },[]);

      const handleFile=useCallback((file)=>{
        if(!file){ return; }
        if(!file.name.toLowerCase().endsWith(".csv")){ setCsvStatus({ok:false,msg:"Selecione um arquivo .csv exportado do ponto eletrônico."}); return; }
        const reader=new FileReader();
        reader.onload=(e)=>{
          try{
            const bytes=new Uint8Array(e.target.result);
            const text=new TextDecoder("iso-8859-1").decode(bytes);
            const {employees:emps,semanaIni:ini,semanaFim:fim}=parseCSV(text);
            setEmployees(emps.map((emp,i)=>({...emp,id:i+1})));
            setSemanaIni(ini);
            setSemanaFim(fim);
            setCsvStatus({ok:true,msg:`✅ ${emps.length} colaboradores importados. Período: ${fmtDate(ini)} a ${fmtDate(fim)}.`});
            const lbl=`${fmtDate(ini)} a ${fmtDate(fim)}`;
            setHistorico(prev=>{
              const sem=prev.filter(h=>h.semanaIni!==ini||h.semanaFim!==fim);
              return [{id:Date.now(),label:lbl,semanaIni:ini,semanaFim:fim,employees:emps.map((e,i)=>({...e,id:i+1})),importadoEm:new Date().toLocaleString("pt-BR")},...sem].slice(0,12);
            });
          }catch(err){
            setCsvStatus({ok:false,msg:`Erro ao processar arquivo: ${err.message}`});
          }
        };
        reader.readAsArrayBuffer(file);
      },[]);

      const onDrop=useCallback((e)=>{ e.preventDefault(); setDrag(false); handleFile(e.dataTransfer.files[0]); },[handleFile]);

      // Exportar CSV para download
      const exportarCSV=useCallback(()=>{
        if(employees.length===0) return;
        const header=["Semana Início","Semana Fim","Colaborador","Escala","Dias Trabalhados","Passagens","Valor Calculado","Valor Pago","Afastado"];
        const rows=employees.map(emp=>[
          semanaIni,semanaFim,emp.nome,emp.escala,
          getDias(emp),getDias(emp)*2,
          (getDias(emp)*2*valorPassagem).toFixed(2).replace(".",","),
          getValorFinal(emp).toFixed(2).replace(".",","),
          emp.afastado?"Sim":"Não"
        ]);
        const csv=[header,...rows].map(r=>r.join(";")).join("\n");
        const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
        const url=URL.createObjectURL(blob);
        const a=document.createElement("a");
        a.href=url;
        a.download=`VT_${semanaIni}_${semanaFim}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      },[employees,semanaIni,semanaFim,valorPassagem]);

      // Copiar CSV para clipboard
      const copiarCSV=useCallback(()=>{
        if(employees.length===0) return;
        const header=["Semana Início","Semana Fim","Colaborador","Escala","Dias","Passagens","Vlr Calculado","Vlr Pago","Afastado"];
        const rows=employees.map(emp=>[
          fmtDate(semanaIni),fmtDate(semanaFim),emp.nome,emp.escala,
          getDias(emp),getDias(emp)*2,
          getValorFinal(emp).toFixed(2).replace(".",","),
          getValorFinal(emp).toFixed(2).replace(".",","),
          emp.afastado?"Sim":"Não"
        ]);
        const tsv=[header,...rows].map(r=>r.join("\t")).join("\n");
        navigator.clipboard.writeText(tsv).then(()=>{
          setCopiedCsv(true);
          setTimeout(()=>setCopiedCsv(false),2500);
        });
      },[employees,semanaIni,semanaFim,valorPassagem]);

      // Salvar na planilha via GAS web app
      const salvarNaPlanilha=useCallback(async()=>{
        if(!gasUrl.trim()){ setGasStatus({ok:false,msg:"Cole a URL do Web App antes de salvar."}); return; }
        if(employees.length===0){ setGasStatus({ok:false,msg:"Nenhum colaborador carregado."}); return; }
        const payload={
          semanaIni,semanaFim,
          employees:employees.map(emp=>({
            nome:emp.nome,escala:emp.escala,
            afastado:emp.afastado||false,
            diasTrabalhados:getDias(emp),
            valorCalculado:getDias(emp)*2*valorPassagem,
            valorPago:getValorFinal(emp),
          }))
        };
        setGasStatus({ok:null,msg:"Enviando dados..."});
        try{
          // no-cors: dados chegam ao GAS mas não conseguimos ler a resposta
          await fetch(gasUrl,{
            method:"POST",
            mode:"no-cors",
            body:JSON.stringify(payload),
          });
          setGasStatus({ok:true,msg:"✅ Dados enviados! Verifique a aba VT na planilha para confirmar o registro."});
        }catch(err){
          setGasStatus({ok:false,msg:`Erro: ${err.message}. Tente exportar o CSV manualmente.`});
        }
      },[gasUrl,employees,semanaIni,semanaFim,valorPassagem]);

      const printRecibo=useCallback(()=>{
        const vp=parseFloat(passagemStr.replace(",","."))||0;
        const fd=feriadosDia;
        const getD=(emp)=>{
          if(emp.afastado) return 0;
          const dias=emp.escala==="SEG-SAB"?DIAS_SS:DIAS_SF;
          return dias.filter(d=>emp.presente?.[d]&&!fd[d]).length;
        };
        const getV=(emp)=>{
          if(emp.afastado) return 0;
          const pago=emp.valorPago!==undefined&&emp.valorPago!==""&&emp.valorPago!==null;
          if(pago) return parseFloat(String(emp.valorPago).replace(",","."))||0;
          return getD(emp)*2*vp;
        };
        const tot=employees.reduce((s,e)=>s+getV(e),0);
        const periodo=semanaIni&&semanaFim?`${fmtDate(semanaIni)} a ${fmtDate(semanaFim)}`:"—";
        const linhas=employees.map((emp,i)=>{
          const d=getD(emp); const v=getV(emp);
          const calculado=d*2*vp;
          const manualNote=emp.valorPago!==""&&emp.valorPago!==undefined&&!emp.afastado?`<span style="font-size:7pt;color:#888">(calc: ${fmtBRL(calculado)})</span>`:"";
          const badge=emp.escala==="SEG-SAB"?"background:#FFF8E7;color:#D4972A":"background:#E8F5EE;color:#219653";
          const afastadoStyle=emp.afastado?"opacity:0.5;text-decoration:line-through;":"";
          return `<tr style="background:${i%2===0?"#fff":"#f9f9f9"};${afastadoStyle}">
            <td style="text-align:center;color:#888;width:20px">${i+1}</td>
            <td style="font-weight:600;font-size:7.5pt">${emp.nome}${emp.afastado?" <span style='color:#A93226;font-size:7pt'>(Afastado)</span>":""}</td>
            <td style="text-align:center;width:56px"><span style="padding:2px 5px;border-radius:20px;font-size:7pt;font-weight:700;${badge}">${emp.escala}</span></td>
            <td style="text-align:center;font-weight:700;width:36px">${d}</td>
            <td style="text-align:center;color:#666;width:36px">${d*2}</td>
            <td style="text-align:center;font-weight:800;color:#1B3A2B;width:60px">${fmtBRL(v)} ${manualNote}</td>
            <td style="border-left:1px solid #ccc;width:150px">
              <div style="border-bottom:1px solid #999;height:20px;margin-top:4px"></div>
              <div style="font-size:7pt;color:#999;margin-top:2px">Data: ___/___/______</div>
            </td>
          </tr>`;
        }).join("");
        const totalPass=employees.reduce((s,e)=>s+getD(e)*2,0);
        const html=`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
        <title>Recibo VT — ${periodo}</title>
        <style>
          *{box-sizing:border-box;margin:0;padding:0}
          body{font-family:Arial,sans-serif;font-size:9pt;color:#111;padding:8mm 10mm}
          table{width:100%;border-collapse:collapse;margin-bottom:10px}
          th{background:#EDE9E1;font-size:7.5pt;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:4px 5px;border:1px solid #ccc;color:#555}
          td{padding:4px 5px;border:1px solid #ddd;vertical-align:middle;font-size:8pt}
          thead{display:table-header-group}
          tfoot{display:table-footer-group}
          tr{page-break-inside:avoid}
          .tfoot-row td{background:#1B3A2B!important;color:#fff;font-weight:800;font-size:10pt;padding:7px 10px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
          .resumo{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
          .resumo-item{flex:1;min-width:90px;border:1px solid #ddd;border-radius:6px;padding:7px 10px}
          .resumo-item.hl{border-left:4px solid #1B3A2B;background:#EAF5F0}
          .resumo-label{font-size:7pt;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
          .resumo-val{font-size:13pt;font-weight:800;color:#1B3A2B}
          .assinaturas{display:flex;gap:30px;margin-top:16px;padding-top:12px;border-top:1px dashed #ccc}
          .assin-item{flex:1}
          .assin-linha{border-bottom:1px solid #666;height:30px}
          .assin-label{text-align:center;font-size:8pt;color:#888;margin-top:4px}
          @media print{body{padding:5mm 7mm}}
        </style></head><body>
        <div style="border-bottom:3px solid #1B3A2B;padding-bottom:8px;margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;align-items:flex-end">
            <div>
              <div style="font-size:15pt;font-weight:800;color:#1B3A2B">${empresa}</div>
              <div style="font-size:8pt;color:#888;margin-top:2px">R. 11, 2-114 — Jardim Santo Antônio, Goiânia - GO</div>
            </div>
            <div style="text-align:right">
              <div style="font-size:8pt;color:#888">Período de referência</div>
              <div style="font-size:11pt;font-weight:700;color:#1B3A2B">${periodo}</div>
              ${responsavel?`<div style="font-size:8pt;color:#888">Resp.: ${responsavel}</div>`:""}
            </div>
          </div>
          <div style="margin-top:8px;font-size:11pt;font-weight:800;text-align:center;text-transform:uppercase;letter-spacing:.07em">Recibo de Vale Transporte</div>
        </div>
        <table>
          <thead><tr>
            <th style="width:20px">#</th>
            <th style="text-align:left">Nome do Colaborador</th>
            <th style="width:56px">Escala</th>
            <th style="width:36px">Dias</th>
            <th style="width:36px">Pass.</th>
            <th style="width:60px">Valor</th>
            <th style="width:150px;text-align:left">Assinatura / Data</th>
          </tr></thead>
          <tbody>${linhas}</tbody>
        </table>
        <div class="resumo">
          <div class="resumo-item"><div class="resumo-label">Colaboradores</div><div class="resumo-val">${employees.length}</div></div>
          <div class="resumo-item"><div class="resumo-label">Total passagens</div><div class="resumo-val">${totalPass}</div></div>
          <div class="resumo-item"><div class="resumo-label">Valor/passagem</div><div class="resumo-val">${fmtBRL(vp)}</div></div>
          <div class="resumo-item hl"><div class="resumo-label">Total a pagar</div><div class="resumo-val">${fmtBRL(tot)}</div></div>
        </div>
        <div class="assinaturas">
          <div class="assin-item"><div class="assin-linha"></div><div class="assin-label">Responsável pelo Pagamento</div><div class="assin-label">Data: ___/___/______</div></div>
          <div class="assin-item"><div class="assin-linha"></div><div class="assin-label">Conferência</div><div class="assin-label">Data: ___/___/______</div></div>
        </div>
        </body></html>`;
        const old=document.getElementById("__print_iframe");
        if(old) old.remove();
        const iframe=document.createElement("iframe");
        iframe.id="__print_iframe";
        iframe.style.cssText="position:fixed;top:-9999px;left:-9999px;width:0;height:0;border:none";
        document.body.appendChild(iframe);
        iframe.contentDocument.open();
        iframe.contentDocument.write(html);
        iframe.contentDocument.close();
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
        setTimeout(()=>{ if(iframe.parentNode) iframe.remove(); },2000);
      },[employees,semanaIni,semanaFim,empresa,responsavel,passagemStr,feriadosDia]);

      const vtTabs=[
        {k:"import",l:"📂 Importar CSV"},
        {k:"manual",l:"✏️ Manual"},
        {k:"ponto",l:"📋 Ponto"},
        {k:"recibo",l:"🖨️ Recibo"},
        {k:"hist",l:"📚 Histórico"},
        {k:"sheets",l:"💾 Salvar pagamento do VT"},
      ];

      const vtPageContent=(
        <div>
          <div style={{marginBottom:20}}>
            <div style={{fontSize:20,fontWeight:800,color:C.pri,marginBottom:4}}>🚌 Vale Transporte</div>
            <div style={{fontSize:13,color:C.muted}}>Controle semanal de presença e geração de recibo</div>
          </div>

          <div style={s.card}>
            <div style={s.cardTitle}>⚙️ Configurações</div>
            <div style={s.grid3}>
              <div><label style={s.label}>Empresa</label><input style={s.input} value={empresa} onChange={e=>setEmpresa(e.target.value)}/></div>
              <div><label style={s.label}>Responsável</label><input style={s.input} value={responsavel} onChange={e=>setResponsavel(e.target.value)} placeholder="Nome do responsável"/></div>
              <div>
                <label style={s.label}>Valor da passagem (R$)</label>
                <input style={s.input} value={passagemStr} onChange={e=>setPassagemStr(e.target.value)} placeholder="5,50"/>
                <div style={{fontSize:11,color:C.muted,marginTop:4}}>1 presença = 2 × R$ {passagemStr} = <strong>{fmtBRL(valorPassagem*2)}</strong></div>
              </div>
            </div>
            <div style={{...s.grid2,marginTop:12}}>
              <div><label style={s.label}>Semana — Início</label><input style={s.input} type="date" value={semanaIni} onChange={e=>setSemanaIni(e.target.value)}/></div>
              <div><label style={s.label}>Semana — Fim</label><input style={s.input} type="date" value={semanaFim} onChange={e=>setSemanaFim(e.target.value)}/></div>
            </div>
          </div>

          <div style={{display:"flex",gap:4,marginBottom:18,borderBottom:`1px solid ${C.border}`,paddingBottom:0,overflowX:"auto"}}>
            {vtTabs.map(t=>(
              <button key={t.k} style={{...s.btn,background:vtTab===t.k?C.pri:"transparent",color:vtTab===t.k?"#fff":C.muted,border:"none",borderRadius:"7px 7px 0 0",fontSize:12,padding:"8px 14px",whiteSpace:"nowrap"}} onClick={()=>setVtTab(t.k)}>{t.l}</button>
            ))}
          </div>

          {/* ── TAB IMPORT ── */}
          {vtTab==="import"&&(
            <div style={s.card}>
              <div style={s.cardTitle}>📂 Importar arquivo do ponto eletrônico</div>
              <div style={s.infoBox}><strong>Formato esperado:</strong> arquivo <code>.csv</code> com separador <code>;</code> exportado pelo sistema de ponto. Presença detectada pela coluna <strong>1ª Batida</strong>.</div>
              <div style={s.dropZone(drag)} onDragOver={e=>{e.preventDefault();setDrag(true);}} onDragLeave={()=>setDrag(false)} onDrop={onDrop} onClick={()=>document.getElementById("csvInput").click()}>
                <div style={{fontSize:32,marginBottom:8}}>📄</div>
                <div style={{fontWeight:700,fontSize:15,marginBottom:4}}>Arraste o arquivo CSV aqui</div>
                <div style={{fontSize:13}}>ou clique para selecionar</div>
                <input id="csvInput" type="file" accept=".csv" style={{display:"none"}} onChange={e=>handleFile(e.target.files[0])}/>
              </div>
              {csvStatus&&<div style={csvStatus.ok?s.successBox:s.warnBox}>{csvStatus.msg}</div>}
              {employees.length>0&&(
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:C.rowAlt,borderRadius:8,padding:"10px 14px",border:`1px solid ${C.border}`}}>
                  <span style={{fontSize:13,fontWeight:600,color:C.pri}}>{employees.length} colaboradores · Semana: <strong>{semanaLabel}</strong></span>
                  <button style={s.btnAcc} onClick={()=>setVtTab("ponto")}>Ver Ponto →</button>
                </div>
              )}
            </div>
          )}

          {/* ── TAB MANUAL ── */}
          {vtTab==="manual"&&(
            <div style={s.card}>
              <div style={s.cardTitle}>✏️ Cadastro manual de colaboradores</div>
              <div style={s.infoBox}>Use quando o arquivo do ponto não estiver disponível. Vá para a aba <strong>Ponto</strong> para marcar as presenças.</div>
              {employees.length===0?(
                <div style={{textAlign:"center",color:C.muted,padding:"20px 0",fontSize:13}}>Nenhum colaborador ainda.</div>
              ):(
                <table style={{...s.table,marginBottom:14}}>
                  <thead><tr>
                    <th style={{...s.th,width:32}}>#</th>
                    <th style={s.th}>Nome</th>
                    <th style={{...s.th,width:160}}>Escala</th>
                    <th style={{...s.th,width:70}}></th>
                  </tr></thead>
